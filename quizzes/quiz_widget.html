<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(150, 150, 150, 0.3); border-radius: 9999px; }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-2 sm:p-4">
  <div class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-2xl p-4 sm:p-5 shadow-sm space-y-4 max-w-2xl mx-auto">
    
    <!-- Header & Chapter Selector -->
    <div class="flex items-center justify-between gap-2 flex-wrap pb-3 border-b border-[var(--border)]">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="font-bold text-sm tracking-tight">Interactive Quiz Practice</span>
      </div>
      <div class="flex items-center gap-2">
        <select id="chapter-select" onchange="changeChapter(this.value)" class="text-xs font-medium bg-[var(--background)] border border-[var(--border)] rounded-lg px-2.5 py-1 text-[var(--foreground)] focus:outline-none focus:ring-1 focus:ring-blue-500">
          <option value="all">📚 ทุกบทเรียน (154 ข้อ)</option>
          <option value="ch1">บทที่ 1: Malware (18)</option>
          <option value="ch2">บทที่ 2: DoS & Lab 4 (20)</option>
          <option value="ch3">บทที่ 3: Scanning & Lab 3 (20)</option>
          <option value="ch4">บทที่ 4: IDPS & Lab 5 (20)</option>
          <option value="ch5">บทที่ 5: Firewall & Lab 6 (20)</option>
          <option value="ch6">บทที่ 6: Testing (18)</option>
          <option value="ch7">บทที่ 7: VPN & Lab 7 (20)</option>
          <option value="ch8">บทที่ 8: Cloud & IAM (18)</option>
        </select>
        <span id="score-badge" class="text-xs px-2 py-0.5 rounded-md bg-emerald-500/15 text-emerald-400 font-semibold border border-emerald-500/30">
          0/0
        </span>
      </div>
    </div>

    <!-- Question Box -->
    <div class="space-y-3">
      <div class="flex items-center justify-between text-xs text-[var(--muted-foreground)]">
        <span id="q-category" class="font-semibold text-indigo-400">บทที่ 1</span>
        <span id="q-index">ข้อที่ 1 / 20</span>
      </div>
      
      <div id="q-text" class="text-sm sm:text-base font-medium leading-relaxed">
        กำลังโหลดคำถาม...
      </div>
    </div>

    <!-- 4 Choices -->
    <div id="choices-box" class="space-y-2">
      <!-- choices here -->
    </div>

    <!-- Instant Answer / Explanation -->
    <div id="feedback-box" class="hidden rounded-xl border p-3.5 space-y-2 text-xs leading-relaxed transition-all">
      <div id="feedback-title" class="font-bold text-xs sm:text-sm flex items-center gap-1.5"></div>
      <div id="feedback-desc" class="opacity-90"></div>
    </div>

    <!-- Controls -->
    <div class="flex items-center justify-between pt-2 border-t border-[var(--border)]">
      <button onclick="prevQ()" id="btn-p" class="px-3 py-1.5 rounded-lg border border-[var(--border)] text-xs font-medium hover:bg-[var(--background)] transition disabled:opacity-30 disabled:pointer-events-none">
        ⬅ ก่อนหน้า
      </button>
      <button onclick="shuffleQ()" class="text-xs text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition flex items-center gap-1">
        🔀 สุ่ม
      </button>
      <button onclick="nextQ()" id="btn-n" class="px-4 py-1.5 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold hover:opacity-90 transition disabled:opacity-30 disabled:pointer-events-none">
        ถัดไป ➡
      </button>
    </div>

  </div>

  <script>
    const QUESTIONS = [{"id": "ch1_q1", "chapter_id": "ch1", "chapter_title": "บทที่ 1: Malware & Countermeasures", "reference": "Stallings Ch.6", "q_num": 1, "question": "ตามนิยามของ **NIST SP 800-83** ข้อใดสรุปความหมายของ **Malware** ได้ถูกต้องที่สุด?", "choices": {"A": "ซอฟต์แวร์ที่มีข้อผิดพลาดในการเขียนโค้ด (Software Bug) จนส่งผลให้เครื่องคอมพิวเตอร์แฮงก์", "B": "โปรแกรมที่ถูกนำเข้าสู่ระบบโดยเจตนาซ่อนเร้น เพื่อทำลาย Confidentiality, Integrity หรือ Availability ของข้อมูล แอปพลิเคชัน หรือระบบปฏิบัติการ", "C": "ไฟล์ระบบของ Windows หรือ Linux ที่เสียหายจากการปิดระบบผิดวิธี", "D": "สคริปต์ที่ทำงานอัตโนมัติบนเว็บเซิร์ฟเวอร์เพื่อเก็บ Log สถิติผู้ใช้งาน"}, "answer": "B", "explanation": "NIST SP 800-83 นิยาม Malware ว่าเป็นโปรแกรมที่ถูกใส่เข้าสู่ระบบโดยแอบแฝง (covertly) เพื่อละเมิดความมั่นคงปลอดภัยด้าน Confidentiality, Integrity, หรือ Availability (CIA Triad) ของเหยื่อ หรือสร้างความปั่นป่วนรบกวน\n\n---"}, {"id": "ch1_q2", "chapter_id": "ch1", "chapter_title": "บทที่ 1: Malware & Countermeasures", "reference": "Stallings Ch.6", "q_num": 2, "question": "การจำแนกประเภทของมัลแวร์ตามโครงสร้างการพึ่งพา มัลแวร์ประเภทใดจัดอยู่ในกลุ่ม **Parasitic (ต้องพึ่งพาโปรแกรมพาหะ)** และไม่สามารถทำงานได้เดี่ยวๆ?", "choices": {"A": "Worm", "B": "Botnet", "C": "Virus", "D": "Spam Bot"}, "answer": "C", "explanation": "มัลแวร์แบ่งเป็น 2 กลุ่มใหญ่ คือกลุ่มที่ต้องการพาหะ (Parasitic / Need Host Program) เช่น Virus และ Macro Virus และกลุ่มที่เป็นเอกเทศทำงานได้อิสระ (Independent) เช่น Worm, Bot\n\n---"}, {"id": "ch1_q3", "chapter_id": "ch1", "chapter_title": "บทที่ 1: Malware & Countermeasures", "reference": "Stallings Ch.6", "q_num": 3, "question": "วงจรชีวิตของไวรัส (Virus Phases) ประกอบด้วย 4 ขั้นตอน ข้อใดเรียงลำดับขั้นตอนได้อย่างถูกต้อง?", "choices": {"A": "Propagation Phase -> Dormant Phase -> Triggering Phase -> Execution Phase", "B": "Dormant Phase -> Propagation Phase -> Triggering Phase -> Execution Phase", "C": "Triggering Phase -> Dormant Phase -> Propagation Phase -> Execution Phase", "D": "Propagation Phase -> Execution Phase -> Dormant Phase -> Triggering Phase"}, "answer": "B", "explanation": "วงจรชีวิตของไวรัสเรียงตามลำดับคือ:\n1. **Dormant Phase:** ไวรัสสงบนิ่งรอเงื่อนไขกระตุ้น\n2. **Propagation Phase:** ไวรัสแพร่กระจายและทำสำเนาตัวเองไปยังโปรแกรมหรือดิสก์อื่น\n3. **Triggering Phase:** มีเงื่อนไขเฉพาะมากระตุ้นให้เริ่มทำงาน\n4. **Execution Phase:** ทำงานตามฟังก์ชัน Payload (เช่น ลบไฟล์ หรือแสดงข้อความ)\n\n---"}, {"id": "ch1_q4", "chapter_id": "ch1", "chapter_title": "บทที่ 1: Malware & Countermeasures", "reference": "Stallings Ch.6", "q_num": 4, "question": "องค์ประกอบของไวรัสส่วนใดที่ทำหน้าที่ตรวจสอบเงื่อนไขเวลาหรือเหตุการณ์ (Logic Bomb) ก่อนที่ Payload จะทำงาน?", "choices": {"A": "Infection Mechanism (Vector)", "B": "Replication Engine", "C": "Trigger", "D": "Encryptor"}, "answer": "C", "explanation": "โครงสร้างไวรัสมี 3 ส่วนสำคัญคือ 1. Infection Mechanism (วิธีการแพร่เชื้อ), 2. Trigger (ตัวตรวจสอบเงื่อนไข เช่น วันที่ หรือการกดปุ่ม เรียกว่า Logic Bomb), 3. Payload (การกระทำที่แท้จริง เช่น ทำลายข้อมูลหรือขโมยรหัส)\n\n---"}, {"id": "ch1_q5", "chapter_id": "ch1", "chapter_title": "บทที่ 1: Malware & Countermeasures", "reference": "Stallings Ch.6", "q_num": 5, "question": "ไวรัสประเภทใดที่ทำการติดเชื้อโดยฝังตัวลงใน **Master Boot Record (MBR)** หรือ Partition Boot Record เพื่อให้โค้ดของมันถูกโหลดเข้าสู่หน่วยความจำตั้งแต่ขั้นตอนเปิดเครื่อง ก่อนที่ระบบปฏิบัติการจะบูตเสร็จ?", "choices": {"A": "Macro Virus", "B": "Boot Sector Infector", "C": "Multipartite Virus", "D": "File Infector"}, "answer": "B", "explanation": "Boot Sector Infector ทำการแพร่เชื้อใน MBR หรือบูตเซกเตอร์ของฟลอปปีดิสก์/ฮาร์ดดิสก์ และจะรันโค้ดก่อน OS บูต\n\n---"}, {"id": "ch1_q6", "chapter_id": "ch1", "chapter_title": "บทที่ 1: Malware & Countermeasures", "reference": "Stallings Ch.6", "q_num": 6, "question": "ไวรัสประเภท **Macro Virus** มีลักษณะการทำงานและแพร่ระบาดอย่างไร?", "choices": {"A": "แพร่เชื้อผ่าน BIOS Flash Memory เท่านั้น", "B": "แนบตัวไปกับเอกสารที่รองรับสคริปต์คำสั่งอัตโนมัติ เช่น Microsoft Word หรือ Excel", "C": "แก้ไขไฟล์ Master File Table (MFT) บนไดรฟ์ NTFS โดยตรง", "D": "แปลงโค้ดตัวเองเป็นไฟล์ไบนารีระดับ Assembly x86 เท่านั้น"}, "answer": "B", "explanation": "Macro Virus แพร่กระจายผ่าน Macro Script (เช่น VBA) ที่ฝังอยู่ในเอกสารแอปพลิเคชันอย่าง Microsoft Office และเป็นแพลตฟอร์มอิสระ (Platform-independent) ทำงานได้บนทุก OS ที่รันโปรแกรมนั้น\n\n---"}, {"id": "ch1_q7", "chapter_id": "ch1", "chapter_title": "บทที่ 1: Malware & Countermeasures", "reference": "Stallings Ch.6", "q_num": 7, "question": "เทคนิคการหลบเลี่ยงการตรวจจับของไวรัสแบบ **Polymorphic Virus** แตกต่างจาก **Encrypted Virus** แบบดั้งเดิมอย่างไร?", "choices": {"A": "Polymorphic Virus ไม่มีการเข้ารหัส Payload", "B": "Polymorphic Virus จะสร้างชุดถอดรหัส (Decryption Routine) ที่มีหน้าตาและการคำนวณเปลี่ยนไปทุกครั้งที่แพร่พันธุ์ ทำให้ Signature ของ Routine ไม่ซ้ำเดิม", "C": "Encrypted Virus ไม่ใช้ Key ในการถอดรหัส", "D": "Polymorphic Virus ทำงานได้เฉพาะบนระบบเครือข่ายไร้สาย"}, "answer": "B", "explanation": "Encrypted Virus ทั่วไปจะใช้ Decryption Routine เดิมเปลี่ยนแค่ Key ทำให้ Antivirus ตรวจจับจาก Signature ของตัว Decryption Routine ได้ แต่ Polymorphic Virus มี Mutation Engine ที่สร้าง Decryption Routine รูปแบบใหม่เรื่อยๆ จึงไม่มี Signature คงที่\n\n---"}, {"id": "ch1_q8", "chapter_id": "ch1", "chapter_title": "บทที่ 1: Malware & Countermeasures", "reference": "Stallings Ch.6", "q_num": 8, "question": "การซ่อนตัวแบบ **Metamorphic Virus** คืออะไร?", "choices": {"A": "การแปลงส่วนหัวของไฟล์ PE (Portable Executable) เป็น PDF", "B": "การเขียนรหัสโปรแกรมทั้งหมดขึ้นมาใหม่ (Rewrite) โดยสมบูรณ์ในทุกการแพร่กระจาย ทั้งโครงสร้างและชุดคำสั่ง แต่ยังคงพฤติกรรมเดิมไว้", "C": "การย้ายไฟล์ไปไว้ในไดเรกทอรี Temp แล้วเปลี่ยนนามสกุลไฟล์", "D": "การใช้ rootkit ซ่อนโปรเซสใน Task Manager"}, "answer": "B", "explanation": "Metamorphic Virus มีความซับซ้อนสูงสุด โดยจะ Disassemble ตัวเองแล้ว Recompile/Reorganize โค้ดใหม่ทั้งหมดทุกครั้ง ทำให้ทั้งโค้ดและพฤติกรรมในระดับคำสั่งเปลี่ยนไปโดยสิ้นเชิง ไม่มีตัวถอดรหัสตายตัว\n\n---"}, {"id": "ch1_q9", "chapter_id": "ch1", "chapter_title": "บทที่ 1: Malware & Countermeasures", "reference": "Stallings Ch.6", "q_num": 9, "question": "ในกลไกการค้นหาเหยื่อ (Target Discovery / Scanning) ของคอมพิวเตอร์เวิร์ม (Worm) วิธีการแบบ **Hit-List Scanning** คือข้อใด?", "choices": {"A": "สุ่ม IP address บนอินเทอร์เน็ตไปเรื่อยๆ โดยใช้ Pseudo-random generator", "B": "รวบรวมรายชื่อเป้าหมายที่มีช่องโหว่ไว้ล่วงหน้าเป็นก้อนข้อมูล แล้วส่งต่อและแบ่งรายชื่อให้เครื่องที่ติดเชื้อใหม่ช่วยกันสแกน", "C": "ตรวจหาข้อมูลเครื่องเป้าหมายจากไฟล์ hosts, address book หรือประวัติเว็บในเครื่องเหยื่อ", "D": "สแกนเฉพาะเครือข่าย Local Subnet เดียวกัน (/24)"}, "answer": "B", "explanation": "Hit-List scanning คือผู้โจมตีทำลิสต์ IP เป้าหมายที่มีช่องโหว่ไว้ล่วงหน้า เมื่อโจมตีสำเร็จ เครื่องใหม่จะได้รับลิสต์ไปครึ่งหนึ่งเพื่อโจมตีต่อแบบทวีคูณ ทำให้แพร่ระบาดเร็วมากในช่วงเริ่มต้น\n\n---"}, {"id": "ch1_q10", "chapter_id": "ch1", "chapter_title": "บทที่ 1: Malware & Countermeasures", "reference": "Stallings Ch.6", "q_num": 10, "question": "Worm ตัวใดที่สร้างความเสียหายระดับโลกในปี 2017 โดยใช้ช่องโหว่ **EternalBlue (MS17-010)** ในโพรโทคอล SMBv1 เพื่อแพร่กระจายตัวเองอย่างรวดเร็วและเรียกค่าไถ่ไฟล์ข้อมูล?", "choices": {"A": "Morris Worm", "B": "Melissa", "C": "Code Red", "D": "WannaCry"}, "answer": "D", "explanation": "WannaCry เป็น Ransomware Cryptoworm ที่แพร่กระจายผ่านช่องโหว่ Remote Code Execution ของ SMBv1 (EternalBlue / MS17-010) บนพอร์ต TCP 445\n\n---"}, {"id": "ch1_q11", "chapter_id": "ch1", "chapter_title": "บทที่ 1: Malware & Countermeasures", "reference": "Stallings Ch.6", "q_num": 11, "question": "เทคนิคการโจมตีทางเว็บแบบ **Drive-by-Download** มีลักษณะอย่างไร?", "choices": {"A": "ผู้ใช้ต้องกดตกลงและยอมรับการรันไฟล์ Execute (.exe) ด้วยตนเองเสมอ", "B": "การที่เหยื่อเพียงแค่เปิดเข้าชมหน้าเว็บเพจที่มีสคริปต์อันตราย โค้ดจะใช้ช่องโหว่ของเบราว์เซอร์หรือปลั๊กอินเพื่อดาวน์โหลดและติดตั้งมัลแวร์โดยที่ผู้ใช้ไม่ได้คลิกยินยอม", "C": "ผู้โจมตีส่งอีเมลฟิชชิงแนบลิงก์ Google Drive", "D": "การดาวน์โหลดไฟล์ผ่าน BitTorrent ข้ามเครือข่าย"}, "answer": "B", "explanation": "Drive-by-download เกิดขึ้นเมื่อผู้ใช้เข้าชมเว็บเพจที่มีโค้ดประสงค์ร้ายฝังอยู่ แล้วโค้ดนั้นใช้ช่องโหว่ของ Browser/Plugin แอบดาวน์โหลดและรันมัลแวร์ในเครื่องเหยื่อทันทีโดยไม่ต้องมีการยืนยันจากผู้ใช้\n\n---"}, {"id": "ch1_q12", "chapter_id": "ch1", "chapter_title": "บทที่ 1: Malware & Countermeasures", "reference": "Stallings Ch.6", "q_num": 12, "question": "การโจมตีแบบ **Watering Hole Attack** มุ่งเน้นการโจมตีกลุ่มเป้าหมายด้วยวิธีการใด?", "choices": {"A": "ส่ง SMS หลอกลวงไปยังเบอร์โทรศัพท์ของเหยื่อทุกคนในองค์กร", "B": "แฮกและฝังโค้ดมัลแวร์ไว้บนเว็บไซต์ภายนอกที่กลุ่มเป้าหมาย (เช่น บุคลากรในอุตสาหกรรมเฉพาะ) นิยมเข้าใช้งานเป็นประจำ", "C": "ปล่อยสัญญาณ Wi-Fi ปลอมในร้านกาแฟ", "D": "ส่งมัลแวร์เข้าสู่ระบบประปาของเมือง"}, "answer": "B", "explanation": "Watering Hole Attack เลียนแบบสัตว์นักล่าที่ไปดักรอเหยื่อที่แหล่งน้ำ โดยผู้โจมตีจะระบุว่ากลุ่มเป้าหมายชอบเข้าเว็บใดเป็นประจำ แล้วแฮกเว็บนั้นเพื่อปล่อยมัลแวร์ใส่ผู้ที่แวะเข้ามา\n\n---"}, {"id": "ch1_q13", "chapter_id": "ch1", "chapter_title": "บทที่ 1: Malware & Countermeasures", "reference": "Stallings Ch.6", "q_num": 13, "question": "การโจมตีที่หลอกให้ผู้ใช้คลิกสิ่งที่ดูเหมือนไม่มีพิษภัย (เช่น ปุ่มเล่นวิดีโอ) แต่แท้จริงแล้วมีเลเยอร์โปร่งใส (Transparent iframe) ซ้อนทับอยู่ ทำให้การคลิกนั้นกลายเป็นการกด Like, การโอนเงิน หรือการสั่งรันคำสั่งอันตราย เรียกว่าอะไร?", "choices": {"A": "Clickjacking (UI Redressing)", "B": "SQL Injection", "C": "Buffer Overflow", "D": "Cross-Site Scripting (XSS)"}, "answer": "A", "explanation": "Clickjacking หรือ User Interface (UI) redressing ใช้เฟรมแบบโปร่งใสซ้อนทับองค์ประกอบหน้าเว็บ เพื่อหลอกให้ผู้ใช้กด action ที่ไม่พึงประสงค์โดยไม่รู้ตัว\n\n---"}, {"id": "ch1_q14", "chapter_id": "ch1", "chapter_title": "บทที่ 1: Malware & Countermeasures", "reference": "Stallings Ch.6", "q_num": 14, "question": "ไวรัสคอมพิวเตอร์ในอดีตตัวใดที่มีชื่อเสียงด้าน Payload ในการทำลายฮาร์ดแวร์โดยตรง ด้วยการพยายามเขียนทับ **Flash BIOS** และเขียนทับข้อมูลในฮาร์ดดิสก์?", "choices": {"A": "Melissa", "B": "Chernobyl (CIH Virus)", "C": "Stuxnet", "D": "Sasser"}, "answer": "B", "explanation": "ไวรัส CIH หรือ Chernobyl ไวรัสจะกระตุ้นการทำงานในวันที่ 26 เมษายน โดย Payload จะเขียนข้อมูลขยะทับ Flash BIOS ของเมนบอร์ดและเขียนทับตารางพาร์ทิชันบนฮาร์ดดิสก์ ทำให้เครื่องเปิดไม่ติด\n\n---"}, {"id": "ch1_q15", "chapter_id": "ch1", "chapter_title": "บทที่ 1: Malware & Countermeasures", "reference": "Stallings Ch.6", "q_num": 15, "question": "โครงสร้างสถาปัตยกรรม Command and Control (C&C หรือ C2) ของ Botnet ในยุคใหม่มักเปลี่ยนจากการใช้โปรโตคอล IRC/HTTP รวมศูนย์ (Centralized) มาเป็นแบบใด เพื่อป้องกันการถูก Take-down จุดเดียว (Single Point of Failure)?", "choices": {"A": "Peer-to-Peer (P2P) Architecture", "B": "Telnet Architecture", "C": "Master-Slave Architecture", "D": "Ring Bus Topology"}, "answer": "A", "explanation": "Botnet ยุคหลังนิยมใช้สถาปัตยกรรมแบบ Peer-to-Peer (P2P) โดยบ็อตแต่ละตัวสามารถทำหน้าที่เป็นทั้ง Client และ Server กระจายคำสั่งต่อๆ กันไป ทำให้เจ้าหน้าที่ไม่สามารถปิด C2 Server แบบศูนย์กลางได้ง่ายๆ\n\n---"}, {"id": "ch1_q16", "chapter_id": "ch1", "chapter_title": "บทที่ 1: Malware & Countermeasures", "reference": "Stallings Ch.6", "q_num": 16, "question": "Rootkit ระดับใดที่มีสิทธิสูงสุดในการควบคุมระบบ และทำงานอยู่ต่ำกว่าตัวระบบปฏิบัติการหลัก (Operating System) ทำให้แอนตีไวรัสทั่วไปที่รันบน OS ไม่สามารถตรวจพบได้?", "choices": {"A": "User-mode Rootkit", "B": "Hypervisor / Kernel-mode / Firmware Rootkit", "C": "Application-level Rootkit", "D": "Shell Script Rootkit"}, "answer": "B", "explanation": "Kernel-mode, Hypervisor (Type-1) และ Firmware/BIOS Rootkit ทำงานที่ระดับ Ring 0 หรือลึกกว่านั้น (Ring -1, Ring -2) สามารถดัก Hook system calls และควบคุม OS ได้อย่างสมบูรณ์ จึงซ่อนตัวจากการตรวจสอบของ OS API\n\n---"}, {"id": "ch1_q17", "chapter_id": "ch1", "chapter_title": "บทที่ 1: Malware & Countermeasures", "reference": "Stallings Ch.6", "q_num": 17, "question": "วิวัฒนาการของซอฟต์แวร์ป้องกันไวรัส (Antivirus Software Generations) ข้อใดจับคู่รุ่นและเทคโนโลยีได้อย่างถูกต้องตามตำรา Stallings?", "choices": {"A": "1st Gen: Heuristic rules | 2nd Gen: Simple signatures", "B": "1st Gen: Simple scanners/signatures | 2nd Gen: Heuristic rules & integrity checking", "C": "3rd Gen: Dynamic sandboxing | 4th Gen: Simple scanners", "D": "2nd Gen: Activity traps | 3rd Gen: Simple signatures"}, "answer": "B", "explanation": "- รุ่นที่ 1 (1st Gen): Simple Scanners ตรวจจับด้วย Signature สตริงคงที่\n- รุ่นที่ 2 (2nd Gen): Heuristic Rules (วิเคราะห์ความน่าจะเป็น) และ Integrity Checking (ตรวจผลบวกตรวจสอบ Checksum/Hash)\n- รุ่นที่ 3 (3rd Gen): Activity Traps ตรวจจับพฤติกรรมดักจับใน Memory\n- รุ่นที่ 4 (4th Gen): Full-Featured Protection ผสมผสาน Behavior Blocking, Sandboxing และ Cloud Intelligence\n\n---"}, {"id": "ch1_q18", "chapter_id": "ch1", "chapter_title": "บทที่ 1: Malware & Countermeasures", "reference": "Stallings Ch.6", "q_num": 18, "question": "เทคนิค **Sandbox Analysis** ในระบบป้องกันมัลแวร์มีหลักการทำงานอย่างไร?", "choices": {"A": "การสแกนหาข้อความสตริงที่ตรงกับฐานข้อมูลในฮาร์ดดิสก์", "B": "การนำไฟล์ต้องสงสัยไปรันในสภาพแวดล้อมเสมือนที่ถูกแยกส่วน (Isolated Virtual Environment) เพื่อเฝ้าดูพฤติกรรมจริง เช่น การแก้ Registry, การสร้างไฟล์ หรือการเชื่อมต่อเครือข่าย", "C": "การบล็อก IP Address ขาเข้าทั้งหมดที่มาจากต่างประเทศ", "D": "การปิดการทำงานของพอร์ต USB บนเครื่องคอมพิวเตอร์"}, "answer": "B", "explanation": "Sandboxing คือการรันไฟล์ในสภาพแวดล้อมจำลองที่ตัดขาดจากเครือข่ายหลัก เพื่อบันทึกพฤติกรรม (Behavioral profiling) ก่อนตัดสินว่าเป็นมัลแวร์หรือไม่ ป้องกันไม่ให้ส่งผลเสียต่อระบบจริง"}, {"id": "ch2_q1", "chapter_id": "ch2", "chapter_title": "บทที่ 2: DoS/DDoS & Lab 4 (hping3/iperf3)", "reference": "Stallings Ch.7 & Lab 4", "q_num": 1, "question": "ตามมาตรฐาน NIST Computer Security Incident Handling Guide นิยามของ **Denial-of-Service (DoS)** คือข้อใด?", "choices": {"A": "การขโมยรหัสผ่านของผู้ดูแลระบบผ่านโปรโตคอล Telnet", "B": "การกระทำที่ขัดขวางหรือลดทอนความสามารถในการใช้งานเครือข่าย ระบบ หรือแอปพลิเคชัน โดยการทำให้ทรัพยากรหมดสิ้นไป (Exhausting resources) เช่น CPU, หน่วยความจำ, แบนด์วิดท์ หรือพื้นที่ดิสก์", "C": "การปลอมแปลงหน้าเว็บเพจเพื่อหลอกเก็บข้อมูลบัตรเครดิต", "D": "การเข้ารหัสข้อมูลในระบบเพื่อเรียกค่าไถ่"}, "answer": "B", "explanation": "DoS คือการโจมตีเป้าหมายที่ความพร้อมใช้งาน (Availability) มุ่งเน้นการทำให้ทรัพยากรหลัก เช่น CPU, RAM, Network Bandwidth, หรือ Disk Space หมดสิ้นไปจนไม่สามารถให้บริการผู้ใช้ทั่วไปได้\n\n---"}, {"id": "ch2_q2", "chapter_id": "ch2", "chapter_title": "บทที่ 2: DoS/DDoS & Lab 4 (hping3/iperf3)", "reference": "Stallings Ch.7 & Lab 4", "q_num": 2, "question": "การโจมตีแบบ **SYN Spoofing Attack** ส่งผลกระทบต่อตารางโครงสร้างข้อมูลใดของระบบปฏิบัติการเซิร์ฟเวอร์เป้าหมาย?", "choices": {"A": "Routing Table", "B": "ARP Cache Table", "C": "Connection Backlog Table (Half-open connection queue)", "D": "DNS Cache Table"}, "answer": "C", "explanation": "เมื่อเซิร์ฟเวอร์ได้รับแพ็กเก็ต TCP SYN ที่มี IP ต้นทางปลอม เซิร์ฟเวอร์จะตอบ SYN-ACK และจัดสรรหน่วยความจำใน Backlog Queue เพื่อรอ ACK สุดท้าย แต่เนื่องจากไม่ได้รับ ACK คิวจึงเต็ม (Queue Exhaustion) ทำให้ปฏิเสธการเชื่อมต่อใหม่จากผู้ใช้จริง\n\n---"}, {"id": "ch2_q3", "chapter_id": "ch2", "chapter_title": "บทที่ 2: DoS/DDoS & Lab 4 (hping3/iperf3)", "reference": "Stallings Ch.7 & Lab 4", "q_num": 3, "question": "เทคนิคใดที่ใช้แก้ไขปัญหา SYN Spoofing โดย**ไม่ต้องจัดสรรหน่วยความจำ (State Memory)** ใน Backlog Queue เมื่อได้รับ SYN packet แต่จะเข้ารหัสข้อมูล Session เก็บไว้ในฟิลด์ Initial Sequence Number (ISN) ของแพ็กเก็ต SYN-ACK แทน?", "choices": {"A": "Ingress Filtering", "B": "SYN Cookies", "C": "Reverse DNS Lookup", "D": "Port Knocking"}, "answer": "B", "explanation": "SYN Cookies ทำงานโดยการคำนวณ Cryptographic Hash จาก IP/Port ต้นทาง-ปลายทาง และค่าลับของเซิร์ฟเวอร์ แล้วนำไปใส่เป็นค่า Initial Sequence Number (ISN) ในแพ็กเก็ต SYN-ACK เมื่อไคลเอนต์ตอบ ACK กลับมา เซิร์ฟเวอร์จะแกะ ISN-1 เพื่อตรวจความถูกต้องและเปิด Session ทันทีโดยไม่ต้องจองหน่วยความจำล่วงหน้า\n\n---"}, {"id": "ch2_q4", "chapter_id": "ch2", "chapter_title": "บทที่ 2: DoS/DDoS & Lab 4 (hping3/iperf3)", "reference": "Stallings Ch.7 & Lab 4", "q_num": 4, "question": "ในการโจมตีแบบ **DNS Amplification Attack** ปัจจัยสำคัญ 2 ประการที่ทำให้ผู้โจมตีสามารถขยายขนาดทราฟฟิก (Amplification Factor) ให้มีขนาดใหญ่กว่าคำขอได้หลายสิบเท่าคืออะไร?", "choices": {"A": "การใช้โพรโทคอล TCP และคำขอแบบ HTTP GET", "B": "การใช้โพรโทคอล UDP (ไม่มี Handshake ทำให้ปลอม IP ต้นทางได้ง่าย) ร่วมกับคำขอประเภท `ANY` query หรือฟีเจอร์ EDNS0", "C": "การขโมย Private Key ของเซิร์ฟเวอร์ DNS", "D": "การส่งคำสั่ง Ping ขนาดใหญ่ (Ping of Death)"}, "answer": "B", "explanation": "DNS ใช้ UDP ทำให้สามารถปลอม IP แหล่งกำเนิดเป็น IP ของเหยื่อได้ง่าย และเมื่อส่งคำขอขนาดเล็ก (เช่น 60 ไบต์) พร้อมขอแบบ `ANY` query หรือเปิดใช้ EDNS0 เซิร์ฟเวอร์ DNS แบบ Open Resolver จะตอบกลับแพ็กเก็ตขนาดใหญ่ถึง 3,000-4,000 ไบต์กลับไปยังเหยื่อ\n\n---"}, {"id": "ch2_q5", "chapter_id": "ch2", "chapter_title": "บทที่ 2: DoS/DDoS & Lab 4 (hping3/iperf3)", "reference": "Stallings Ch.7 & Lab 4", "q_num": 5, "question": "การโจมตีประเภทใดจัดเป็น **Application-Layer DoS** ที่ส่งส่วนหัว HTTP Request แบบไม่สมบูรณ์และส่งต่อทีละน้อยอย่างช้าๆ (Slow Request Headers) เพื่อค้างการเชื่อมต่อของ Web Server ไว้นานที่สุดจน Connection Pool เต็ม?", "choices": {"A": "Ping of Death", "B": "Smurf Attack", "C": "Slowloris", "D": "Teardrop Attack"}, "answer": "C", "explanation": "Slowloris จะเปิดการเชื่อมต่อ HTTP ไปยังเว็บเซิร์ฟเวอร์เป้าหมาย แล้วส่ง HTTP headers ที่ไม่สมบูรณ์ทีละบรรทัดเป็นระยะๆ โดยไม่ส่งบรรทัดว่างปิดท้าย ทำให้เซิร์ฟเวอร์ต้องรอและรักษา Thread การเชื่อมต่อนั้นไว้จนเต็มขีดจำกัดที่รองรับได้\n\n---"}, {"id": "ch2_q6", "chapter_id": "ch2", "chapter_title": "บทที่ 2: DoS/DDoS & Lab 4 (hping3/iperf3)", "reference": "Stallings Ch.7 & Lab 4", "q_num": 6, "question": "ข้อกำหนดตามมาตรฐาน **BCP 38 (Best Current Practice 38 / RFC 2827)** แนะนำให้ผู้ให้บริการอินเทอร์เน็ต (ISP) ติดตั้งกลไกใดที่ขอบของเครือข่าย เพื่อสกัดการโจมตีแบบ DoS ที่มีการปลอมแปลง IP ต้นทาง (Source Address Spoofing)?", "choices": {"A": "Egress Payload Inspection", "B": "Ingress Filtering (บล็อกแพ็กเก็ตที่มี Source IP นอกช่วง Subnet ที่ได้รับอนุญาต)", "C": "Web Application Firewall", "D": "Port Redirection"}, "answer": "B", "explanation": "BCP 38 / RFC 2827 แนะนำการทำ Ingress Filtering บนเราเตอร์ขอบเครือข่าย โดยตรวจสอบว่า Source IP ของแพ็กเก็ตที่วิ่งออกจากเครือข่ายลูกค้าอยู่ในช่วง IP ที่ลูกค้าเป็นเจ้าของจริงหรือไม่ หากเป็น IP ปลอมแปลงจะทำการ Drop ทิ้งทันที\n\n---"}, {"id": "ch2_q7", "chapter_id": "ch2", "chapter_title": "บทที่ 2: DoS/DDoS & Lab 4 (hping3/iperf3)", "reference": "Stallings Ch.7 & Lab 4", "q_num": 7, "question": "ในคำสั่ง **hping3** ออปชันหรือพารามิเตอร์ใดที่ใช้กำหนดให้ทำงานในโหมด **ICMP Packet**?", "choices": {"A": "`-0` หรือ `--rawip`", "B": "`-1` หรือ `--icmp`", "C": "`-2` หรือ `--udp`", "D": "`-S` หรือ `--syn`"}, "answer": "B", "explanation": "ใน hping3 โหมดโปรโตคอลกำหนดด้วย:\n- `-0` หรือ `--rawip`: Raw IP mode\n- `-1` หรือ `--icmp`: ICMP mode (ค่าเริ่มต้นคือ ICMP echo request)\n- `-2` หรือ `--udp`: UDP mode\n- (หากไม่ระบุ จะเป็น TCP mode โดยดีฟอลต์)\n\n---"}, {"id": "ch2_q8", "chapter_id": "ch2", "chapter_title": "บทที่ 2: DoS/DDoS & Lab 4 (hping3/iperf3)", "reference": "Stallings Ch.7 & Lab 4", "q_num": 8, "question": "ใน Lab 4 มีการใช้คำสั่ง:\n```bash\nhping3 x.x.x.x -1 --flood\n```\nพารามิเตอร์ `--flood` มีพฤติกรรมการทำงานอย่างไร?", "choices": {"A": "ส่งแพ็กเก็ตแบบสุ่ม IP ปลายทาง 100 แพ็กเก็ตต่อวินาที", "B": "ส่งแพ็กเก็ตอย่างต่อเนื่องด้วยความเร็วสูงสุดเท่าที่ระบบจะส่งได้โดยไม่ต้องรอรับคำตอบ (No reply displayed)", "C": "สแกนพอร์ตตั้งแต่ 1 ถึง 65535", "D": "ส่งข้อมูลจำลองแบบ TCP 3-Way Handshake"}, "answer": "B", "explanation": "พารามิเตอร์ `--flood` ทำให้ hping3 ส่งแพ็กเก็ตออกไปอย่างรวดเร็วที่สุดโดยไม่หน่วงเวลา และจะไม่พิมพ์ผลการตอบรับออกมาบนหน้าจอ เพื่อประหยัด CPU ในการยิง Flood ทราฟฟิก\n\n---"}, {"id": "ch2_q9", "chapter_id": "ch2", "chapter_title": "บทที่ 2: DoS/DDoS & Lab 4 (hping3/iperf3)", "reference": "Stallings Ch.7 & Lab 4", "q_num": 9, "question": "หากต้องการใช้ **hping3** ทำการโจมตีแบบ **TCP SYN Flood** ไปยังเว็บเซิร์ฟเวอร์พอร์ต 80 โดยทำการสุ่ม IP ต้นทางเพื่อซ่อนตัวตน คำสั่งที่ถูกต้องตามหลัก Syntax คือข้อใด?", "choices": {"A": "`hping3 -S -p 80 --flood --rand-source x.x.x.x`", "B": "`hping3 -1 -p 80 --flood x.x.x.x`", "C": "`hping3 -2 -p 80 --spoof-all x.x.x.x`", "D": "`hping3 --tcp-syn 80 --randomize-all x.x.x.x`"}, "answer": "A", "explanation": "- `-S`: กำหนด TCP flag เป็น SYN\n- `-p 80`: ระบุ Target port เป็น 80\n- `--flood`: ส่งแบบความเร็วสูงสุด\n- `--rand-source`: สุ่ม Source IP address ของแพ็กเก็ต\n\n---"}, {"id": "ch2_q10", "chapter_id": "ch2", "chapter_title": "บทที่ 2: DoS/DDoS & Lab 4 (hping3/iperf3)", "reference": "Stallings Ch.7 & Lab 4", "q_num": 10, "question": "ใน Lab 4 ข้อควรระวังที่อาจารย์เน้นย้ำเป็นพิเศษก่อนเริ่มรันคำสั่ง **hping3** คือข้อใด?", "choices": {"A": "ต้องเชื่อมต่ออินเทอร์เน็ตผ่าน Wi-Fi เสมอ", "B": "ให้ลบ Default Route (เส้นทางออกภายนอก) ออกให้หมดก่อน เพื่อป้องกันไม่ให้ทราฟฟิก DoS หลุดรอดออกไปรบกวนโครงข่ายมหาวิทยาลัยภายนอก", "C": "ต้องตั้งรหัสผ่าน Root ใหม่ทุกครั้ง", "D": "ต้องเปิดโปรแกรม Wireshark บนเครื่องเหยื่อค้างไว้ตลอด"}, "answer": "B", "explanation": "ในชีต Lab 4 มีคำเตือนระบุชัดเจนว่า **\"ก่อนเริ่มใช้ hping3 ให้เอา Default Route ออกให้หมดก่อน\"** เพื่อป้องกันความผิดพลาดกรณีคำสั่งยิงแพ็กเก็ตหลุดออกสู่ภายนอกผ่าน Gateway ซึ่งอาจทำให้โครงข่ายหลักของมหาวิทยาลัยได้รับผลกระทบ\n\n---"}, {"id": "ch2_q11", "chapter_id": "ch2", "chapter_title": "บทที่ 2: DoS/DDoS & Lab 4 (hping3/iperf3)", "reference": "Stallings Ch.7 & Lab 4", "q_num": 11, "question": "คำสั่งในการเริ่มรัน **iperf3** ในฝั่ง Server โดยต้องการผูก (Bind) เข้ากับหมายเลข IP ที่ระบุเฉพาะเจาะจง คือข้อใด?", "choices": {"A": "`iperf3 -c x.x.x.x -s`", "B": "`iperf -s -B x.x.x.x`", "C": "`iperf3 --listen-all x.x.x.x`", "D": "`iperf3 -u -c x.x.x.x`"}, "answer": "B", "explanation": "- `-s`: กำหนดโหมดเป็น Server\n- `-B <ip>`: Bind เข้ากับ IP Address หรือ Interface ของเครื่องตนเองตามที่ระบุ (ในชีต Lab 4 ใช้ `iperf -s -B x.x.x.x`)\n\n---"}, {"id": "ch2_q12", "chapter_id": "ch2", "chapter_title": "บทที่ 2: DoS/DDoS & Lab 4 (hping3/iperf3)", "reference": "Stallings Ch.7 & Lab 4", "q_num": 12, "question": "จากคำสั่ง iperf3 ของฝั่งไคลเอนต์ (Observer) ใน Lab 4-A:\n```bash\niperf3 -c x.x.x.x -b 1M -t 30 -u\n```\nพารามิเตอร์ `-b 1M`, `-t 30` และ `-u` มีความหมายตามลำดับอย่างไร?", "choices": {"A": "Bandwidth 1 Mbps, ทำงาน 30 วินาที, ใช้โปรโตคอล UDP", "B": "Buffer size 1 MB, หน่วงเวลา 30 มิลลิวินาที, โหมด Unicast", "C": "Byte size 1 MB, ทดสอบ 30 รอบ, โหมด User", "D": "Broadcast 1 MHz, Timeout 30 วินาที, ใช้โปรโตคอล Unix Domain Socket"}, "answer": "A", "explanation": "- `-c x.x.x.x`: รันในโหมด Client เชื่อมต่อไปยัง IP ปลายทาง\n- `-b 1M`: กำหนด Target Bandwidth ส่งที่อัตรา 1 Mbit/sec\n- `-t 30`: ระยะเวลาในการทดสอบ (Time) เท่ากับ 30 วินาที\n- `-u`: ใช้โปรโตคอล UDP (หากไม่ใส่จะเป็น TCP)\n\n---"}, {"id": "ch2_q13", "chapter_id": "ch2", "chapter_title": "บทที่ 2: DoS/DDoS & Lab 4 (hping3/iperf3)", "reference": "Stallings Ch.7 & Lab 4", "q_num": 13, "question": "จากคำสั่ง iperf3 ใน Lab 4-B สำหรับทดสอบ TCP Traffic:\n```bash\niperf3 -c x.x.x.x -b 1M -t 30\n```\nเหตุใดคำสั่งนี้จึงไม่จำเป็นต้องระบุออปชัน `-u`?", "choices": {"A": "เพราะโปรแกรม iperf3 รองรับเฉพาะ TCP เท่านั้น", "B": "เพราะค่าดีฟอลต์ (Default) ของโปรแกรม iperf3 ทำงานบนโปรโตคอล TCP อยู่แล้ว", "C": "เพราะ TCP ห้ามกำหนดแบนด์วิดท์", "D": "เพราะพารามิเตอร์ `-t 30` หมายถึง TCP อัตโนมัติ"}, "answer": "B", "explanation": "iperf3 ถูกออกแบบมาโดยมี Default Protocol เป็น TCP ดังนั้นเมื่อต้องการทดสอบ TCP จึงไม่ต้องใส่ออปชัน `-u`\n\n---"}, {"id": "ch2_q14", "chapter_id": "ch2", "chapter_title": "บทที่ 2: DoS/DDoS & Lab 4 (hping3/iperf3)", "reference": "Stallings Ch.7 & Lab 4", "q_num": 14, "question": "ในการทดสอบ **Lab 4-A (Impact of DoS on UDP Traffic)** พารามิเตอร์วัดประสิทธิภาพ (Metrics) 3 ตัวหลักที่ต้องบันทึกที่ฝั่ง Receiver ได้แก่อะไรบ้าง?", "choices": {"A": "CPU Usage, Memory Leak, Disk I/O", "B": "Bit Rate, Packet Loss Rate, และ Jitter", "C": "Ping Time, Round Trip Time, Frame Size", "D": "Window Size, TCP Flags, Retransmission Count"}, "answer": "B", "explanation": "ในชีต Lab 4-A ระบุให้: \"บันทึก Bit Rate, Loss Rate, และ Jitter ที่วัดที่ฝั่ง Receiver\" เนื่องจาก UDP เป็น Connectionless จึงวัดความผันผวนของความล่าช้า (Jitter) และอัตราการสูญหายของแพ็กเก็ต (Loss Rate)\n\n---"}, {"id": "ch2_q15", "chapter_id": "ch2", "chapter_title": "บทที่ 2: DoS/DDoS & Lab 4 (hping3/iperf3)", "reference": "Stallings Ch.7 & Lab 4", "q_num": 15, "question": "ในการทดสอบ **Lab 4-B (Impact of DoS on TCP Traffic)** ค่าสถิติที่สำคัญที่ต้องบันทึกเพิ่มเติมจากฝั่ง Sender (ผู้ส่ง) ซึ่งบ่งชี้ว่าเครือข่ายเกิดปัญหาขัดข้องจาก DoS คือค่าใด?", "choices": {"A": "Jitter", "B": "Retransmit Count (จำนวนครั้งที่เกิดการส่งข้อมูลซ้ำ)", "C": "Hop Count", "D": "MTU Size"}, "answer": "B", "explanation": "สำหรับ TCP ซึ่งมีระบบ Flow Control และ Reliability เมื่อเกิดความแออัดหรือคอขวดจาก DoS แพ็กเก็ตสูญหายจะทำให้ Sender ต้องส่งแพ็กเก็ตเดิมซ้ำ จึงต้องบันทึก Retransmits จากฝั่ง Sender\n\n---"}, {"id": "ch2_q16", "chapter_id": "ch2", "chapter_title": "บทที่ 2: DoS/DDoS & Lab 4 (hping3/iperf3)", "reference": "Stallings Ch.7 & Lab 4", "q_num": 16, "question": "เมื่อเกิด ICMP Flood บนลิงก์เครือข่าย ผลกระทบที่เกิดขึ้นกับ **UDP Traffic** และ **TCP Traffic** ของผู้ใช้งานปกติ มีความแตกต่างกันอย่างไรในเชิงพฤติกรรมการทำงาน?", "choices": {"A": "UDP จะส่งซ้ำแพ็กเก็ตอัตโนมัติ ส่วน TCP จะทิ้งข้อมูลทันที", "B": "UDP จะเกิด Packet Loss สูงขึ้นและมี Jitter แกว่งตัว แต่ตัวส่งจะไม่ลดความเร็วลง ขณะที่ TCP จะตรวจพบ Packet Loss ทำให้ระบบ Congestion Control ปรับลดขนาด Window Size และลด Bit Rate ลงอย่างมากเพื่อหลีกเลี่ยงความแออัด", "C": "ทั้ง UDP และ TCP จะรักษาความเร็วไว้คงที่เท่าเดิมเสมอ", "D": "TCP จะหยุดส่งข้อมูลทันทีและตัดสาย แต่ UDP จะตัดการเชื่อมต่อ"}, "answer": "B", "explanation": "UDP ไม่มีกลไกตรวจจับความแออัด (No Congestion Control) จึงส่งอัตราเดิมทำให้ Loss พุ่งสูง ส่วน TCP มีกลไก Exponential Backoff และ Congestion Window Reduction ทำให้เมื่อแพ็กเก็ตตกหล่น TCP จะลดอัตราการส่งลงอย่างมากเพื่อประคองลิงก์\n\n---"}, {"id": "ch2_q17", "chapter_id": "ch2", "chapter_title": "บทที่ 2: DoS/DDoS & Lab 4 (hping3/iperf3)", "reference": "Stallings Ch.7 & Lab 4", "q_num": 17, "question": "หากต้องการใช้คำสั่ง `ip route` บน Linux เพื่อลบ **Default Route** ของเครื่องก่อนทำการทดสอบตามเงื่อนไขของ Lab ต้องใช้คำสั่งใด?", "choices": {"A": "`ip route flush cache`", "B": "`ip route del default`", "C": "`iptables -F`", "D": "`route -n clean`"}, "answer": "B", "explanation": "คำสั่งในชุด `iproute2` บน Linux สำหรับลบ default gateway คือ `ip route del default` (หรือ `route del default` ในคำสั่งแบบดั้งเดิม)\n\n---"}, {"id": "ch2_q18", "chapter_id": "ch2", "chapter_title": "บทที่ 2: DoS/DDoS & Lab 4 (hping3/iperf3)", "reference": "Stallings Ch.7 & Lab 4", "q_num": 18, "question": "การโจมตีแบบ **NTP Amplification Attack** อาศัยคำสั่งคิวรีโบราณคำสั่งใดของ NTP daemon ที่ส่งรายชื่อ 600 IP ล่าสุดที่เคยมาเชื่อมต่อกลับมาเป็นก้อนข้อมูลขนาดใหญ่?", "choices": {"A": "`monlist`", "B": "`gettime`", "C": "`peerlist`", "D": "`ntptrace`"}, "answer": "A", "explanation": "คำสั่ง `monlist` ใน NTP เก่าจะส่งผลลัพธ์ย้อนหลังเป็นรายชื่อโฮสต์ 600 โฮสต์ล่าสุด ซึ่งทำให้เกิดการขยายขนาดทราฟฟิก (Amplification) ได้มากกว่า 500 เท่าของขนาดคำขอ\n\n---"}, {"id": "ch2_q19", "chapter_id": "ch2", "chapter_title": "บทที่ 2: DoS/DDoS & Lab 4 (hping3/iperf3)", "reference": "Stallings Ch.7 & Lab 4", "q_num": 19, "question": "ในสถาปัตยกรรม **Distributed Denial of Service (DDoS)** เครื่องที่ถูกควบคุมโดยแฮกเกอร์เพื่อทำหน้าที่รับคำสั่งจาก Master แล้วส่งต่อไปสั่งการ Bot/Zombie หลายร้อยเครื่องพร้อมกัน มีชื่อเรียกว่าอะไร?", "choices": {"A": "Honeypot", "B": "Handler (หรือ Command Node)", "C": "Edge Gateway", "D": "Bastion Server"}, "answer": "B", "explanation": "สถาปัตยกรรม DDoS แบบคลาสสิกประกอบด้วย Attacker -> Handler / Master -> Zombie / Agent -> Victim\n\n---"}, {"id": "ch2_q20", "chapter_id": "ch2", "chapter_title": "บทที่ 2: DoS/DDoS & Lab 4 (hping3/iperf3)", "reference": "Stallings Ch.7 & Lab 4", "q_num": 20, "question": "คำสั่งใดของ **hping3** ที่ใช้ส่งแพ็กเก็ตแบบ UDP Flood ไปยังพอร์ต 53 ของเครื่องเป้าหมาย 192.168.1.50?", "choices": {"A": "`hping3 -2 -p 53 --flood 192.168.1.50`", "B": "`hping3 --icmp -p 53 192.168.1.50`", "C": "`hping3 -S -p 53 192.168.1.50`", "D": "`hping3 --udp-flood -d 53 192.168.1.50`"}, "answer": "A", "explanation": "`-2` กำหนดโหมด UDP, `-p 53` กำหนดปลายทางพอร์ต 53, และ `--flood` คือยิงทราฟฟิกด้วยความเร็วสูงสุด"}, {"id": "ch3_q1", "chapter_id": "ch3", "chapter_title": "บทที่ 3: Cyber Attacks & Lab 3 (Nmap)", "reference": "Week 7-8 & Lab 3", "q_num": 1, "question": "ตามมาตรฐาน **RFC 2828** ผลกระทบจากภัยคุกคาม (Threat Consequences) ถูกจัดหมวดหมู่ออกเป็น 4 รูปแบบหลัก ข้อใดระบุได้ถูกต้องครบถ้วน?", "choices": {"A": "Confidentiality, Integrity, Availability, Non-Repudiation", "B": "Unauthorized Disclosure, Deception, Disruption, Usurpation", "C": "Spoofing, Tampering, Repudiation, Denial of Service", "D": "Scanning, Exploitation, Infection, Exfiltration"}, "answer": "B", "explanation": "RFC 2828 จัดกลุ่มผลลัพธ์ของภัยคุกคามเป็น 4 ด้าน:\n1. Unauthorized Disclosure (การเปิดเผยข้อมูลโดยไม่ได้รับอนุญาต)\n2. Deception (การหลอกลวง/ข้อมูลเท็จ)\n3. Disruption (การขัดขวางการทำงาน)\n4. Usurpation (การเข้ายึดครองหรือครอบงำบริการ/สิทธิ์โดยมิชอบ)\n\n---"}, {"id": "ch3_q2", "chapter_id": "ch3", "chapter_title": "บทที่ 3: Cyber Attacks & Lab 3 (Nmap)", "reference": "Week 7-8 & Lab 3", "q_num": 2, "question": "แบบจำลองภัยคุกคาม **STRIDE** ของ Microsoft แต่ละตัวอักษรมีความหมายตรงกับข้อใดตามลำดับ?", "choices": {"A": "Scanning, Tracking, Recon, Injection, Decryption, Evasion", "B": "Spoofing, Tampering, Repudiation, Information Disclosure, Denial of Service, Elevation of Privilege", "C": "Security, Trust, Reliability, Integrity, Defense, Encryption", "D": "Source, Target, Route, Interface, Domain, Endpoint"}, "answer": "B", "explanation": "STRIDE คือกรอบ Threat Modeling:\n- **S:** Spoofing (การปลอมแปลงตัวตน)\n- **T:** Tampering (การแก้ไขดัดแปลงข้อมูล)\n- **R:** Repudiation (การปฏิเสธความรับผิดชอบ)\n- **I:** Information Disclosure (การรั่วไหลของข้อมูล)\n- **D:** Denial of Service (การทำให้ระบบหยุดทำงาน)\n- **E:** Elevation of Privilege (การยกระดับสิทธิ์โดยมิชอบ)\n\n---"}, {"id": "ch3_q3", "chapter_id": "ch3", "chapter_title": "บทที่ 3: Cyber Attacks & Lab 3 (Nmap)", "reference": "Week 7-8 & Lab 3", "q_num": 3, "question": "โมเดลประเมินความเสี่ยง **DREAD** ตัวอักษร **E** และ **D** ตัวสุดท้าย ย่อมาจากคำใด?", "choices": {"A": "Encryption และ Decryption", "B": "Exploitability (ความง่ายในการโจมตีช่องโหว่) และ Discoverability (ความง่ายในการค้นพบช่องโหว่)", "C": "Execution และ Destruction", "D": "Efficiency และ Durability"}, "answer": "B", "explanation": "DREAD ประกอบด้วย:\n- **D:** Damage (ความเสียหายที่เกิดขึ้น)\n- **R:** Reproducibility (ความสามารถในการทำซ้ำการโจมตี)\n- **E:** Exploitability (ความยากง่ายในการเจาะระบบ)\n- **A:** Affected Users (ปริมาณผู้ใช้ที่ได้รับผลกระทบ)\n- **D:** Discoverability (ความยากง่ายในการตรวจพบช่องโหว่)\n\n---"}, {"id": "ch3_q4", "chapter_id": "ch3", "chapter_title": "บทที่ 3: Cyber Attacks & Lab 3 (Nmap)", "reference": "Week 7-8 & Lab 3", "q_num": 4, "question": "กรอบการทำงาน **Cyber Kill Chain** ที่พัฒนาโดย Lockheed Martin ข้อใดเรียงลำดับขั้นตอนการโจมตีได้ถูกต้องตั้งแต่ต้นจนจบ?", "choices": {"A": "Weaponization -> Reconnaissance -> Delivery -> Installation -> Exploitation -> C2 -> Actions on Objectives", "B": "Reconnaissance -> Weaponization -> Delivery -> Exploitation -> Installation -> Command & Control (C2) -> Actions on Objectives", "C": "Reconnaissance -> Exploitation -> Weaponization -> Delivery -> Installation -> Actions on Objectives -> C2", "D": "Delivery -> Reconnaissance -> Exploitation -> Installation -> Weaponization -> C2 -> Actions on Objectives"}, "answer": "B", "explanation": "ลำดับทั้ง 7 ขั้นตอนของ Cyber Kill Chain คือ:\n1. Reconnaissance (สำรวจหาข้อมูลเป้าหมาย)\n2. Weaponization (สร้างอาวุธ/มัลแวร์จับคู่กับช่องโหว่)\n3. Delivery (ส่งมัลแวร์ไปยังเป้าหมาย เช่น อีเมล หรือเว็บ)\n4. Exploitation (จุดระเบิดช่องโหว่ของซอฟต์แวร์)\n5. Installation (ติดตั้งมัลแวร์/แบ็กดอร์ลงในระบบ)\n6. Command & Control (เชื่อมต่อช่องทางสั่งการกลับมายังผู้โจมตี)\n7. Actions on Objectives (ลงมือทำตามเป้าหมาย เช่น ขโมยหรือทำลายข้อมูล)\n\n---"}, {"id": "ch3_q5", "chapter_id": "ch3", "chapter_title": "บทที่ 3: Cyber Attacks & Lab 3 (Nmap)", "reference": "Week 7-8 & Lab 3", "q_num": 5, "question": "ความแตกต่างระหว่าง **Passive Reconnaissance** และ **Active Reconnaissance** คือข้อใด?", "choices": {"A": "Passive ใช้บน Linux ส่วน Active ใช้บน Windows เท่านั้น", "B": "Passive ไม่มีการส่งแพ็กเก็ตหรือโต้ตอบกับเครือข่ายเป้าหมายโดยตรง (ไม่เสี่ยงต่อการถูกตรวจจับ) ส่วน Active จะส่งโพรบหรือแพ็กเก็ตไปยังเครื่องเป้าหมายโดยตรง (มีความเสี่ยงถูก IDS/IPS ตรวจพบ)", "C": "Passive เจาะระบบได้เร็วกว่า Active เสมอ", "D": "Passive ต้องใช้รหัสผ่าน root เท่านั้น"}, "answer": "B", "explanation": "Passive Recon ดักฟังข้อมูลหรือค้นหาจาก Open Source Intelligence (OSINT, Shodan, WHOIS) โดยไม่ส่งแพ็กเก็ตไปที่โฮสต์เป้าหมายเลย ส่วน Active Recon เช่น Nmap หรือ Nessus จะส่งคำขอ/แพ็กเก็ตไปโต้ตอบโดยตรง จึงทิ้งร่องรอยไว้ใน Log\n\n---"}, {"id": "ch3_q6", "chapter_id": "ch3", "chapter_title": "บทที่ 3: Cyber Attacks & Lab 3 (Nmap)", "reference": "Week 7-8 & Lab 3", "q_num": 6, "question": "เครื่องมือในข้อใดจัดอยู่ในกลุ่ม **Passive Reconnaissance Tool** ตามเนื้อหาการบรรยาย?", "choices": {"A": "Nmap และ OpenVAS", "B": "Nikto และ Metasploit", "C": "Wireshark, Shodan, VirusTotal, FindSubDomains.com", "D": "Nessus และ SQLMap"}, "answer": "C", "explanation": "จากสไลด์ Week 7 Top Passive Recon Tools ได้แก่ Wireshark (ดักฟังเงียบๆ), Google Search, FindSubDomains.com, VirusTotal, และ Shodan ส่วน Nmap, Nessus, OpenVAS, Nikto และ Metasploit เป็น Active Recon Tools\n\n---"}, {"id": "ch3_q7", "chapter_id": "ch3", "chapter_title": "บทที่ 3: Cyber Attacks & Lab 3 (Nmap)", "reference": "Week 7-8 & Lab 3", "q_num": 7, "question": "คำสั่ง Nmap ในข้อใดที่ทำการสแกนแบบ **TCP SYN Stealth Scan** (ส่งแพ็กเก็ต SYN และตอบ RST ทันทีเมื่อได้รับ SYN-ACK เพื่อไม่ให้การเชื่อมต่อ 3-way handshake สมบูรณ์)?", "choices": {"A": "`nmap -sT <target>`", "B": "`nmap -sS <target>`", "C": "`nmap -sU <target>`", "D": "`nmap -sP <target>`"}, "answer": "B", "explanation": "`-sS` คือ SYN Scan หรือ Half-open scan เป็นโหมดสแกนยอดนิยมของ Nmap และเป็นดีฟอลต์เมื่อรันด้วยสิทธิ์ root เพราะรวดเร็วและแอปพลิเคชันส่วนใหญ่จะไม่บันทึก log การเชื่อมต่อที่ไม่สมบูรณ์\n\n---"}, {"id": "ch3_q8", "chapter_id": "ch3", "chapter_title": "บทที่ 3: Cyber Attacks & Lab 3 (Nmap)", "reference": "Week 7-8 & Lab 3", "q_num": 8, "question": "การรันคำสั่ง `nmap -sT <target>` (TCP Connect Scan) มีข้อแตกต่างที่สำคัญจาก `nmap -sS` อย่างไร?", "choices": {"A": "`-sT` จำลองเฉพาะโพรโทคอล UDP", "B": "`-sT` ทำการเชื่อมต่อ TCP 3-Way Handshake อย่างสมบูรณ์ผ่าน System Call `connect()` ของระบบปฏิบัติการ ทำให้ผู้ใช้ทั่วไปที่ไม่มีสิทธิ์ Root สามารถสั่งรันได้ แต่จะถูกบันทึกใน Log ของเป้าหมายอย่างชัดเจน", "C": "`-sT` ไม่ส่งแพ็กเก็ตใดๆ ออกสู่เครือข่าย", "D": "`-sT` สแกนได้เร็วกว่า `-sS` ถึง 10 เท่า"}, "answer": "B", "explanation": "`-sT` ใช้ฟังก์ชัน `connect()` มาตรฐานของ OS จึงไม่ต้องสร้าง Raw Packet ในระดับเคอร์เนล ทำให้ผู้ใช้ที่ไม่ใช่ root ใช้งานได้ แต่เนื่องจาก Handshake สมบูรณ์ เซิร์ฟเวอร์ปลายทางจึงบันทึก Connection ลง Application Log อย่างง่ายดาย\n\n---"}, {"id": "ch3_q9", "chapter_id": "ch3", "chapter_title": "บทที่ 3: Cyber Attacks & Lab 3 (Nmap)", "reference": "Week 7-8 & Lab 3", "q_num": 9, "question": "หากต้องการให้ Nmap ทำการค้นหาเฉพาะเครื่องที่เปิดใช้งานอยู่ในเครือข่าย (**Host Discovery / Ping Sweep**) โดย**ไม่ต้องทำ Port Scan** ต้องใช้คำสั่งหรือออปชันใด?", "choices": {"A": "`nmap -sn <target_subnet>` (หรือ `nmap -sP`)", "B": "`nmap -Pn <target_subnet>`", "C": "`nmap -p- <target_subnet>`", "D": "`nmap -sV <target_subnet>`"}, "answer": "A", "explanation": "ออปชัน `-sn` (ใน Nmap เวอร์ชันเก่าใช้ `-sP`) ย่อมาจาก \"No port scan\" โดยจะทำการ Ping sweep (ส่ง ICMP Echo, TCP SYN ไปยังพอร์ตยอดนิยม ฯลฯ) เพื่อตรวจสอบว่าโฮสต์ใดกำลังออนไลน์อยู่เท่านั้น\n\n---"}, {"id": "ch3_q10", "chapter_id": "ch3", "chapter_title": "บทที่ 3: Cyber Attacks & Lab 3 (Nmap)", "reference": "Week 7-8 & Lab 3", "q_num": 10, "question": "หากเครื่องเป้าหมายมีไฟร์วอลล์บล็อกแพ็กเก็ต ICMP Echo (Ping) ทำให้อุปกรณ์ตรวจสอบคิดว่าเครื่องปิดอยู่ การเพิ่มออปชันใดในคำสั่ง Nmap จะเป็นการสั่งให้ข้ามขั้นตอนการ Ping และบังคับให้สแกนพอร์ตทันทีโดยถือว่าเครื่องเป้าหมายเปิดอยู่เสมอ?", "choices": {"A": "`-sn`", "B": "`-Pn`", "C": "`-sN`", "D": "`-n`"}, "answer": "B", "explanation": "ออปชัน `-Pn` (Treat all hosts as online -- skip host discovery) สั่งให้ Nmap สแกนพอร์ตเป้าหมายโดยตรงโดยไม่ต้องลอง Ping ก่อน เหมาะมากสำหรับการสแกนเป้าหมายที่มีไฟร์วอลล์บล็อกการ Ping\n\n---"}, {"id": "ch3_q11", "chapter_id": "ch3", "chapter_title": "บทที่ 3: Cyber Attacks & Lab 3 (Nmap)", "reference": "Week 7-8 & Lab 3", "q_num": 11, "question": "การสแกนพอร์ตแบบ **UDP Scan** ใน Nmap ต้องกำหนดด้วยออปชันใด?", "choices": {"A": "`nmap -sU <target>`", "B": "`nmap -u <target>`", "C": "`nmap -sT <target>`", "D": "`nmap --udp-fast <target>`"}, "answer": "A", "explanation": "`-sU` คือคำสั่งสำหรับทำ UDP Port Scan ซึ่งหลักการคือส่ง UDP packet ไปยังพอร์ตเป้าหมาย หากได้รับข้อความ \"ICMP port unreachable\" แสดงว่าพอร์ต Closed แต่หากไม่มีการตอบสนองหรือตอบกลับข้อมูล UDP จะถือว่า Open|Filtered\n\n---"}, {"id": "ch3_q12", "chapter_id": "ch3", "chapter_title": "บทที่ 3: Cyber Attacks & Lab 3 (Nmap)", "reference": "Week 7-8 & Lab 3", "q_num": 12, "question": "หากต้องการสั่งให้ Nmap ตรวจสอบเวอร์ชันของ Service และระบุระบบปฏิบัติการ (OS Detection) โดยละเอียด พร้อมทั้งรัน Default Script และทำ Traceroute พร้อมกันในออปชันเดียว ควรใช้คำสั่งใด?", "choices": {"A": "`nmap -A <target>`", "B": "`nmap -O <target>`", "C": "`nmap -sV <target>`", "D": "`nmap -v <target>`"}, "answer": "A", "explanation": "ออปชัน `-A` (Aggressive scan options) เป็นคำสั่งรวมมิตรที่เปิดการทำงานของ:\n1. OS detection (`-O`)\n2. Version detection (`-sV`)\n3. Script scanning (`-sC`)\n4. Traceroute (`--traceroute`)\n\n---"}, {"id": "ch3_q13", "chapter_id": "ch3", "chapter_title": "บทที่ 3: Cyber Attacks & Lab 3 (Nmap)", "reference": "Week 7-8 & Lab 3", "q_num": 13, "question": "จากโจทย์ Lab 3-A กำหนดให้สแกนเครือข่ายที่มี Web Server พอร์ต 8080 และ Some Server พอร์ต 2025 ในซับเน็ต `20.X.1.0/24` หากต้องการกำหนดช่วงพอร์ตให้ Nmap สแกนเฉพาะ 2 พอร์ตนี้เท่านั้น ไวยากรณ์ข้อใดถูกต้อง?", "choices": {"A": "`nmap -p 8080,2025 20.X.1.0/24`", "B": "`nmap --ports 8080-2025 20.X.1.0/24`", "C": "`nmap -P:8080;2025 20.X.1.0/24`", "D": "`nmap -port (8080 2025) 20.X.1.0/24`"}, "answer": "A", "explanation": "ใน Nmap กำหนดพอร์ตเป้าหมายด้วยพารามิเตอร์ `-p` โดยใช้เครื่องหมายจุลภาค (,) คั่นระหว่างหมายเลขพอร์ต หรือเครื่องหมายยัติภังค์ (-) สำหรับระบุช่วง เช่น `-p 8080,2025` หรือ `-p 1-1024`\n\n---"}, {"id": "ch3_q14", "chapter_id": "ch3", "chapter_title": "บทที่ 3: Cyber Attacks & Lab 3 (Nmap)", "reference": "Week 7-8 & Lab 3", "q_num": 14, "question": "หากต้องการสแกนพอร์ต TCP ทุกพอร์ตที่เป็นไปได้ทั้งหมด (ตั้งแต่ 1 ถึง 65535) ต้องระบุพารามิเตอร์พอร์ตอย่างไร?", "choices": {"A": "`-p all`", "B": "`-p 1-65535` หรือ `-p-`", "C": "`-p *`", "D": "`--full-ports`"}, "answer": "B", "explanation": "Nmap รองรับชอร์ตคัต `-p-` ซึ่งมีความหมายเทียบเท่ากับการระบุพอร์ตทั้งหมด `-p 1-65535`\n\n---"}, {"id": "ch3_q15", "chapter_id": "ch3", "chapter_title": "บทที่ 3: Cyber Attacks & Lab 3 (Nmap)", "reference": "Week 7-8 & Lab 3", "q_num": 15, "question": "สถานะพอร์ต (Port State) ของผลการสแกน Nmap แบบใด ที่แสดงว่ามี **Firewall, Filter หรือ Packet Filtering** กำลังปิดกั้นการเดินทางของแพ็กเก็ตโพรบ ทำให้ Nmap ไม่สามารถระบุได้ว่าพอร์ตนั้นเปิดหรือปิดอยู่?", "choices": {"A": "Open", "B": "Closed", "C": "Filtered", "D": "Unfiltered"}, "answer": "C", "explanation": "- **Open:** แอปพลิเคชันพร้อมรับการเชื่อมต่อ\n- **Closed:** ไม่มีแอปพลิเคชันเปิดรับ แต่โฮสต์ตอบกลับ RST\n- **Filtered:** แพ็กเก็ตถูกบล็อกหรือดรอปทิ้งโดยอุปกรณ์ป้องกันเครือข่าย (Firewall / Router ACL) ทำให้ไม่มีคำตอบส่งกลับมา\n- **Unfiltered:** เข้าถึงพอร์ตได้ (เช่น ตอบ RST ใน ACK scan) แต่ไม่ทราบว่าเปิดหรือปิด\n\n---"}, {"id": "ch3_q16", "chapter_id": "ch3", "chapter_title": "บทที่ 3: Cyber Attacks & Lab 3 (Nmap)", "reference": "Week 7-8 & Lab 3", "q_num": 16, "question": "การสแกนประเภท **Null Scan (`-sN`)**, **FIN Scan (`-sF`)**, และ **Xmas Scan (`-sX`)** อาศัยช่องโหว่ตามมาตรฐาน RFC 793 ของระบบปฏิบัติการที่ใช้ฐาน Unix โดยสำหรับ **Xmas Scan** จะมีการตั้งค่า TCP Flags ใดในแพ็กเก็ตบ้าง?", "choices": {"A": "SYN, ACK, RST", "B": "FIN, PSH, และ URG (ไฟสว่างระยิบระยับเหมือนต้นคริสต์มาส)", "C": "SYN และ FIN เท่านั้น", "D": "ECN, CWR, และ ACK"}, "answer": "B", "explanation": "Xmas Scan จะเซตธง FIN, PSH, และ URG พร้อมกัน ซึ่งตาม RFC 793 หากพอร์ตปลายทาง Closed โฮสต์จะต้องตอบกลับด้วย RST แต่หากพอร์ต Open โฮสต์จะต้องทิ้งแพ็กเก็ตเงียบๆ ไม่ตอบอะไร\n\n---"}, {"id": "ch3_q17", "chapter_id": "ch3", "chapter_title": "บทที่ 3: Cyber Attacks & Lab 3 (Nmap)", "reference": "Week 7-8 & Lab 3", "q_num": 17, "question": "ออปชันระดับการปรับแต่งความเร็วและเวลาในการส่งโพรบ (Timing Templates) ของ Nmap มีค่าตั้งแต่ `-T0` ถึง `-T5` ออปชันใดที่ปรับให้สแกนเร็วแบบ Aggressive มักใช้ในการทำแล็บหรือเครือข่ายความเร็วสูงที่มีเสถียรภาพ?", "choices": {"A": "`-T0` (Paranoid)", "B": "`-T2` (Polite)", "C": "`-T3` (Normal)", "D": "`-T4` (Aggressive)"}, "answer": "D", "explanation": "- `-T0`: Paranoid (ช้ามากเพื่อหลบเลี่ยง IDS)\n- `-T1`: Sneaky\n- `-T2`: Polite\n- `-T3`: Normal (ดีฟอลต์)\n- `-T4`: Aggressive (เร็วขึ้น เหมาะกับแล็บหรือเน็ตที่เชื่อถือได้)\n- `-T5`: Insane (เร็วที่สุด เสี่ยงต่อการตกหล่นของข้อมูล)\n\n---"}, {"id": "ch3_q18", "chapter_id": "ch3", "chapter_title": "บทที่ 3: Cyber Attacks & Lab 3 (Nmap)", "reference": "Week 7-8 & Lab 3", "q_num": 18, "question": "หากต้องการบันทึกผลการสแกนของ Nmap ออกมาเป็นไฟล์รูปแบบต่างๆ พร้อมกันทั้งหมด (ได้ทั้งรูปแบบ Normal `.nmap`, XML `.xml`, และ Grepable `.gnmap`) ต้องใช้ออปชันใด?", "choices": {"A": "`-oN output.txt`", "B": "`-oX output.xml`", "C": "`-oA <basename>`", "D": "`--save-all <filename>`"}, "answer": "C", "explanation": "ออปชัน `-oA <basename>` จะสั่งให้ Nmap บันทึกไฟล์ผลลัพธ์ครบทั้ง 3 ตระกูลหลักพร้อมกัน โดยเติมส่วนขยายไฟล์ `.nmap`, `.xml`, และ `.gnmap` อัตโนมัติ\n\n---"}, {"id": "ch3_q19", "chapter_id": "ch3", "chapter_title": "บทที่ 3: Cyber Attacks & Lab 3 (Nmap)", "reference": "Week 7-8 & Lab 3", "q_num": 19, "question": "ในการทำ Lab 3 เพื่อตรวจหาบริการที่ทำงานอยู่และหา Flag ของผู้ใช้งานบนเครื่องเป้าหมาย ข้อใดคือคำสั่ง Nmap ที่ครอบคลุมการระบุชื่อ Service พร้อมเวอร์ชันซอฟต์แวร์ของทุกพอร์ตที่เปิดอยู่บน IP `20.10.1.77` ได้ดีที่สุด?", "choices": {"A": "`nmap -sS -p- -sV -T4 20.10.1.77`", "B": "`nmap -sn 20.10.1.77`", "C": "`nmap -O -p 80 20.10.1.77`", "D": "`nmap -sU -p 53 20.10.1.77`"}, "answer": "A", "explanation": "คำสั่ง `nmap -sS -p- -sV -T4 20.10.1.77` จะทำการสแกนแบบ SYN stealth ครบทั้ง 65,535 พอร์ต (`-p-`), ตรวจจับเวอร์ชันของบริการที่เปิดอยู่ (`-sV`), และเร่งเวลาการสแกนด้วยความเร็วสูง (`-T4`) ช่วยให้พบพอร์ตแปลกๆ เช่น พอร์ต 2025 ในแล็บได้ทันที\n\n---"}, {"id": "ch3_q20", "chapter_id": "ch3", "chapter_title": "บทที่ 3: Cyber Attacks & Lab 3 (Nmap)", "reference": "Week 7-8 & Lab 3", "q_num": 20, "question": "เครื่องมือ **Nikto** ที่กล่าวถึงในสไลด์ Week 7 ทำหน้าที่หลักในเรื่องใด และเหตุใดจึงไม่เหมาะกับการสแกนแบบลักลอบ (Stealth)?", "choices": {"A": "เป็นเครื่องมือถอดรหัส Wi-Fi WPA2 และแอบฟังข้อมูลเงียบๆ", "B": "เป็น Web Server Vulnerability Scanner ที่เน้นตรวจหาไฟล์อันตราย/ช่องโหว่ของเว็บเซิร์ฟเวอร์ โดยส่งคำขอนับพันรายการจนเกิด Log มหาศาล ทำให้ IDS/IPS ตรวจพบได้ทันที", "C": "เป็นโปรแกรมวิเคราะห์มัลแวร์ในระดับ Binary Assembly", "D": "เป็นระบบปฏิบัติการจำลองการโจมตีทางเครือข่าย"}, "answer": "B", "explanation": "Nikto เป็นเครื่องมือสแกนหาช่องโหว่ของเว็บเซิร์ฟเวอร์ (เช่น ไฟล์คอนฟิกตกค้าง สคริปต์ CGI ที่มีช่องโหว่) แต่มีความ \"เสียงดัง\" (Noisy) มาก เพราะกระหน่ำยิงคำขอ HTTP หลายพันรูปแบบ จึงถูกระบบ IDS/IPS ตรวจจับและบล็อกได้อย่างง่ายดาย"}, {"id": "ch4_q1", "chapter_id": "ch4", "chapter_title": "บทที่ 4: IDPS & Lab 5 (Snort/Suricata Rules)", "reference": "NIST SP 800-94 & Lab 5", "q_num": 1, "question": "ตามเอกสาร **NIST SP 800-94** ส่วนประกอบหลักของเทคโนโลยี IDPS ที่ทำหน้าที่ตรวจสอบและวิเคราะห์กิจกรรมบนเครือข่ายหรือโฮสต์ มีชื่อเรียกว่าอะไร?", "choices": {"A": "Management Server", "B": "Sensor หรือ Agent (Sensor ใช้กับ Network-based ส่วน Agent ใช้กับ Host-based)", "C": "Database Server", "D": "Console"}, "answer": "B", "explanation": "สถาปัตยกรรมทั่วไปของ IDPS ประกอบด้วย Sensor/Agent (ทำหน้าที่ดักจับและวิเคราะห์ข้อมูล), Management Server (ประมวลผล correlation และจัดการส่วนกลาง), Database Server (บันทึกเหตุการณ์), และ Console (หน้าจอ UI ให้ผู้ดูแลระบบใช้งาน)\n\n---"}, {"id": "ch4_q2", "chapter_id": "ch4", "chapter_title": "บทที่ 4: IDPS & Lab 5 (Snort/Suricata Rules)", "reference": "NIST SP 800-94 & Lab 5", "q_num": 2, "question": "การเชื่อมต่อระบบบริหารจัดการ IDPS แบบ **Out-of-Band (OOB) / Isolated Management Network** มีข้อดีหลักที่เหนือกว่าแบบ In-Band อย่างไร?", "choices": {"A": "ไม่ต้องใช้สายแลนเพิ่มเติม", "B": "ซ่อนการมีอยู่และตัวตนของ IDPS จากสายตาผู้โจมตี, ป้องกัน IDPS จากการถูกแฮก, และรับประกันว่ามีแบนด์วิดท์เพียงพอสำหรับบริหารจัดการแม้ในยามที่เครือข่ายหลักกำลังถูก DoS โจมตีอย่างหนัก", "C": "ไม่ต้องเสียค่าใช้จ่ายด้านอุปกรณ์เน็ตเวิร์กเพิ่มเติม", "D": "ใช้งานได้เฉพาะบนระบบเครือข่าย Wi-Fi"}, "answer": "B", "explanation": "OOB ใช้พอร์ตและเครือข่ายทางกายภาพแยกต่างหากจากทราฟฟิกข้อมูลปกติ (Production) ทำให้ผู้โจมตีไม่สามารถสแกนเห็นตัวเซ็นเซอร์ได้ และเมื่อเครือข่ายหลักล่มเพราะ DoS ทราฟฟิกการส่ง Alert ของ IDPS ยังคงทำงานได้ราบรื่น\n\n---"}, {"id": "ch4_q3", "chapter_id": "ch4", "chapter_title": "บทที่ 4: IDPS & Lab 5 (Snort/Suricata Rules)", "reference": "NIST SP 800-94 & Lab 5", "q_num": 3, "question": "ข้อใดคือความแตกต่างทางสถาปัตยกรรมระหว่าง **Inline Sensor** และ **Passive Sensor** ใน Network-Based IDPS?", "choices": {"A": "Inline ตรวจสอบเฉพาะสัญญาณไร้สาย ส่วน Passive ตรวจสอบสาย Fiber Optic", "B": "Inline จะติดตั้งขวางเส้นทางจราจรของทราฟฟิกโดยตรง (ทราฟฟิกต้องไหลทะลุผ่านตัวมันเหมือนไฟร์วอลล์) ส่วน Passive จะติดตั้งเพื่อเฝ้าดูสำเนา (Copy) ของทราฟฟิก โดยไม่มีทราฟฟิกจริงไหลผ่านตัวมัน", "C": "Inline ไม่สามารถสั่งบล็อกแพ็กเก็ตได้ แต่ Passive บล็อกแพ็กเก็ตได้ 100%", "D": "Inline ใช้งานได้เฉพาะบนคอมพิวเตอร์ไคลเอนต์เท่านั้น"}, "answer": "B", "explanation": "Inline Sensor ถูกวางคั่นกลางระหว่างเส้นทางเน็ตเวิร์ก (In-line) จึงสามารถสั่ง Drop หรือ Sanitizing แพ็กเก็ตได้แบบเรียลไทม์ ส่วน Passive Sensor รับสำเนาแพ็กเก็ตมาตรวจสอบ (ผ่าน SPAN Port หรือ Network Tap) จึงไม่หน่วงเวลาการทำงานของระบบเครือข่าย\n\n---"}, {"id": "ch4_q4", "chapter_id": "ch4", "chapter_title": "บทที่ 4: IDPS & Lab 5 (Snort/Suricata Rules)", "reference": "NIST SP 800-94 & Lab 5", "q_num": 4, "question": "วิธีการใดต่อไปนี้ที่ **ไม่ใช่** วิธีการเชื่อมต่อเพื่อให้ **Passive Sensor** ได้รับสำเนาของทราฟฟิกเครือข่ายมาตรวจสอบตาม NIST SP 800-94?", "choices": {"A": "Spanning Port (Port Mirroring บนสวิตช์)", "B": "Network Tap (อุปกรณ์ต่อตรงเข้ากับสายสัญญาณทางกายภาพ เช่น สายไฟเบอร์ออปติก)", "C": "IDS Load Balancer", "D": "NAT Port Forwarding ในเราเตอร์บ้าน"}, "answer": "D", "explanation": "สไลด์ระบุ 3 วิธีการเชื่อมต่อหลักของ Passive Sensor คือ:\n1. Spanning Port (SPAN)\n2. Network Tap (ดักสัญญาณฟิสิคัลโดยตรง)\n3. IDS Load Balancer (กระจายสำเนาทราฟฟิกไปยังเซ็นเซอร์หลายตัว)\n\n---"}, {"id": "ch4_q5", "chapter_id": "ch4", "chapter_title": "บทที่ 4: IDPS & Lab 5 (Snort/Suricata Rules)", "reference": "NIST SP 800-94 & Lab 5", "q_num": 5, "question": "การตั้งค่าการทำงานของเซ็นเซอร์ IDPS ในโหมดที่เรียกว่า **Stealth Mode** หมายถึงข้อใด?", "choices": {"A": "การปิดพัดลมระบายความร้อนเพื่อไม่ให้มีเสียง", "B": "การไม่กำหนดหมายเลข IP Address ให้แก่ Network Interface ใบที่ใช้ดักฟัง/มอนิเตอร์ทราฟฟิก (จะมี IP เฉพาะ Interface ที่ใช้บริหารจัดการเท่านั้น) เพื่อป้องกันไม่ให้ผู้โจมตีเชื่อมต่อไปยังเซ็นเซอร์ได้", "C": "การปิดหน้าจอ Console ทุกครั้งที่เลิกงาน", "D": "การเข้ารหัสไฟล์ข้อความ Log แบบ AES-256"}, "answer": "B", "explanation": "Stealth mode คือการคอนฟิกให้อินเทอร์เฟซมอนิเตอร์ไม่มี IP address ทำให้บนเครือข่ายเสมือนไม่มีโฮสต์นี้อยู่ จึงไม่ตกเป็นเป้าหมายของการสแกนหรือการโจมตีจากแฮกเกอร์\n\n---"}, {"id": "ch4_q6", "chapter_id": "ch4", "chapter_title": "บทที่ 4: IDPS & Lab 5 (Snort/Suricata Rules)", "reference": "NIST SP 800-94 & Lab 5", "q_num": 6, "question": "กลไกการสกัดกั้นภัยคุกคามแบบ **Session Sniping** ที่ใช้ใน **Passive Sensor** มีหลักการทำงานและข้อจำกัดอย่างไร?", "choices": {"A": "การส่งคำสั่งปิดระบบปฏิบัติการของเหยื่อ", "B": "การส่งแพ็กเก็ต TCP Reset (RST) ปลอมไปยังจุดปลายทางทั้งสองฝั่งเพื่อบังคับให้ตัดการเชื่อมต่อ โดยมีข้อจำกัดคือใช้ได้เฉพาะกับโพรโทคอล TCP เท่านั้น และแพ็กเก็ต RST มักจะไปถึงช้ากว่าแพ็กเก็ตการโจมตี", "C": "การยิง ICMP Flood สวนกลับไปยังผู้โจมตี", "D": "การตัดสายสัญญาณไฟเบอร์ออปติกโดยอัตโนมัติ"}, "answer": "B", "explanation": "Passive Sensor ไม่สามารถ Drop แพ็กเก็ตกลางทางได้ จึงทำได้เพียงส่ง TCP RST ไปหลอกทั้งสองฝั่งว่าอีกฝั่งต้องการยุติการเชื่อมต่อ (Session Sniping) ซึ่งใช้ไม่ได้กับ UDP/ICMP และมักไม่ทันการณ์หากการโจมตีทำสำเร็จไปแล้ว\n\n---"}, {"id": "ch4_q7", "chapter_id": "ch4", "chapter_title": "บทที่ 4: IDPS & Lab 5 (Snort/Suricata Rules)", "reference": "NIST SP 800-94 & Lab 5", "q_num": 7, "question": "ความสามารถในการป้องกัน (Prevention Capabilities) ในข้อใดที่สามารถทำได้เฉพาะบน **Inline IDPS เท่านั้น** และ Passive IDPS ไม่สามารถทำได้?", "choices": {"A": "Reconfiguring Other Network Security Devices", "B": "Running a Third-Party Program or Script", "C": "Performing Inline Firewalling (Drop/Reject) และ Altering/Sanitizing Malicious Content", "D": "Sending Alert E-mail to Administrator"}, "answer": "C", "explanation": "การทำ Inline Firewalling (สั่ง Drop ทิ้งแพ็กเก็ตทันที), Throttling Bandwidth (บีบแบนด์วิดท์), และ Altering Malicious Content (ล้างเนื้อหาอันตรายออกจากแพ็กเก็ตหรือตัดไฟล์แนบอีเมล) ต้องทำบนเส้นทางที่ทราฟฟิกไหลผ่านตัวเซ็นเซอร์จริง (Inline Only)\n\n---"}, {"id": "ch4_q8", "chapter_id": "ch4", "chapter_title": "บทที่ 4: IDPS & Lab 5 (Snort/Suricata Rules)", "reference": "NIST SP 800-94 & Lab 5", "q_num": 8, "question": "โครงสร้างมาตรฐานของกฎการตรวจจับ (Rule Syntax) ใน Snort ประกอบด้วย 2 ส่วนหลักตามข้อใด?", "choices": {"A": "Rule Header และ Rule Options", "B": "Rule IP และ Rule Protocol", "C": "Rule Input และ Rule Output", "D": "Rule Condition และ Rule Action"}, "answer": "A", "explanation": "กฎของ Snort แบ่งเป็น 2 ส่วนหลักชัดเจนคือ:\n1. **Rule Header:** ระบุ Action, Protocol, Source IP, Source Port, Direction (`->`), Destination IP, Destination Port\n2. **Rule Options:** ระบุเงื่อนไขในวงเล็บ `(...)` เช่น `msg`, `content`, `sid`, `rev`\n\n---"}, {"id": "ch4_q9", "chapter_id": "ch4", "chapter_title": "บทที่ 4: IDPS & Lab 5 (Snort/Suricata Rules)", "reference": "NIST SP 800-94 & Lab 5", "q_num": 9, "question": "ใน Rule Header ของ Snort คำสั่ง Action ในข้อใดที่ใช้สร้างข้อความแจ้งเตือน (Alert) พร้อมทั้งบันทึกเหตุการณ์ลงในระบบ Log?", "choices": {"A": "`log`", "B": "`pass`", "C": "`alert`", "D": "`drop`"}, "answer": "C", "explanation": "- `alert`: ส่งข้อความเตือนและบันทึกลง log\n- `log`: บันทึกแพ็กเก็ตลง log อย่างเดียวไม่ส่งเตือน\n- `pass`: ละเว้นการตรวจสอบ (Ignore)\n- `drop` / `reject`: ทิ้งแพ็กเก็ต (ใช้ในโหมด Inline/IPS)\n\n---"}, {"id": "ch4_q10", "chapter_id": "ch4", "chapter_title": "บทที่ 4: IDPS & Lab 5 (Snort/Suricata Rules)", "reference": "NIST SP 800-94 & Lab 5", "q_num": 10, "question": "จากโจทย์ Lab 5-A ที่ต้องการเขียนกฎ Snort Rule เพื่อตรวจจับการ **Ping** จากภายนอกเข้ามายัง Web Server เครือข่าย `20.10.1.0/24` ข้อใดคือ Rule Syntax ที่ถูกต้องที่สุด?", "choices": {"A": "`alert icmp any any -> 20.10.1.0/24 any (msg:\"ICMP Ping Detected\"; itype:8; sid:1000001; rev:1;)`", "B": "`alert tcp any any -> 20.10.1.0/24 80 (msg:\"Ping Detect\"; sid:1000001;)`", "C": "`drop udp any any -> 20.10.1.0/24 any (msg:\"Ping\"; sid:1000001;)`", "D": "`alert ip 20.10.1.0/24 any -> any any (msg:\"Ping\"; sid:1000001;)`"}, "answer": "A", "explanation": "การ Ping ใช้โพรโทคอล `icmp` โดยคำขอ Echo Request มีค่า ICMP Type เท่ากับ 8 (`itype:8;`) จึงเขียนเป็น `alert icmp any any -> 20.10.1.0/24 any (msg:\"ICMP Ping Detected\"; itype:8; sid:1000001; rev:1;)`\n\n---"}, {"id": "ch4_q11", "chapter_id": "ch4", "chapter_title": "บทที่ 4: IDPS & Lab 5 (Snort/Suricata Rules)", "reference": "NIST SP 800-94 & Lab 5", "q_num": 11, "question": "ในโจทย์ Lab 5-A ข้อ 3 มีการให้ตรวจจับการรีโมตด้วยบริการ **Telnet** และ **FTP** ไปยัง Web Server กฎของ Snort ต้องระบุพอร์ตปลายทาง (Destination Port) ของทั้งสองบริการนี้อย่างไร?", "choices": {"A": "Telnet พอร์ต 22 และ FTP พอร์ต 80", "B": "Telnet พอร์ต 23 และ FTP พอร์ต 21", "C": "Telnet พอร์ต 25 และ FTP พอร์ต 110", "D": "Telnet พอร์ต 53 และ FTP พอร์ต 443"}, "answer": "B", "explanation": "หมายเลขพอร์ตมาตรฐานตามข้อกำหนด IANA:\n- Telnet: TCP พอร์ต 23\n- FTP Control: TCP พอร์ต 21 (Data: TCP พอร์ต 20)\n\n---"}, {"id": "ch4_q12", "chapter_id": "ch4", "chapter_title": "บทที่ 4: IDPS & Lab 5 (Snort/Suricata Rules)", "reference": "NIST SP 800-94 & Lab 5", "q_num": 12, "question": "หากต้องการเขียนกฎ Snort ให้ตรวจจับทั้งพอร์ต **Telnet (23)** และ **FTP (21)** พร้อมกันในกฎข้อเดียว สามารถเขียนระบุช่วงพอร์ตหรือชุดพอร์ตในส่วน Rule Header ได้ตามข้อใด?", "choices": {"A": "`alert tcp any any -> 20.10.1.123 [21,23] (msg:\"Telnet or FTP Access Detected\"; sid:1000002; rev:1;)`", "B": "`alert tcp any any -> 20.10.1.123 21-23 (msg:\"Detect\"; sid:1000002; rev:1;)`", "C": "`alert tcp any any -> 20.10.1.123 21&&23 (msg:\"Detect\"; sid:1000002; rev:1;)`", "D": "`alert tcp any any -> 20.10.1.123 (port: 21, 23) (msg:\"Detect\"; sid:1000002; rev:1;)`"}, "answer": "A", "explanation": "ใน Snort Rule Header สามารถกำหนดกลุ่มพอร์ตที่สนใจได้โดยใส่วงเล็บก้ามปูคั่นด้วยจุลภาค เช่น `[21,23]` หรือระบุเป็นพอร์ตเดี่ยวแยกกฎละข้อ\n\n---"}, {"id": "ch4_q13", "chapter_id": "ch4", "chapter_title": "บทที่ 4: IDPS & Lab 5 (Snort/Suricata Rules)", "reference": "NIST SP 800-94 & Lab 5", "q_num": 13, "question": "ในระบบปฏิบัติการ Linux ไฟล์คอนฟิกูเรชันหลัก (Master Configuration File) ของ **Snort** และไฟล์สำหรับกำหนดกฎของผู้ดูแลระบบ (Local Rules) มักจัดเก็บอยู่ที่ไดเรกทอรีและพาธ (File Path) ใดตามลำดับ?", "choices": {"A": "`/usr/bin/snort.exe` และ `/home/snort/rules.txt`", "B": "`/etc/snort/snort.conf` (สำหรับ Snort 2) หรือ `/etc/snort/snort.lua` (สำหรับ Snort 3) และ `/etc/snort/rules/local.rules`", "C": "`/var/log/snort.conf` และ `/tmp/snort.rules`", "D": "`/opt/rules/snort.cfg` และ `/etc/default/rules`"}, "answer": "B", "explanation": "พาธไฟล์มาตรฐานของ Snort บนลินุกซ์:\n- ไฟล์คอนฟิกหลัก: `/etc/snort/snort.conf` (Snort 2) หรือ `/etc/snort/snort.lua` (Snort 3)\n- ไฟล์เขียน Custom Rules: `/etc/snort/rules/local.rules`\n- ไดเรกทอรีเก็บ Log: `/var/log/snort/`\n\n---"}, {"id": "ch4_q14", "chapter_id": "ch4", "chapter_title": "บทที่ 4: IDPS & Lab 5 (Snort/Suricata Rules)", "reference": "NIST SP 800-94 & Lab 5", "q_num": 14, "question": "ไดเรกทอรีมาตรฐาน (Default Log Directory) ที่ระบบ Snort และ Suricata ใช้ในการบันทึก Log ไฟล์ (เช่น `alert`, `snort.log`, หรือ `eve.json`) คือพาธใด?", "choices": {"A": "`/etc/snort/logs/`", "B": "`/var/log/snort/` และ `/var/log/suricata/`", "C": "`/home/user/logs/`", "D": "`/usr/share/snort/`"}, "answer": "B", "explanation": "ตามมาตรฐาน FHS ของลินุกซ์ ไฟล์บันทึกประวัติการทำงานและแจ้งเตือนของ IDS จะอยู่ที่ `/var/log/snort/` (เช่น ไฟล์ `alert`) หรือ `/var/log/suricata/` (เช่น ไฟล์ `eve.json`, `fast.log`)\n\n---"}, {"id": "ch4_q15", "chapter_id": "ch4", "chapter_title": "บทที่ 4: IDPS & Lab 5 (Snort/Suricata Rules)", "reference": "NIST SP 800-94 & Lab 5", "q_num": 15, "question": "คำสั่ง CLI ในการสั่งรันโปรแกรม Snort เพื่อทดสอบตรวจสอบกฎในคอนโซลแบบเงียบ (Quiet) โดยระบุอินเทอร์เฟซ `eth1` และไฟล์คอนฟิกหลัก คือข้อใด?", "choices": {"A": "`snort -A console -q -c /etc/snort/snort.conf -i eth1`", "B": "`snort --run-rules /etc/snort/local.rules eth1`", "C": "`snort -start -interface eth1 -file /etc/snort/rules`", "D": "`snort -D --interface eth1`"}, "answer": "A", "explanation": "- `-A console`: ให้แสดง Alert ออกมาทางหน้าจอ Console ทันที\n- `-q`: โหมด Quiet ไม่ต้องแสดงแบนเนอร์และข้อมูลสถิติเริ่มต้น\n- `-c <path>`: กำหนดไฟล์คอนฟิกูเรชันหลัก\n- `-i <interface>`: กำหนด Network Interface ที่ใช้ดักจับข้อมูล\n\n---"}, {"id": "ch4_q16", "chapter_id": "ch4", "chapter_title": "บทที่ 4: IDPS & Lab 5 (Snort/Suricata Rules)", "reference": "NIST SP 800-94 & Lab 5", "q_num": 16, "question": "ใน Rule Options ของ Snort ออปชัน **sid (Snort ID)** ในช่วงหมายเลขใดที่ถูกสงวนไว้สำหรับกฎที่ผู้ดูแลระบบเขียนขึ้นมาใช้งานเองภายในองค์กร (Custom / Local Rules)?", "choices": {"A": "หมายเลข 1 ถึง 99", "B": "หมายเลข 100 ถึง 999,999", "C": "หมายเลขตั้งแต่ 1,000,000 ขึ้นไป (>= 1,000,000)", "D": "กำหนดหมายเลขใดก็ได้ไม่จำกัด"}, "answer": "C", "explanation": "กฎมาตรฐานของ Snort:\n- `sid < 100`: Reserved\n- `sid 100 - 999,999`: กฎทางการที่มาจาก Sourcefire / Cisco Talos\n- `sid >= 1,000,000`: สงวนไว้สำหรับ Local / Custom Rules ของผู้ใช้ เพื่อไม่ให้หมายเลขทับซ้อนกับชุดกฎทางการ\n\n---"}, {"id": "ch4_q17", "chapter_id": "ch4", "chapter_title": "บทที่ 4: IDPS & Lab 5 (Snort/Suricata Rules)", "reference": "NIST SP 800-94 & Lab 5", "q_num": 17, "question": "ในโจทย์ Lab 5-C สำหรับการตรวจจับ **TCP SYN Flood Attack** โดยใช้ Snort Rule ออปชันใดในวงเล็บที่ใช้วัดความถี่ของแพ็กเก็ต เช่น ตรวจจับหากมี SYN packet ส่งมาเกิน 100 ครั้งภายใน 1 วินาที?", "choices": {"A": "`detection_filter: track by_dst, count 100, seconds 1;` หรือ `threshold: type both, track by_src, count 100, seconds 1;`", "B": "`limit: 100/sec;`", "C": "`timer: 1s, max: 100;`", "D": "`flood_watch: packets 100;`"}, "answer": "A", "explanation": "ในการตรวจจับ DoS/Flooding Snort มี Rule Option เช่น `detection_filter` หรือ `threshold` (ในเวอร์ชันเดิม) เพื่อกำหนด `count` และ `seconds` ในการตรวจจับทราฟฟิกที่มีปริมาณพุ่งสูงผิดปกติจาก IP เดียวกัน\n\n---"}, {"id": "ch4_q18", "chapter_id": "ch4", "chapter_title": "บทที่ 4: IDPS & Lab 5 (Snort/Suricata Rules)", "reference": "NIST SP 800-94 & Lab 5", "q_num": 18, "question": "หากต้องการตรวจจับคำสั่งในระดับแอปพลิเคชัน เช่น การที่ผู้ใช้ส่งคำสั่ง `USER` หรือ `PASS` ในโพรโทคอล FTP หรือคำสั่ง `GET` ใน HTTP ใน Snort Rule Options ต้องใช้คีย์เวิร์ดใดในการค้นหาข้อความสตริงใน Payload?", "choices": {"A": "`find:\"...\";`", "B": "`content:\"...\";`", "C": "`payload_match:\"...\";`", "D": "`string:\"...\";`"}, "answer": "B", "explanation": "`content:\"...\"` คือคีย์เวิร์ดมาตรฐานของ Snort ที่ใช้ค้นหาแพทเทิร์นของข้อความ (String หรือ Hex) ที่ปรากฏอยู่ในข้อมูล Payload ของแพ็กเก็ต\n\n---"}, {"id": "ch4_q19", "chapter_id": "ch4", "chapter_title": "บทที่ 4: IDPS & Lab 5 (Snort/Suricata Rules)", "reference": "NIST SP 800-94 & Lab 5", "q_num": 19, "question": "ในโจทย์ Lab 5-C ข้อ 7 ถามว่า: \"ถ้าต้องการให้ส่งผลไป **Centralized Log Server** ต้องทำอย่างไร?\" สถาปัตยกรรมมาตรฐานที่นิยมใช้มากที่สุดในปัจจุบันคือข้อใด?", "choices": {"A": "เขียนสคริปต์ก็อปปี้ไฟล์ทุกๆ เที่ยงคืนด้วยคำสั่ง ftp", "B": "คอนฟิกให้ Snort/Suricata ส่ง Alert ผ่านทาง Syslog daemon (ส่งต่อไปยัง SIEM Server / ELK Stack) หรือใช้โปรแกรม Log Shipper เช่น Filebeat/Fluentd อ่านจากไฟล์ `/var/log/snort/` หรือ `eve.json` ส่งไปยังเซิร์ฟเวอร์ส่วนกลาง", "C": "ส่ง SMS ไปหาผู้ดูแลระบบ", "D": "แชร์โฟลเดอร์ผ่าน Windows Samba โดยไม่ต้องตั้งรหัสผ่าน"}, "answer": "B", "explanation": "การรวมศูนย์ Log ของ IDPS มักคอนฟิกผ่าน Syslog facility (เช่น `output alert_syslog`) ส่งผ่านพอร์ต UDP 514 ไปยัง SIEM หรือใช้ Agent จำพวก Logstash/Filebeat คอยอ่านไฟล์ JSON ส่งไปยัง Elasticsearch/Splunk\n\n---"}, {"id": "ch4_q20", "chapter_id": "ch4", "chapter_title": "บทที่ 4: IDPS & Lab 5 (Snort/Suricata Rules)", "reference": "NIST SP 800-94 & Lab 5", "q_num": 20, "question": "ข้อดีของการนำ **Iperf** มาใช้สร้างทราฟฟิกปกติ (Normal Traffic) ระหว่างที่ Attacker กำลังทำ Port Scanning หรือ DoS ใน Lab 5-B และ 5-C คืออะไร?", "choices": {"A": "เพื่อแกล้งให้ IDS แฮงก์", "B": "เพื่อจำลองสถานการณ์จริงที่มีทราฟฟิกปกติและทราฟฟิกโจมตีปะปนกัน (Background Traffic) ช่วยในการทดสอบว่า IDS Rules ที่ตั้งขึ้นสามารถตรวจจับการโจมตีได้ถูกต้อง (True Positive) โดยไม่ส่งสัญญาณเตือนผิดพลาดต่อทราฟฟิกปกติ (False Positive)", "C": "เพื่อเพิ่มความเร็วของระบบเครือข่าย", "D": "เพื่อสร้างรหัสผ่านอัตโนมัติ"}, "answer": "B", "explanation": "ในการทดสอบ IDS ในสภาพแวดล้อมจริง จะต้องมีทราฟฟิกการใช้งานปกติวิ่งอยู่ตลอดเวลา การรัน Iperf ควบคู่ช่วยวัดความแม่นยำในการคัดแยกทราฟฟิกของ Rule และวัดผลว่าทราฟฟิกปกติได้รับผลกระทบหน่วงช้าลงเพียงใด"}, {"id": "ch5_q1", "chapter_id": "ch5", "chapter_title": "บทที่ 5: Firewall & Lab 6 (iptables & FortiGate)", "reference": "NIST SP 800-41 & Lab 6", "q_num": 1, "question": "ตามเอกสาร **NIST SP 800-41 Rev 1** ข้อใดคือบทบาทและคำจำกัดความที่ถูกต้องของ **Firewall** ในระบบเครือข่าย?", "choices": {"A": "ซอฟต์แวร์สแกนหาไวรัสในฮาร์ดดิสก์ของเครื่องลูกข่าย", "B": "อุปกรณ์หรือโปรแกรมที่ทำหน้าที่ควบคุมการไหลของทราฟฟิกเครือข่ายระหว่างเครือข่ายหรือโฮสต์ที่มีระดับนโยบายความมั่นคงปลอดภัยแตกต่างกัน (Differing security postures)", "C": "โปรโตคอลสำหรับเข้ารหัสสายเคเบิลใต้น้ำ", "D": "สวิตช์เลเยอร์ 2 ที่ทำหน้าที่กระจายสัญญาณ VLAN"}, "answer": "B", "explanation": "ไฟร์วอลล์คืออุปกรณ์หรือซอฟต์แวร์ที่วางคั่นเพื่อควบคุมและคัดกรองทราฟฟิกการสื่อสารระหว่างระบบเครือข่ายที่มีระดับความปลอดภัยไม่เท่ากัน เช่น ระหว่างอินเทอร์เน็ตสาธารณะกับเครือข่ายภายในองค์กร\n\n---"}, {"id": "ch5_q2", "chapter_id": "ch5", "chapter_title": "บทที่ 5: Firewall & Lab 6 (iptables & FortiGate)", "reference": "NIST SP 800-41 & Lab 6", "q_num": 2, "question": "เทคโนโลยีไฟร์วอลล์แบบ **Stateful Inspection Firewall** มีจุดเด่นที่เหนือกว่า **Stateless Packet Filtering Firewall** แบบดั้งเดิมอย่างไร?", "choices": {"A": "ตรวจจับไวรัสในระดับแรมได้รวดเร็วกว่า", "B": "มีการสร้างและบันทึกตารางสถานะการเชื่อมต่อ (State Table) เพื่อติดตามวงจรชีวิตของการเชื่อมต่อ (เช่น TCP Handshake, sequence numbers) และสามารถอนุญาตให้ทราฟฟิกตอบกลับ (Return Traffic) ที่เชื่อมต่ออยู่แล้วผ่านได้อัตโนมัติ", "C": "ไม่ต้องใช้ซีพียูในการประมวลผล", "D": "ป้องกันการโจมตีแบบ DDoS ขนาดใหญ่ได้ 100% เสมอ"}, "answer": "B", "explanation": "Stateful Inspection จะเฝ้าติดตามบริบทของการเชื่อมต่อผ่าน State Table (เช่น สถานะ NEW, ESTABLISHED, RELATED) ทำให้สามารถอนุญาตแพ็กเก็ตที่เป็นฝั่งตอบรับของการเชื่อมต่อไปยังผู้ใช้ภายในได้โดยไม่ต้องเปิดพอร์ตทิ้งไว้แบบ Stateless\n\n---"}, {"id": "ch5_q3", "chapter_id": "ch5", "chapter_title": "บทที่ 5: Firewall & Lab 6 (iptables & FortiGate)", "reference": "NIST SP 800-41 & Lab 6", "q_num": 3, "question": "ความสามารถใดเป็นคุณสมบัติเด่นของ **Application Firewall (Proxy Firewall / Deep Packet Inspection)** ที่ไฟร์วอลล์ระดับเครือข่ายทั่วไปไม่สามารถทำได้?", "choices": {"A": "การตรวจจับและบล็อกคำสั่งเฉพาะภายในแอปพลิเคชัน เช่น บล็อกคำสั่ง `put` ใน FTP หรือตรวจสอบไฟล์แนบอันตรายในอีเมล", "B": "การเข้ารหัสการ์ดแลนในระดับฮาร์ดแวร์", "C": "การปรับแรงดันไฟฟ้าของพอร์ตเราเตอร์", "D": "การทำงานได้โดยไม่ต้องกำหนดหมายเลข IP"}, "answer": "A", "explanation": "Application Firewall สามารถแกะดูเนื้อหาใน Application Layer (Layer 7) จึงสามารถบังคับใช้นโยบายเชิงลึก เช่น ห้ามอัปโหลดไฟล์ผ่านคำสั่ง FTP `put`, ตรวจสอบประเภทไฟล์แนบของอีเมล หรือตรวจจับการใช้โปรโตคอลแชตบนพอร์ต 80\n\n---"}, {"id": "ch5_q4", "chapter_id": "ch5", "chapter_title": "บทที่ 5: Firewall & Lab 6 (iptables & FortiGate)", "reference": "NIST SP 800-41 & Lab 6", "q_num": 4, "question": "ข้อจำกัดที่สำคัญที่สุด (Limitations of Firewall Inspection) ของไฟร์วอลล์ยุคปัจจุบันที่ทำให้ไม่สามารถตรวจสอบภัยคุกคามในเพย์โหลดได้โดยตรงคือข้อใด?", "choices": {"A": "ทราฟฟิกที่ใช้สายแลน Cat 6", "B": "ทราฟฟิกที่เข้ารหัส (Encrypted Traffic เช่น HTTPS/TLS, SSH) และทราฟฟิกที่วิ่งผ่านทันเนล (Tunneled Traffic เช่น VPN)", "C": "ทราฟฟิกที่ส่งผ่านโพรโทคอล UDP", "D": "ทราฟฟิกที่มาจากระบบปฏิบัติการ Linux"}, "answer": "B", "explanation": "ไฟร์วอลล์ไม่สามารถตรวจสอบข้อมูลที่ถูกเข้ารหัสจากต้นทางถึงปลายทาง (End-to-End Encryption) หรือทราฟฟิกที่ห่อหุ้มในทันเนลได้ เว้นแต่จะมีระบบ SSL/TLS Decryption (SSL Inspection) ถอดรหัสตรงจุดไฟร์วอลล์\n\n---"}, {"id": "ch5_q5", "chapter_id": "ch5", "chapter_title": "บทที่ 5: Firewall & Lab 6 (iptables & FortiGate)", "reference": "NIST SP 800-41 & Lab 6", "q_num": 5, "question": "พื้นที่เครือข่ายที่เรียกว่า **DMZ (Demilitarized Zone หรือ Screened Subnet)** นิยมนำมาใช้วางระบบเซิร์ฟเวอร์ประเภทใด?", "choices": {"A": "เครื่องดาต้าเบสหลักที่เก็บความลับสุดยอดทางการเงินขององค์กร", "B": "ระบบเซิร์ฟเวอร์ที่จำเป็นต้องเปิดให้บริการแก่ผู้ใช้งานภายนอกจากอินเทอร์เน็ตสาธารณะ เช่น Public Web Server, Mail Server, หรือ DNS Server", "C": "เครื่องคอมพิวเตอร์ส่วนบุคคลของฝ่ายบัญชี", "D": "เซิร์ฟเวอร์ Active Directory ภายใน"}, "answer": "B", "explanation": "DMZ เป็นโซนกึ่งปลอดภัยที่แยกออกมาจากเครือข่ายภายใน (Inside LAN) โดยเอาไว้ติดตั้งเซิร์ฟเวอร์ที่ต้องเปิดให้โลกภายนอก (Internet/WAN) เข้าถึง เพื่อที่ว่าหากเซิร์ฟเวอร์ใน DMZ ถูกแฮก ผู้โจมตีจะยังไม่สามารถเจาะทะลุเข้าสู่ LAN ภายในได้โดยตรง\n\n---"}, {"id": "ch5_q6", "chapter_id": "ch5", "chapter_title": "บทที่ 5: Firewall & Lab 6 (iptables & FortiGate)", "reference": "NIST SP 800-41 & Lab 6", "q_num": 6, "question": "หลักการออกแบบนโยบายความมั่นคงปลอดภัยของไฟร์วอลล์ที่ดีที่สุดตามมาตรฐานสากล (Best Practice Firewall Policy) คือข้อใด?", "choices": {"A": "Default Allow (ยอมรับทราฟฟิกทั้งหมด ยกเว้นพอร์ตที่ระบุว่าห้าม)", "B": "Default Deny หรือ Implicit Deny (ปฏิเสธและทิ้งทราฟฟิกทั้งหมดเป็นค่าเริ่มต้น และอนุญาตเฉพาะทราฟฟิกที่จำเป็นต่อธุรกิจเท่านั้น)", "C": "เปิดทุกพอร์ตในเวลากลางวัน และปิดทุกพอร์ตในเวลากลางคืน", "D": "อนุญาตเฉพาะทราฟฟิกที่ไม่มีการเข้ารหัส"}, "answer": "B", "explanation": "นโยบายแบบ Default Deny (Implicit Deny All) ถือเป็นกฎข้อสุดท้ายของทุกไฟร์วอลล์ โดยจะไม่อนุญาตให้ทราฟฟิกใดๆ วิ่งผ่านนอกจากจะตรงกับเงื่อนไขในกฎ Whitelist ที่ผู้ดูแลระบบสร้างไว้อย่างชัดเจน\n\n---"}, {"id": "ch5_q7", "chapter_id": "ch5", "chapter_title": "บทที่ 5: Firewall & Lab 6 (iptables & FortiGate)", "reference": "NIST SP 800-41 & Lab 6", "q_num": 7, "question": "ในเอกสารประกอบการสอน Lab 6 มีคำเตือนสำคัญระบุว่าเหตุใดจึง**ไม่ควรใช้ FortiGate เวอร์ชัน 7 (FGT ver. 7)** ในการทดลอง แต่แนะนำให้ใช้เวอร์ชัน 6.4.15?", "choices": {"A": "เพราะเวอร์ชัน 7 ใช้แรมเกิน 64 GB", "B": "เพราะเวอร์ชันประเมิน (Evaluation License) ของ FGT ver. 7 มีข้อจำกัดไม่ยอมให้เลือก TLS/SSL และ Encryption Method ในการทำ VPN ซึ่งจะทำให้เกิดปัญหาในการเชื่อมต่อกับ Client ในแล็บถัดไป", "C": "เพราะเวอร์ชัน 7 ไม่รองรับพอร์ต Ethernet", "D": "เพราะเวอร์ชัน 7 รันบน GNS3 ไม่ได้"}, "answer": "B", "explanation": "ในชีต Lab 6-A ระบุชัดเจนว่า: \"(ห้ามใช้ ver. 7 เพราะ FGT Eval. Ver. จะเลือก TLS/SSL และ Encryption Method ในการทำ VPN ไม่ได้ ทำให้มีปัญหาในการ Connect ด้วย Client ที่ตัวเลือกบังคับเช่นกัน)\"\n\n---"}, {"id": "ch5_q8", "chapter_id": "ch5", "chapter_title": "บทที่ 5: Firewall & Lab 6 (iptables & FortiGate)", "reference": "NIST SP 800-41 & Lab 6", "q_num": 8, "question": "ในโจทย์ Lab 6-A มีการจัดแบ่งโซนเครือข่ายและหมายเลขไอพีซับเน็ตออกเป็น 3 โซน ข้อใดจับคู่ Subnet ได้ถูกต้องตรงตามใบงาน?", "choices": {"A": "Management: `10.30.6.0/24` | Outside: `203.0.113.0/24` | Inside: `192.168.1.0/24`", "B": "Management: `192.168.1.0/24` | Outside: `10.0.0.0/8` | Inside: `172.16.0.0/16`", "C": "Management: `172.20.0.0/24` | Outside: `8.8.8.0/24` | Inside: `192.168.0.0/24`", "D": "Management: `10.0.0.0/24` | Outside: `192.168.1.0/24` | Inside: `203.0.113.0/24`"}, "answer": "A", "explanation": "ในสไลด์ Lab 6-A และ 6-B ระบุตาราง Zone ชัดเจน:\n- Management: `10.30.6.0/24`\n- Outside: `203.0.113.0/24`\n- Inside: `192.168.1.0/24`\n\n---"}, {"id": "ch5_q9", "chapter_id": "ch5", "chapter_title": "บทที่ 5: Firewall & Lab 6 (iptables & FortiGate)", "reference": "NIST SP 800-41 & Lab 6", "q_num": 9, "question": "ในคำสั่ง CLI ของอุปกรณ์ **FortiOS (FortiGate)** ไวยากรณ์ในการคอนฟิกให้พอร์ตอินเทอร์เฟซยอมรับการเข้าถึงเพื่อบริหารจัดการด้วยโปรโตคอล PING, HTTPS, SSH และ HTTP คือข้อใด?", "choices": {"A": "`set allowaccess ping https ssh http`", "B": "`permit admin-protocols all`", "C": "`enable interface-access 22 80 443 icmp`", "D": "`access-list permit management-ports`"}, "answer": "A", "explanation": "ใน FortiGate CLI คำสั่งกำหนดโปรโตคอลที่ยอมให้เข้ามาบริหารจัดการบน Interface คือคำสั่ง `set allowaccess <protocols...>` เช่น `set allowaccess ping https ssh http` ภายใต้โหมด `config system interface`\n\n---"}, {"id": "ch5_q10", "chapter_id": "ch5", "chapter_title": "บทที่ 5: Firewall & Lab 6 (iptables & FortiGate)", "reference": "NIST SP 800-41 & Lab 6", "q_num": 10, "question": "ข้อใดคือโครงสร้างคำสั่ง FortiGate CLI ที่ถูกต้องในการสร้าง **Firewall Policy** เพื่ออนุญาตทราฟฟิกจากพอร์ต Inside ไปยังพอร์ต Outside โดยปิดการทำงานของ NAT ตามเงื่อนไขของ Lab 6-B?", "choices": {"A": "```text\nconfig firewall policy\n  edit 1\n    set srcintf \"port2\"\n    set dstintf \"port3\"\n    set srcaddr \"all\"\n    set dstaddr \"all\"\n    set action accept\n    set schedule \"always\"\n    set service \"ALL\"\n    set nat disable\n  next\nend\n```", "B": "```text\nfirewall add rule from port2 to port3 allow-all no-nat\n```", "C": "```text\npermit ip interface port2 to interface port3 without nat\n```", "D": "```text\nconfig rule set input=port2 output=port3 nat=off\n```"}, "answer": "A", "explanation": "ไวยากรณ์มาตรฐานของ FortiOS ในการสร้างนโยบายไฟร์วอลล์จะต้องขึ้นต้นด้วย `config firewall policy` ตามด้วย `edit <id>` และกำหนด `srcintf`, `dstintf`, `srcaddr`, `dstaddr`, `action accept`, และ `set nat disable` ก่อนปิดด้วย `next` และ `end`\n\n---"}, {"id": "ch5_q11", "chapter_id": "ch5", "chapter_title": "บทที่ 5: Firewall & Lab 6 (iptables & FortiGate)", "reference": "NIST SP 800-41 & Lab 6", "q_num": 11, "question": "ในโจทย์ Lab 6-B มีคำถามวิเคราะห์ว่า: *\"จาก Guideline ที่ว่าเราควรใช้ NAT สำหรับการทำ Routing เท่านั้น โดยไม่ควรใช้มันโดยหวังผลเรื่องของ Security นักศึกษาเห็นด้วยหรือไม่ อย่างไร?\"* คำอธิบายตามหลักการ Security สากลที่ถูกต้องคือข้อใด?", "choices": {"A": "ไม่เห็นด้วย เพราะ NAT สามารถป้องกันไวรัสได้ทุกชนิด", "B": "เห็นด้วย เพราะ NAT (Network Address Translation) เป็นเพียงกลไกแปลงหมายเลข IP เพื่อประหยัดพื้นที่ IPv4 และจัดสรรเส้นทาง โดยไม่ได้ทำหน้าที่ตรวจสอบเนื้อหาเพย์โหลดหรือบันทึก Connection State ที่แท้จริง การรักษาความปลอดภัยต้องอาศัยการตั้งค่า Firewall Access Rules ที่เข้มงวดเท่านั้น", "C": "ไม่เห็นด้วย เพราะการทำ NAT ถือเป็นการเข้ารหัสข้อมูลระดับสูงสุด", "D": "เห็นด้วย เพราะ NAT ทำให้ความเร็วอินเทอร์เน็ตเพิ่มขึ้นเป็นสองเท่า"}, "answer": "B", "explanation": "ผู้เชี่ยวชาญด้านความมั่นคงปลอดภัยเน้นย้ำเสมอว่า \"NAT is not a security tool\" แม้ NAT จะซ่อน Private IP แต่ไม่สามารถทดแทน Firewall Inspection และ Policy Enforcement ได้เลย\n\n---"}, {"id": "ch5_q12", "chapter_id": "ch5", "chapter_title": "บทที่ 5: Firewall & Lab 6 (iptables & FortiGate)", "reference": "NIST SP 800-41 & Lab 6", "q_num": 12, "question": "ในระบบปฏิบัติการ Linux เครื่องมือ **iptables** มีการจัดแบ่งตาราง (Tables) ออกเป็นหมวดหมู่ ตารางใดเป็นตารางปริยาย (Default Table) ที่ใช้สำหรับการกรองแพ็กเก็ต (Packet Filtering) ทั่วไป?", "choices": {"A": "`nat`", "B": "`mangle`", "C": "`filter`", "D": "`raw`"}, "answer": "C", "explanation": "ตารางใน iptables ประกอบด้วย:\n- `filter`: สำหรับการคัดกรองแพ็กเก็ต (เป็นค่าดีฟอลต์หากไม่ระบุตาราง)\n- `nat`: สำหรับการแปลงที่อยู่ IP และพอร์ต (SNAT, DNAT)\n- `mangle`: สำหรับการแก้ไข Packet Headers พิเศษ (เช่น TOS, TTL)\n- `raw`: สำหรับตั้งค่ายกเว้นการติดตามสถานะ (NOTRACK)\n\n---"}, {"id": "ch5_q13", "chapter_id": "ch5", "chapter_title": "บทที่ 5: Firewall & Lab 6 (iptables & FortiGate)", "reference": "NIST SP 800-41 & Lab 6", "q_num": 13, "question": "ในตาราง `filter` ของ **iptables** มี Chain หลัก 3 ตัว Chain ใดที่ทำหน้าที่ตรวจสอบแพ็กเก็ตที่มีจุดหมายปลายทางวิ่ง **ทะลุผ่าน (Transit / Routed)** เครื่องลินุกซ์นี้ไปยังเครื่องอื่น?", "choices": {"A": "`INPUT`", "B": "`OUTPUT`", "C": "`FORWARD`", "D": "`PREROUTING`"}, "answer": "C", "explanation": "- `INPUT`: แพ็กเก็ตที่ส่งมายังเครื่อง Local Linux นี้โดยตรง\n- `OUTPUT`: แพ็กเก็ตที่ถูกสร้างจากเครื่อง Local Linux นี้ส่งออกไป\n- `FORWARD`: แพ็กเก็ตที่วิ่งผ่านเครื่องนี้เพื่อไปยังเครือข่ายปลายทางอื่น (ทำหน้าที่เป็นเราเตอร์/ไฟร์วอลล์)\n\n---"}, {"id": "ch5_q14", "chapter_id": "ch5", "chapter_title": "บทที่ 5: Firewall & Lab 6 (iptables & FortiGate)", "reference": "NIST SP 800-41 & Lab 6", "q_num": 14, "question": "คำสั่ง **iptables** ใดที่ใช้กำหนดให้นโยบายปริยาย (Default Policy) ของ Chain `INPUT` เป็นการปฏิเสธทราฟฟิกทั้งหมด (DROP) ตามหลักการ Default Deny?", "choices": {"A": "`iptables -P INPUT DROP`", "B": "`iptables -D INPUT ALL`", "C": "`iptables -A INPUT -j REJECT`", "D": "`iptables --set-policy INPUT BLOCK`"}, "answer": "A", "explanation": "ออปชัน `-P` (Policy) ใช้สำหรับกำหนดดีฟอลต์แอ็กชันของ Chain นั้นๆ เช่น `iptables -P INPUT DROP` หรือ `iptables -P FORWARD DROP`\n\n---"}, {"id": "ch5_q15", "chapter_id": "ch5", "chapter_title": "บทที่ 5: Firewall & Lab 6 (iptables & FortiGate)", "reference": "NIST SP 800-41 & Lab 6", "q_num": 15, "question": "คำสั่ง **iptables** ข้อใดที่เปิดรับเฉพาะการเชื่อมต่อแบบ **SSH (TCP พอร์ต 22)** เข้ามายังเครื่องตนเอง?", "choices": {"A": "`iptables -A INPUT -p tcp --dport 22 -j ACCEPT`", "B": "`iptables -A OUTPUT -p udp --sport 22 -j ACCEPT`", "C": "`iptables -I FORWARD -p icmp --port 22 -j DROP`", "D": "`iptables -A INPUT -s 22 -j ALLOW`"}, "answer": "A", "explanation": "- `-A INPUT`: ต่อท้ายกฎใน Chain INPUT\n- `-p tcp`: โพรโทคอล TCP\n- `--dport 22`: Destination port หมายเลข 22 (SSH)\n- `-j ACCEPT`: Jump target ไปที่ ACCEPT\n\n---"}, {"id": "ch5_q16", "chapter_id": "ch5", "chapter_title": "บทที่ 5: Firewall & Lab 6 (iptables & FortiGate)", "reference": "NIST SP 800-41 & Lab 6", "q_num": 16, "question": "ในการคอนฟิก Stateful Firewall ด้วย **iptables** ข้อใดคือคำสั่งที่อนุญาตให้แพ็กเก็ตที่เป็นทราฟฟิกตอบกลับของการเชื่อมต่อเดิมที่เคยอนุญาตไปแล้ว (Established and Related connections) สามารถวิ่งผ่านได้โดยอัตโนมัติ?", "choices": {"A": "`iptables -A FORWARD -m state --state ESTABLISHED,RELATED -j ACCEPT`", "B": "`iptables -A INPUT --return-traffic accept`", "C": "`iptables -A FORWARD -p all --stateful on`", "D": "`iptables -I OUTPUT --allow-reply`"}, "answer": "A", "explanation": "โมดูล `-m state --state ESTABLISHED,RELATED` เป็นหัวใจสำคัญของ Stateful Firewall ใน iptables เพื่อให้แพ็กเก็ตที่เป็นขากลับของการเชื่อมต่อที่เริ่มอย่างถูกต้องสามารถผ่านได้ทันที\n\n---"}, {"id": "ch5_q17", "chapter_id": "ch5", "chapter_title": "บทที่ 5: Firewall & Lab 6 (iptables & FortiGate)", "reference": "NIST SP 800-41 & Lab 6", "q_num": 17, "question": "คำสั่งในการล้าง (Flush) กฎทั้งหมดในทุก Chain ของตารางปัจจุบันใน iptables คือคำสั่งใด?", "choices": {"A": "`iptables -F`", "B": "`iptables -X`", "C": "`iptables -L`", "D": "`iptables -Z`"}, "answer": "A", "explanation": "- `-F` (Flush): ลบล้างกฎทั้งหมดในตาราง\n- `-L` (List): แสดงรายชื่อกฎ\n- `-Z` (Zero): รีเซ็ตตัวนับแพ็กเก็ตเป็นศูนย์\n- `-X` (Delete Chain): ลบ Chain ที่ผู้ใช้สร้างขึ้นเอง\n\n---"}, {"id": "ch5_q18", "chapter_id": "ch5", "chapter_title": "บทที่ 5: Firewall & Lab 6 (iptables & FortiGate)", "reference": "NIST SP 800-41 & Lab 6", "q_num": 18, "question": "หากต้องการดูรายชื่อกฎใน **iptables** พร้อมแสดงสถิติจำนวนแพ็กเก็ต (Packets), ไบต์ (Bytes) และแสดงหมายเลขพอร์ต/ไอพีเป็นตัวเลข (Numeric) ไม่ให้แปลงเป็นชื่อโฮสต์ช้าๆ ต้องใช้คำสั่งใด?", "choices": {"A": "`iptables -L -n -v`", "B": "`iptables --show-rules`", "C": "`iptables -S -a`", "D": "`iptables -view-all`"}, "answer": "A", "explanation": "- `-L`: List กฎ\n- `-n`: Numeric แสดงผลลัพธ์ IP และ Port เป็นตัวเลขล้วน (ไม่ติด DNS Reverse Lookup)\n- `-v`: Verbose แสดงข้อมูลละเอียดรวม Packet และ Byte Counters\n\n---"}, {"id": "ch5_q19", "chapter_id": "ch5", "chapter_title": "บทที่ 5: Firewall & Lab 6 (iptables & FortiGate)", "reference": "NIST SP 800-41 & Lab 6", "q_num": 19, "question": "ในระบบปฏิบัติการ Linux ตระกูล Debian/Ubuntu ไฟล์ที่ใช้จัดเก็บกฎ iptables แบบถาวร (Persistent Rules) เพื่อให้โหลดขึ้นมาอัตโนมัติหลังรีบูตระบบคือไฟล์ใด?", "choices": {"A": "`/etc/iptables/rules.v4`", "B": "`/var/log/iptables.log`", "C": "`/etc/network/firewall.conf`", "D": "`/usr/bin/iptables.rules`"}, "answer": "A", "explanation": "เมื่อติดตั้งแพ็กเกจ `iptables-persistent` กฎ IPv4 จะถูกเซฟไว้ที่ `/etc/iptables/rules.v4` (และ `/etc/iptables/rules.v6` สำหรับ IPv6) ผ่านคำสั่ง `iptables-save > /etc/iptables/rules.v4`\n\n---"}, {"id": "ch5_q20", "chapter_id": "ch5", "chapter_title": "บทที่ 5: Firewall & Lab 6 (iptables & FortiGate)", "reference": "NIST SP 800-41 & Lab 6", "q_num": 20, "question": "ความแตกต่างที่สำคัญในเชิงสถาปัตยกรรมระหว่างการทำ **Access Control บน Firewall** เปรียบเทียบกับการใช้ **Access Control Lists (ACLs) บนเราเตอร์แบบดั้งเดิม** คือข้อใด?", "choices": {"A": "เราเตอร์สามารถตรวจจับไวรัสในแอปพลิเคชันได้ดีกว่าไฟร์วอลล์", "B": "ACL บนเราเตอ
