ร์ดั้งเดิมทำงานแบบ Stateless (ตรวจทีละแพ็กเก็ตแยกเดี่ยว ไม่จดจำการเชื่อมต่อ) ทำให้ต้องเปิดพอร์ตขากลับไว้ตลอดเวลา ในขณะที่ Firewall ทำงานแบบ Stateful/Deep Inspection มี State Table และรองรับการจัดการ Policy และ Zone ที่ยืดหยุ่นกว่ามาก", "C": "ACL บนเราเตอร์ทำงานช้ากว่าไฟร์วอลล์ 100 เท่า", "D": "ไฟร์วอลล์ไม่สามารถจัดการ IP Address ได้"}, "answer": "B", "explanation": "เราเตอร์ ACL แบบดั้งเดิมเป็น Stateless คัดกรองจากฟิลด์ใน Header ต่อแพ็กเก็ต ทำให้ต้องเขียน Permit พอร์ตสูงๆ ฝั่งขากลับทิ้งไว้ เกิดช่องโหว่ความปลอดภัย ขณะที่ Firewall เป็น Stateful ติดตามสถานะ Session แบบไดนามิก"}, {"id": "ch6_q1", "chapter_id": "ch6", "chapter_title": "บทที่ 6: Security Testing (NIST SP 800-115)", "reference": "NIST SP 800-115", "q_num": 1, "question": "ตามมาตรฐาน **NIST SP 800-115** วงจรระเบียบวิธีในการประเมินความมั่นคงปลอดภัย (Information Security Assessment Methodology) แบ่งออกเป็น 3 ขั้นตอนหลักตามข้อใด?", "choices": {"A": "Initial, Middle, Final", "B": "Planning, Execution, และ Post-Execution", "C": "Scanning, Exploitation, Reporting", "D": "Policy, Implementation, Audit"}, "answer": "B", "explanation": "NIST SP 800-115 กำหนดขั้นตอนการประเมินความมั่นคงปลอดภัยออกเป็น 3 เฟสหลัก:\n1. **Planning Phase:** การวางแผน กำหนดขอบเขต และจัดทำข้อตกลง\n2. **Execution Phase:** การลงมือทดสอบ ระบุช่องโหว่ และยืนยันความถูกต้อง\n3. **Post-Execution Phase:** การวิเคราะห์สาเหตุที่แท้จริง (RCA), ทำรายงาน และล้างข้อมูลทดสอบ\n\n---"}, {"id": "ch6_q2", "chapter_id": "ch6", "chapter_title": "บทที่ 6: Security Testing (NIST SP 800-115)", "reference": "NIST SP 800-115", "q_num": 2, "question": "เทคนิคการประเมินในกลุ่ม **Review Techniques** ตาม NIST SP 800-115 มุ่งเน้นการกระทำในลักษณะใด?", "choices": {"A": "การส่งแพ็กเก็ตจำลองการโจมตีเพื่อทำให้เซิร์ฟเวอร์ค้าง", "B": "การตรวจสอบเอกสาร นโยบาย ค่าคอนฟิกูเรชันของระบบ (System Configuration) ล็อกไฟล์ (Log Review) และชุดกฎระเบียบ (Ruleset Review) โดยไม่ส่งแพ็กเก็ตทดสอบการโจมตีจริง", "C": "การแอบดักจับรหัสผ่าน Wi-Fi ของพนักงาน", "D": "การเจาะเข้าระบบฐานข้อมูลเพื่อดาวน์โหลดข้อมูลบัตรเครดิต"}, "answer": "B", "explanation": "Review Techniques เป็นการตรวจสอบเชิงรับ (Passive Examination) มุ่งเน้นการตรวจเอกสาร, บันทึกการทำงาน (Logs), การตั้งค่าคอนฟิกของระบบ และกฎเกณฑ์ (Firewall/Router Rulesets) เพื่อหาจุดบกพร่องตามมาตรฐาน\n\n---"}, {"id": "ch6_q3", "chapter_id": "ch6", "chapter_title": "บทที่ 6: Security Testing (NIST SP 800-115)", "reference": "NIST SP 800-115", "q_num": 3, "question": "เทคนิคใดต่อไปนี้จัดอยู่ในกลุ่ม **Target Identification and Analysis Techniques** ตามมาตรฐาน NIST SP 800-115?", "choices": {"A": "Documentation Review", "B": "Network Discovery, Network Port and Service Identification, และ Vulnerability Scanning", "C": "Social Engineering", "D": "Password Cracking"}, "answer": "B", "explanation": "Target Identification and Analysis คือการค้นหาและระบุเป้าหมาย เช่น Network Discovery (ค้นหาโฮสต์), Port and Service Identification (ค้นหาพอร์ตและเซอร์วิส), Vulnerability Scanning (สแกนหาช่องโหว่), และ Wireless Scanning\n\n---"}, {"id": "ch6_q4", "chapter_id": "ch6", "chapter_title": "บทที่ 6: Security Testing (NIST SP 800-115)", "reference": "NIST SP 800-115", "q_num": 4, "question": "เทคนิคใดต่อไปนี้จัดอยู่ในกลุ่ม **Target Vulnerability Validation Techniques** ซึ่งเป็นการพิสูจน์ยืนยันว่าช่องโหว่ที่ตรวจพบสามารถถูกนำไปใช้ประโยชน์ในการเจาะระบบได้จริงหรือไม่?", "choices": {"A": "Penetration Testing, Password Cracking, และ Social Engineering", "B": "Ruleset Review", "C": "Network Sniffing", "D": "Log Analysis"}, "answer": "A", "explanation": "Target Vulnerability Validation Techniques เป็นการยืนยันว่าช่องโหว่มีจริงและใช้ประโยชน์ได้ (Exploitable) ประกอบด้วย 3 เทคนิคหลักคือ: 1. Password Cracking, 2. Penetration Testing (การทดสอบเจาะระบบ), และ 3. Social Engineering\n\n---"}, {"id": "ch6_q5", "chapter_id": "ch6", "chapter_title": "บทที่ 6: Security Testing (NIST SP 800-115)", "reference": "NIST SP 800-115", "q_num": 5, "question": "การทดสอบเจาะระบบแบบ **Black Box Testing** มีคุณลักษณะที่เด่นชัดอย่างไร?", "choices": {"A": "ผู้ทดสอบได้รับแบบแปลนสถาปัตยกรรมเครือข่ายและซอร์สโค้ดของแอปพลิเคชันล่วงหน้าอย่างละเอียด", "B": "ผู้ทดสอบไม่มีข้อมูลหรือความรู้ภายในเกี่ยวกับระบบเป้าหมายล่วงหน้าเลย (Zero Knowledge) เพื่อจำลองสถานการณ์เหมือนการโจมตีจากแฮกเกอร์ภายนอกองค์กรอย่างแท้จริง", "C": "ผู้ทดสอบได้รับบัญชีผู้ดูแลระบบระดับ Root หรือ Domain Admin ตั้งแต่วันแรก", "D": "ผู้ทดสอบทำการทดสอบเฉพาะในห้องมืดเท่านั้น"}, "answer": "B", "explanation": "- **Black Box:** ผู้ทดสอบไม่มีข้อมูลภายในใดๆ (จำลองแฮกเกอร์ภายนอก)\n- **White Box (Clear Box):** ผู้ทดสอบมีข้อมูลครบถ้วน ซอร์สโค้ด ผังระบบ และสิทธิ์เต็มที่\n- **Gray Box:** ผู้ทดสอบมีข้อมูลบางส่วน (จำลองพนักงานภายในหรือผู้ใช้ทั่วไป)\n\n---"}, {"id": "ch6_q6", "chapter_id": "ch6", "chapter_title": "บทที่ 6: Security Testing (NIST SP 800-115)", "reference": "NIST SP 800-115", "q_num": 6, "question": "การทดสอบแบบ **White Box Testing** (หรือ Clear Box Testing) มีประโยชน์ที่เหนือกว่า Black Box อย่างไรในแง่ของความคุ้มค่าและความครอบคลุม?", "choices": {"A": "ไม่ต้องขออนุญาตผู้บริหารระดับสูง", "B": "ช่วยประหยัดเวลาในการค้นหาข้อมูลเบื้องต้น และสามารถตรวจสอบเจาะลึกไปยังจุดเสี่ยง ซอร์สโค้ด หรือสถาปัตยกรรมภายในที่การสแกนจากภายนอกเข้าไม่ถึงได้อย่างทั่วถึง", "C": "ไม่ทิ้งร่องรอยใน Log ของระบบ", "D": "ทำการทดสอบได้โดยไม่ต้องใช้อินเทอร์เน็ต"}, "answer": "B", "explanation": "White Box ช่วยให้ผู้ประเมินสามารถเข้าถึงข้อมูลเชิงลึก การออกแบบ และคอนฟิกโดยตรง ทำให้ตรวจพบช่องโหว่ที่ซ่อนลึกใน Logic หรือ Source Code ซึ่งการสแกน Black Box แบบสุ่มอาจมองข้ามไป\n\n---"}, {"id": "ch6_q7", "chapter_id": "ch6", "chapter_title": "บทที่ 6: Security Testing (NIST SP 800-115)", "reference": "NIST SP 800-115", "q_num": 7, "question": "เอกสาร **Rules of Engagement (ROE)** ในการทดสอบเจาะระบบ (Penetration Testing) มีความสำคัญสูงสุดในเรื่องใด?", "choices": {"A": "เป็นคู่มือการติดตั้งโปรแกรม Kali Linux", "B": "เป็นข้อตกลงอย่างเป็นทางการที่กำหนดขอบเขต (Scope), วันเวลาที่อนุญาต, ระบบที่ห้ามทดสอบ, เทคนิคที่อนุญาตและไม่อนุญาต, รายชื่อผู้ติดต่อฉุกเฉิน, และการคุ้มครองทางกฎหมายเพื่อป้องกันความเสียหายต่อธุรกิจ", "C": "เป็นสคริปต์อัตโนมัติสำหรับการรัน Nmap", "D": "เป็นใบเสร็จรับเงินสำหรับค่าจ้างผู้ทดสอบ"}, "answer": "B", "explanation": "ROE (Rules of Engagement) คือสัญญาและกรอบข้อตกลงร่วมกันระหว่างทีมผู้ทดสอบและผู้ว่าจ้าง เพื่อระบุเป้าหมายที่อนุญาต (In-Scope), สิ่งที่ห้ามแตะต้อง (Out-of-Scope), ขอบเขตความเสียหายที่ยอมรับได้ และแนวทางประสานงานเมื่อเกิดเหตุฉุกเฉิน\n\n---"}, {"id": "ch6_q8", "chapter_id": "ch6", "chapter_title": "บทที่ 6: Security Testing (NIST SP 800-115)", "reference": "NIST SP 800-115", "q_num": 8, "question": "ในส่วนประกอบของเทมเพลต **ROE** หมวด **Logistics & Personnel** จะต้องระบุข้อมูลสำคัญข้อใดตามสไลด์การบรรยาย?", "choices": {"A": "ยี่ห้อของแล็ปท็อปที่ทีมทดสอบนำมาใช้งาน", "B": "รายชื่อและข้อมูลติดต่อ (Points of Contact) ของทีมทดสอบ, ผู้บริหารองค์กร และทีม Incident Response รวมถึงขั้นตอน Escalation ในกรณีที่เกิดเหตุระบบล่ม", "C": "รหัสผ่าน Facebook ของผู้ดูแลระบบ", "D": "รายการอาหารกลางวันของทีมงาน"}, "answer": "B", "explanation": "สไลด์ ROE Template หมวด Logistics & Personnel ระบุว่าจะต้องมีตาราง Contact Information ของทีมทดสอบ, ฝ่ายบริหาร และทีมตอบสนองเหตุการณ์ (Incident Response) เพื่อให้สามารถติดต่อแจ้งเหตุฉุกเฉินได้ทันที\n\n---"}, {"id": "ch6_q9", "chapter_id": "ch6", "chapter_title": "บทที่ 6: Security Testing (NIST SP 800-115)", "reference": "NIST SP 800-115", "q_num": 9, "question": "ในขั้นตอนการวางแผนการทดสอบ (Planning Phase) เหตุใดจึงต้องกำหนดเรื่อง **Legal and Policy Considerations** ไว้อย่างชัดเจน?", "choices": {"A": "เพื่อหลีกเลี่ยงการจ่ายภาษีมูลค่าเพิ่ม", "B": "เพื่อให้มั่นใจว่ากิจกรรมการทดสอบได้รับความยินยอมเป็นลายลักษณ์อักษรจากเจ้าของระบบอย่างถูกต้องตามกฎหมาย และไม่ละเมิด พ.ร.บ. ว่าด้วยการกระทำความผิดเกี่ยวกับคอมพิวเตอร์ หรือกฎหมายคุ้มครองข้อมูลส่วนบุคคล (PDPA/GDPR)", "C": "เพื่อให้สามารถเผยแพร่รหัสผ่านลงบนอินเทอร์เน็ตได้", "D": "เพื่อยกเว้นการตรวจสอบบัญชีประจำปี"}, "answer": "B", "explanation": "การทดสอบความปลอดภัยหรือการยิง Exploit โดยไม่มีหนังสือยินยอม (Authorization Letter) มีความผิดตามกฎหมายอาญาและ พ.ร.บ. คอมพิวเตอร์ การมีข้อตกลงทางกฎหมายจึงเป็นสิ่งจำเป็นสูงสุดก่อนเริ่มทดสอบ\n\n---"}, {"id": "ch6_q10", "chapter_id": "ch6", "chapter_title": "บทที่ 6: Security Testing (NIST SP 800-115)", "reference": "NIST SP 800-115", "q_num": 10, "question": "การวิเคราะห์หาสาเหตุที่แท้จริง หรือ **Root Cause Analysis (RCA)** ในขั้นตอน Post-Execution มีเป้าหมายสำคัญอย่างไรต่อองค์กร?", "choices": {"A": "เพื่อหาตัวบุคคลผู้ทำผิดและลงโทษทางวินัย", "B": "เพื่อระบุต้นตอของปัญหาในระดับกระบวนการหรือนโยบาย (เช่น ขาดนโยบาย Patch Management หรือขาดการอบรม Secure Coding) มากกว่าการแก้ปัญหาเฉพาะหน้าแบบรายจุด เพื่อยกระดับความปลอดภัยในระยะยาว", "C": "เพื่อส่งข้อมูลช่องโหว่ไปยังกลุ่มแฮกเกอร์", "D": "เพื่อลดจำนวนพนักงานฝ่ายไอทีลง"}, "answer": "B", "explanation": "RCA มุ่งเน้นการตอบคำถามว่า \"ทำไมช่องโหว่นี้จึงเกิดขึ้นตั้งแต่แรก?\" การพบว่าเซิร์ฟเวอร์ไม่ได้อัปเดตแพตช์ (อาการ) อาจมี Root Cause มาจากการขาดขั้นตอน Patch Verification Policy ระดับองค์กร\n\n---"}, {"id": "ch6_q11", "chapter_id": "ch6", "chapter_title": "บทที่ 6: Security Testing (NIST SP 800-115)", "reference": "NIST SP 800-115", "q_num": 11, "question": "เมื่อทีมทดสอบค้นพบช่องโหว่ร้ายแรงระดับ **Critical Vulnerability** ที่ส่งผลให้ระบบงานหลักหยุดชะงัก หรือข้อมูลรั่วไหลได้ทันทีในระหว่างขั้นตอน Execution ทีมงานควรปฏิบัติตามแนวทางใดตาม NIST SP 800-115?", "choices": {"A": "เก็บเป็นความลับไว้จนกว่าจะส่งรายงานฉบับสมบูรณ์ในอีก 1 เดือนข้างหน้า", "B": "แจ้งเตือนผู้ประสานงานหลัก (Point of Contact) หรือทีม Incident Response ขององค์กรทันที (Emergency Escalation) เพื่อดำเนินการบรรเทาความเสียหายฉุกเฉิน", "C": "โพสต์ช่องโหว่ลงสื่อสังคมออนไลน์", "D": "ทำการเจาะต่อเพื่อขโมยข้อมูลให้ได้มากที่สุด"}, "answer": "B", "explanation": "ตามมาตรฐานสากล หากพบช่องโหว่ระดับ Critical/Zero-day หรือพบร่องรอยว่าระบบกำลังถูกแฮกเกอร์จริงฝังตัวอยู่ ทีมทดสอบต้องหยุดและแจ้งผู้มีอำนาจขององค์กรทันทีตามช่องทางฉุกเฉินที่กำหนดใน ROE\n\n---"}, {"id": "ch6_q12", "chapter_id": "ch6", "chapter_title": "บทที่ 6: Security Testing (NIST SP 800-115)", "reference": "NIST SP 800-115", "q_num": 12, "question": "ในขั้นตอน **Post-Testing Activities** กิจกรรมใดที่ต้องกระทำเพื่อความปลอดภัยของข้อมูลลูกค้าตามข้อกำหนดด้านการจัดการข้อมูลทางเทคนิค (Technical Data Handling)?", "choices": {"A": "สำเนาข้อมูลรหัสผ่านที่ดักจับได้เก็บไว้ในแฟลชไดรฟ์ส่วนตัว", "B": "การทำลายหรือล้างข้อมูลความลับและหลักฐานทางเทคนิค (Data Sanitization & Destruction) ที่รวบรวมมาระหว่างการทดสอบอย่างปลอดภัย หลังเสร็จสิ้นการส่งมอบงาน", "C": "แจกจ่ายไฟล์ดาต้าเบสให้พนักงานคนอื่นศึกษา", "D": "อัปโหลดข้อมูลขึ้นเว็บบอร์ดสาธารณะ"}, "answer": "B", "explanation": "ข้อมูลที่ได้จากการทดสอบ (เช่น hashes, dumps, รายชื่อพนักงาน) เป็นข้อมูลละเอียดอ่อนสูง เมื่อสรุปผลและส่งมอบงานเรียบร้อย ทีมทดสอบต้องทำลายข้อมูลออกจากอุปกรณ์ทดสอบตามมาตรฐาน Data Destruction\n\n---"}, {"id": "ch6_q13", "chapter_id": "ch6", "chapter_title": "บทที่ 6: Security Testing (NIST SP 800-115)", "reference": "NIST SP 800-115", "q_num": 13, "question": "การจัดลำดับความสำคัญของระบบที่จะนำมาทดสอบ (Prioritizing and Scheduling Assessments) ควรพิจารณาจากปัจจัยหลักในข้อใด?", "choices": {"A": "ยี่ห้อของเซิร์ฟเวอร์", "B": "ระดับความสำคัญของระบบงานต่อธุรกิจ (Criticality), ระดับความอ่อนไหวของข้อมูล และเวลาที่ระบบมีผลกระทบต่อผู้ใช้งานน้อยที่สุด (Non-peak hours / Maintenance window)", "C": "ราคาของเครื่องคอมพิวเตอร์", "D": "ขนาดของจอภาพเซิร์ฟเวอร์"}, "answer": "B", "explanation": "การจัดตารางทดสอบต้องคำนึงถึงความเสี่ยงต่อระบบงานหลัก โดยมักนัดทดสอบระบบสำคัญในช่วง Off-peak hours เพื่อลดความเสี่ยงที่การทดสอบจะกระทบต่อการให้บริการลูกค้าทั่วไป\n\n---"}, {"id": "ch6_q14", "chapter_id": "ch6", "chapter_title": "บทที่ 6: Security Testing (NIST SP 800-115)", "reference": "NIST SP 800-115", "q_num": 14, "question": "ข้อใดเป็นตัวอย่างของกิจกรรมในกลุ่ม **Vulnerability Scanning**?", "choices": {"A": "การโทรศัพท์ไปหลอกขอรหัสผ่านจากพนักงานคอลเซ็นเตอร์", "B": "การใช้เครื่องมือสแกนเนอร์ เช่น Nessus หรือ OpenVAS ตรวจสอบพอร์ตและเวอร์ชันของซอฟต์แวร์เทียบกับฐานข้อมูล CVE (Common Vulnerabilities and Exposures) เพื่อค้นหาจุดบกพร่องที่ยังไม่ได้อัปเดต", "C": "การปีนหน้าต่างเข้าไปในห้องเซิร์ฟเวอร์", "D": "การถอดรหัสลับแฮช MD5 ด้วย Hashcat"}, "answer": "B", "explanation": "Vulnerability Scanner ทำหน้าที่ส่งโพรบเพื่อเทียบเคียงเวอร์ชันของเซอร์วิสและตอบสนองกับฐานข้อมูล Signature ช่องโหว่ (CVE Database)\n\n---"}, {"id": "ch6_q15", "chapter_id": "ch6", "chapter_title": "บทที่ 6: Security Testing (NIST SP 800-115)", "reference": "NIST SP 800-115", "q_num": 15, "question": "รายงานผลการทดสอบความมั่นคงปลอดภัย (Security Assessment Report) ตามมาตรฐาน NIST แบ่งกลุ่มผู้อ่านหลักออกเป็น 2 กลุ่ม ซึ่งต้องจัดเตรียมเนื้อหาให้เหมาะสม ได้แก่กลุ่มใด?", "choices": {"A": "กลุ่มเด็ก และกลุ่มผู้ใหญ่", "B": "ผู้บริหารระดับสูง (Executive Summary) และฝ่ายเทคนิค/ผู้ดูแลระบบ (Technical Findings & Mitigation Details)", "C": "ลูกค้าทั่วไป และเจ้าหน้าที่ตำรวจ", "D": "แผนกการตลาด และแผนกจัดซื้อ"}, "answer": "B", "explanation": "รายงานการประเมินต้องมีส่วน Executive Summary (ภาพรวมความเสี่ยงเชิงธุรกิจ งบประมาณ ผลกระทบ สำหรับผู้บริหาร) และ Technical Section (รายละเอียดขั้นตอน PoC ช่องโหว่และวิธีแก้ไขทางเทคนิค สำหรับ System/Network Admin)\n\n---"}, {"id": "ch6_q16", "chapter_id": "ch6", "chapter_title": "บทที่ 6: Security Testing (NIST SP 800-115)", "reference": "NIST SP 800-115", "q_num": 16, "question": "การทำ **Ruleset Review** ตามคำแนะนำของ NIST SP 800-115 ช่วยป้องกันข้อผิดพลาดประเภทใดในอุปกรณ์ Firewall หรือ Router?", "choices": {"A": "อุปกรณ์ไฟร์วอลล์ไฟดับ", "B": "กฎที่ซ้ำซ้อน (Redundant Rules), กฎที่ขัดแย้งกัน (Conflicting Rules), กฎที่เปิดกว้างเกินไป (Overly Permissive Rules) เช่น `permit any any` และกฎเก่าที่เลิกใช้งานแล้ว", "C": "การเสื่อมสภาพของสายแลน", "D": "ความร้อนสะสมในตู้ Rack"}, "answer": "B", "explanation": "Ruleset Review มุ่งตรวจทานโครงสร้างกฎในอุปกรณ์เน็ตเวิร์ก เพื่อค้นหากฎที่ขัดแย้งกัน ลำดับกฎที่วางผิดพลาด กฎที่ไม่มีคนใช้ หรือกฎ Any-Any ที่ผู้ดูแลระบบแอบเปิดทิ้งไว้ชั่วคราวแล้วลืมปิด\n\n---"}, {"id": "ch6_q17", "chapter_id": "ch6", "chapter_title": "บทที่ 6: Security Testing (NIST SP 800-115)", "reference": "NIST SP 800-115", "q_num": 17, "question": "ความแตกต่างระหว่าง **Vulnerability Assessment (VA)** และ **Penetration Testing (Pentest)** คือข้อใด?", "choices": {"A": "VA มีราคาแพงกว่า Pentest เสมอ", "B": "VA มุ่งเน้นการตรวจหาและระบุรายชื่อช่องโหว่ทั้งหมดที่อาจมีในระบบ (กว้างแต่ไม่ลึก) ในขณะที่ Pentest จะมุ่งเน้นการจำลองเจาะระบบจริงผ่านช่องโหว่นั้น เพื่อพิสูจน์ผลกระทบและการเข้าถึงข้อมูล (เจาะลึกและยืนยันผลได้จริง)", "C": "Pentest ไม่ต้องใช้คอมพิวเตอร์ในการทดสอบ", "D": "VA ต้องใช้แฮกเกอร์สายมืดเท่านั้น"}, "answer": "B", "explanation": "Vulnerability Assessment (VA) เน้นการทำ Inventory รายการช่องโหว่ทั้งหมดโดยไม่เจาะทำลาย ส่วน Penetration Testing (Pentest) จะนำช่องโหว่เหล่านั้นมาสร้าง Exploit เพื่อเจาะทะลุผ่านระบบป้องกันและประเมินความเสียหายจริง\n\n---"}, {"id": "ch6_q18", "chapter_id": "ch6", "chapter_title": "บทที่ 6: Security Testing (NIST SP 800-115)", "reference": "NIST SP 800-115", "q_num": 18, "question": "ในการทำ **Log Review** ข้อมูลใดใน Log ที่เป็นหลักฐานสำคัญที่สุดในการนำมาวิเคราะห์เหตุการณ์ย้อนหลัง (Correlation & Timeline Analysis)?", "choices": {"A": "ความยาวของข้อความในไฟล์", "B": "การบันทึกเวลาที่แม่นยำ (Accurate Timestamp ที่ Sync ตรงกับ NTP Server), Source/Destination IP และ Event ID", "C": "ขนาดความจุของฮาร์ดดิสก์", "D": "ชื่อเครื่องคอมพิวเตอร์ของผู้ประเมิน"}, "answer": "B", "explanation": "Timestamp ที่เที่ยงตรง (ผ่าน Network Time Protocol - NTP) ร่วมกับข้อมูล IP และรายละเอียดกิจกรรม ถือเป็นหัวใจในการทำ Digital Forensics และ Incident Investigation เพื่อนำข้อมูลจากโฮสต์ต่างๆ มาเรียงต่อเป็นลำดับเหตุการณ์จริง (Timeline)"}, {"id": "ch7_q1", "chapter_id": "ch7", "chapter_title": "บทที่ 7: VPN & Lab 7 (tcpdump & IPsec)", "reference": "NIST SP 800-77/113 & Lab 7", "q_num": 1, "question": "ตามมาตรฐาน **NIST SP 800-77** โพรโทคอล **IPsec (IP Security)** จัดเป็นกลไกควบคุมความมั่นคงปลอดภัยที่ทำงานในระดับเลเยอร์ใดของแบบจำลอง OSI Model?", "choices": {"A": "Data Link Layer (Layer 2)", "B": "Network Layer (Layer 3)", "C": "Transport Layer (Layer 4)", "D": "Application Layer (Layer 7)"}, "answer": "B", "explanation": "IPsec ทำงานที่ Network Layer (Layer 3) จึงมีความโปร่งใสต่อแอปพลิเคชัน (Application-independent) สามารถปกป้องทราฟฟิกข้อมูล IP ทั้งหมดที่วิ่งผ่านโดยที่ซอฟต์แวร์ระดับบนไม่ต้องแก้ไขโค้ด\n\n---"}, {"id": "ch7_q2", "chapter_id": "ch7", "chapter_title": "บทที่ 7: VPN & Lab 7 (tcpdump & IPsec)", "reference": "NIST SP 800-77/113 & Lab 7", "q_num": 2, "question": "โพรโทคอลย่อยของ IPsec ในข้อใดที่ทำหน้าที่รักษาความลับของข้อมูลด้วยการเข้ารหัส (Confidentiality) พร้อมทั้งยืนยันความถูกต้องและความสมบูรณ์ของข้อมูล (Data Origin Authentication and Integrity)?", "choices": {"A": "AH (Authentication Header)", "B": "ESP (Encapsulating Security Payload)", "C": "IKE (Internet Key Exchange)", "D": "L2TP (Layer 2 Tunneling Protocol)"}, "answer": "B", "explanation": "- **AH (Protocol 51):** ให้บริการเฉพาะ Integrity และ Authentication แต่ **ไม่เข้ารหัสข้อมูล** (No Confidentiality)\n- **ESP (Protocol 50):** ให้บริการทั้งการเข้ารหัสข้อมูล (Encryption/Confidentiality) และการตรวจสอบความถูกต้องของข้อมูล (Authentication/Integrity)\n\n---"}, {"id": "ch7_q3", "chapter_id": "ch7", "chapter_title": "บทที่ 7: VPN & Lab 7 (tcpdump & IPsec)", "reference": "NIST SP 800-77/113 & Lab 7", "q_num": 3, "question": "โหมดการทำงานของ IPsec ระหว่าง **Transport Mode** และ **Tunnel Mode** มีความแตกต่างกันอย่างไร?", "choices": {"A": "Transport Mode เข้ารหัสเฉพาะสายแลน ส่วน Tunnel Mode เข้ารหัส Wi-Fi", "B": "Transport Mode เข้ารหัสเฉพาะ Payload ของแพ็กเก็ต IP ดั้งเดิมโดยคงส่วนหัว (Original IP Header) ไว้ มักใช้แบบ Host-to-Host ส่วน Tunnel Mode จะเข้ารหัสแพ็กเก็ต IP ดั้งเดิมทั้งก้อนแล้วสร้าง IP Header ตัวใหม่ครอบทับ มักใช้เชื่อมต่อแบบ Site-to-Site (Gateway-to-Gateway)", "C": "Tunnel Mode ทำงานเร็วกว่า Transport Mode 10 เท่าเสมอ", "D": "Transport Mode ใช้ได้เฉพาะบนเครื่อง Mac เท่านั้น"}, "answer": "B", "explanation": "ใน Tunnel Mode แพ็กเก็ตข้อมูลเดิมทั้งหมดรวมถึง IP address จริงจะถูกเข้ารหัสและซ่อนไว้ภายในเพย์โหลดใหม่ โดยมี Outer IP Header ใหม่เป็น IP ของ Gateway ทั้งสองฝั่ง จึงเหมาะกับการเชื่อมต่อเครือข่ายข้ามอินเทอร์เน็ต\n\n---"}, {"id": "ch7_q4", "chapter_id": "ch7", "chapter_title": "บทที่ 7: VPN & Lab 7 (tcpdump & IPsec)", "reference": "NIST SP 800-77/113 & Lab 7", "q_num": 4, "question": "โพรโทคอล **Internet Key Exchange (IKE)** ทำงานบนโพรโทคอลขนส่งและหมายเลขพอร์ตใดในการเจรจาคีย์ระหว่างอุปกรณ์ IPsec Gateway?", "choices": {"A": "TCP พอร์ต 80", "B": "UDP พอร์ต 500 (และ UDP 4500 สำหรับ NAT-Traversal)", "C": "TCP พอร์ต 443", "D": "ICMP พอร์ต 8"}, "answer": "B", "explanation": "IKE ใช้โพรโทคอล UDP พอร์ต 500 สำหรับขั้นตอนการเจรจาคีย์ และใช้พอร์ต UDP 4500 เมื่อมีการทำงานร่วมกับ NAT-Traversal (NAT-T)\n\n---"}, {"id": "ch7_q5", "chapter_id": "ch7", "chapter_title": "บทที่ 7: VPN & Lab 7 (tcpdump & IPsec)", "reference": "NIST SP 800-77/113 & Lab 7", "q_num": 5, "question": "ขั้นตอนการเจรจาของ IKE แบ่งออกเป็น 2 เฟสหลัก ข้อใดอธิบายวัตถุประสงค์ของ **IKE Phase 1** และ **IKE Phase 2** ได้ถูกต้อง?", "choices": {"A": "Phase 1 เข้ารหัสอีเมล, Phase 2 เข้ารหัสรหัสผ่าน", "B": "Phase 1 สร้างช่องทางสื่อสารที่ปลอดภัยและพิสูจน์ตัวตนระหว่างเกตเวย์ (ISAKMP SA) ส่วน Phase 2 ใช้ช่องทางนั้นในการเจรจาพารามิเตอร์และสร้างคีย์สำหรับเข้ารหัสข้อมูลผู้ใช้งานจริง (IPsec SAs)", "C": "Phase 1 สแกนหาพอร์ต, Phase 2 ส่งไวรัส", "D": "Phase 1 ทดสอบความเร็วเน็ต, Phase 2 บล็อกแพ็กเก็ต"}, "answer": "B", "explanation": "- **Phase 1:** สร้างความไว้วางใจระหว่าง Peers (Authentication & IKE SA)\n- **Phase 2:** สถาปนาท่อส่งข้อมูลจริง (IPsec Security Associations - SAs)\n\n---"}, {"id": "ch7_q6", "chapter_id": "ch7", "chapter_title": "บทที่ 7: VPN & Lab 7 (tcpdump & IPsec)", "reference": "NIST SP 800-77/113 & Lab 7", "q_num": 6, "question": "สถาปัตยกรรม **SSL VPN** ตามเอกสาร NIST SP 800-113 แบ่งรูปแบบหลักออกเป็น 2 โมเดล โมเดลใดที่อนุญาตให้ผู้ใช้รีโมตล็อกอินผ่านเว็บเบราว์เซอร์มาตรฐาน (Clientless) เพื่อเข้าถึงเว็บแอปพลิเคชันภายในได้ทันทีโดยไม่ต้องติดตั้งโปรแกรมเพิ่มเติม?", "choices": {"A": "SSL Tunnel VPN", "B": "SSL Portal VPN", "C": "IPsec Mesh VPN", "D": "PPTP Tunnel"}, "answer": "B", "explanation": "- **SSL Portal VPN:** ผู้ใช้เปิดเบราว์เซอร์เข้าสู่หน้าเว็บพอร์ทัลเพื่อใช้งานเซอร์วิสได้โดยไม่ต้องลงซอฟต์แวร์ Client (Clientless)\n- **SSL Tunnel VPN:** ต้องติดตั้งไคลเอนต์ซอฟต์แวร์หรือเบราว์เซอร์เอเจนต์ เพื่อสร้างการเชื่อมต่อเครือข่ายระดับเน็ตเวิร์กเต็มรูปแบบ\n\n---"}, {"id": "ch7_q7", "chapter_id": "ch7", "chapter_title": "บทที่ 7: VPN & Lab 7 (tcpdump & IPsec)", "reference": "NIST SP 800-77/113 & Lab 7", "q_num": 7, "question": "ในการจัดการความพร้อมใช้งานสูง (High Availability - HA) ของเกตเวย์ SSL VPN ตามสไลด์การบรรยาย วิธีการที่นิยมใช้แชร์ที่อยู่ไอพีร่วมกันระหว่างอุปกรณ์ 2 ตัวเพื่อให้สามารถสลับการทำงานอัตโนมัติ (Failover) คืออะไร?", "choices": {"A": "Dynamic DNS", "B": "Virtual IP Address (แชร์ระหว่าง Active/Passive หรือ Active/Active)", "C": "การถอดปลั๊กอุปกรณ์ตัวที่สอง", "D": "การเปลี่ยนสายเคเบิลแบบแมนนวล"}, "answer": "B", "explanation": "HA มักใช้กลไก Virtual IP (VIP) แชร์ร่วมกันระหว่างอุปกรณ์หลักและอุปกรณ์สำรอง เพื่อให้ไคลเอนต์สามารถเชื่อมต่อไปยัง IP เดิมได้อย่างต่อเนื่องแม้เครื่องหลักจะเกิดความล้มเหลว\n\n---"}, {"id": "ch7_q8", "chapter_id": "ch7", "chapter_title": "บทที่ 7: VPN & Lab 7 (tcpdump & IPsec)", "reference": "NIST SP 800-77/113 & Lab 7", "q_num": 8, "question": "ในโจทย์ Lab 7-A (Insecure Connection) เมื่อผู้ใช้เข้าถึงบริการ Web หรือ Telnet โดยไม่ผ่าน VPN ทำไมผู้โจมตี (Attacker PC) ที่อยู่กึ่งกลางจึงสามารถดักจับข้อมูลชื่อผู้ใช้และรหัสผ่านได้ทั้งหมด?", "choices": {"A": "เพราะผู้ใช้ตั้งรหัสผ่านสั้นเกินไป", "B": "เพราะโปรโตคอล Telnet และ HTTP ดั้งเดิมส่งข้อมูลในลักษณะข้อความธรรมดา (Plaintext) ที่ไม่มีการเข้ารหัส ทำให้แพ็กเก็ตที่ถูกดักฟังสามารถเปิดอ่านได้ทันที", "C": "เพราะสวิตช์ในแล็บเสียหาย", "D": "เพราะเซิร์ฟเวอร์ไม่ได้เปิดใช้งาน DNS"}, "answer": "B", "explanation": "Telnet และ HTTP (พอร์ต 80) ไม่มีการเข้ารหัสในเลเยอร์ใดๆ ข้อมูลทุกไบต์รวมทั้ง Password จึงไหลผ่านเน็ตเวิร์กเป็นตัวอักษรธรรมดาที่ใครดักจับได้ก็มองเห็นได้ชัดเจน\n\n---"}, {"id": "ch7_q9", "chapter_id": "ch7", "chapter_title": "บทที่ 7: VPN & Lab 7 (tcpdump & IPsec)", "reference": "NIST SP 800-77/113 & Lab 7", "q_num": 9, "question": "ใน Lab 7-B มีการใช้คำสั่ง **tcpdump** บนเครื่อง Attacker ดังนี้:\n```bash\ntcpdump -n -A -i eth1\n```\nพารามิเตอร์ `-n` และ `-A` มีหน้าที่การทำงานอย่างไรตามลำดับ?", "choices": {"A": "`-n` ไม่แปลงหมายเลข IP/Port เป็นชื่อโฮสต์ (ปิดการทำ Reverse DNS เพื่อความรวดเร็ว) และ `-A` ให้แสดงผลลัพธ์ข้อมูลเพย์โหลดของแพ็กเก็ตเป็นตัวอักษร ASCII", "B": "`-n` รันในโหมดกลางคืน และ `-A` แสดงเฉพาะแพ็กเก็ต ARP", "C": "`-n` ส่งเสียงแจ้งเตือน และ `-A` ย่อขนาดหน้าจอ", "D": "`-n` ทำลายไฟล์ และ `-A` เพิ่มสิทธิ์ Root"}, "answer": "A", "explanation": "- `-n`: ห้ามแปลงที่อยู่ IP เป็นชื่อ Domain Name ช่วยให้ tcpdump ทำงานได้เร็วและไม่ส่งทราฟฟิก DNS เพิ่มขึ้นในเครือข่าย\n- `-A`: แสดงเนื้อหา Packet Payload ในรูปแบบข้อความ ASCII ทำให้มองเห็นข้อความที่ไม่ได้เข้ารหัส เช่น รหัสผ่าน Telnet หรือข้อความแชตได้โดยตรง\n\n---"}, {"id": "ch7_q10", "chapter_id": "ch7", "chapter_title": "บทที่ 7: VPN & Lab 7 (tcpdump & IPsec)", "reference": "NIST SP 800-77/113 & Lab 7", "q_num": 10, "question": "จากคำสั่งใน Lab 7-B ข้อ 2.1:\n```bash\ntcpdump -n -A -i eth1 1>Lab07B.txt 2>Lab07B-err.txt\n```\nสัญลักษณ์ `1>` และ `2>` ในระบบเชลล์ของ Linux มีความหมายอย่างไร?", "choices": {"A": "`1>` คือการรันโปรเซสที่ 1 และ `2>` คือการรันโปรเซสที่ 2", "B": "`1>` เปลี่ยนทิศทาง Standard Output (stdout / ข้อความผลลัพธ์ปกติ) ไปบันทึกลงไฟล์ `Lab07B.txt` และ `2>` เปลี่ยนทิศทาง Standard Error (stderr / ข้อความเตือนข้อผิดพลาด) ไปบันทึกลงไฟล์ `Lab07B-err.txt`", "C": "เปรียบเทียบว่าไฟล์ 1 ใหญ่กว่าไฟล์ 2", "D": "สั่งลบไฟล์ที่ 1 และ 2 ทิ้ง"}, "answer": "B", "explanation": "ใน Linux I/O Redirection:\n- File Descriptor 1 = `stdout` (ส่งข้อมูลเอาต์พุตปกติลงไฟล์)\n- File Descriptor 2 = `stderr` (ส่งข้อความแจ้งเตือนความผิดพลาดลงไฟล์แยกต่างหาก)\n\n---"}, {"id": "ch7_q11", "chapter_id": "ch7", "chapter_title": "บทที่ 7: VPN & Lab 7 (tcpdump & IPsec)", "reference": "NIST SP 800-77/113 & Lab 7", "q_num": 11, "question": "หากต้องการบันทึกข้อมูลแพ็กเก็ตดิบจากการดักฟังด้วย **tcpdump** ลงเป็นไฟล์รูปแบบ `.pcap` เพื่อนำไปเปิดวิเคราะห์ต่อในโปรแกรม **Wireshark** ต้องใช้คำสั่งใดตรงตามใบงาน Lab 7-B?", "choices": {"A": "`tcpdump -n -A -i eth1 -w Lab07B.pcap`", "B": "`tcpdump --export-wireshark Lab07B.pcap`", "C": "`tcpdump -s Lab07B.pcap eth1`", "D": "`tcpdump -o Lab07B.pcap`"}, "answer": "A", "explanation": "ออปชัน `-w <filename>` สั่งให้ tcpdump เขียนข้อมูลแพ็กเก็ตดิบในฟอร์แมต pcap ลงดิสก์โดยตรงแทนการพิมพ์ออกหน้าจอ ทำให้สามารถนำไฟล์ไปเปิดดูด้วย Wireshark ได้อย่างสมบูรณ์\n\n---"}, {"id": "ch7_q12", "chapter_id": "ch7", "chapter_title": "บทที่ 7: VPN & Lab 7 (tcpdump & IPsec)", "reference": "NIST SP 800-77/113 & Lab 7", "q_num": 12, "question": "เมื่อมีการเปิดใช้งาน **IPsec VPN (Lab 7-B)** ระหว่าง Firewall-A และ Firewall-B เมื่อ Attacker ดักฟังแพ็กเก็ตข้อมูลด้วย tcpdump ผลลัพธ์ที่ Attacker มองเห็นจะเปลี่ยนแปลงไปอย่างไรเมื่อเทียบกับตอนที่ยังไม่เปิด VPN?", "choices": {"A": "Attacker จะไม่เห็นแพ็กเก็ตใดๆ วิ่งผ่านสายแลนเลย", "B": "Attacker จะมองเห็นเฉพาะแพ็กเก็ตของโพรโทคอล ESP (Protocol 50) หรือ UDP 500/4500 โดยข้อมูล Payload ข้างในจะถูกเข้ารหัสกลายเป็นตัวอักษรขยะ (Ciphertext) ไม่สามารถอ่านข้อความหรือดักจับรหัสผ่านได้อีกต่อไป", "C": "เซิร์ฟเวอร์จะตัดการเชื่อมต่อของ Attacker ทันที", "D": "หน้าจอของเครื่อง Attacker จะดับลง"}, "answer": "B", "explanation": "ทราฟฟิกข้อมูลจะถูกห่อหุ้มและเข้ารหัสด้วย ESP (IP Protocol 50) ทำให้ผู้ดักฟังเห็นเพียงแพ็กเก็ตที่ส่งระหว่าง Gateway สองฝั่งและมีเพย์โหลดที่เข้ารหัส ปลอดภัยจากการดักแอบดูข้อมูล (Eavesdropping)\n\n---"}, {"id": "ch7_q13", "chapter_id": "ch7", "chapter_title": "บทที่ 7: VPN & Lab 7 (tcpdump & IPsec)", "reference": "NIST SP 800-77/113 & Lab 7", "q_num": 13, "question": "หากต้องการกรองคำสั่ง **tcpdump** ให้จับเฉพาะแพ็กเก็ตที่วิ่งไปยังโฮสต์ปลายทางหมายเลข IP `192.168.1.50` และเป็นพอร์ต `80` เท่านั้น ไวยากรณ์ BPF (Berkeley Packet Filter) ที่ถูกต้องคือข้อใด?", "choices": {"A": "`tcpdump -i eth0 host 192.168.1.50 and port 80`", "B": "`tcpdump -i eth0 --filter 192.168.1.50:80`", "C": "`tcpdump target=192.168.1.50 port=80`", "D": "`tcpdump -i eth0 -dest 192.168.1.50 -p 80`"}, "answer": "A", "explanation": "ไวยากรณ์ตัวกรองของ tcpdump ใช้ BPF syntax เช่น `host <ip> and port <port>` ซึ่งเรียบง่ายและเป็นมาตรฐานเดียวกับตัวกรองของ Wireshark\n\n---"}, {"id": "ch7_q14", "chapter_id": "ch7", "chapter_title": "บทที่ 7: VPN & Lab 7 (tcpdump & IPsec)", "reference": "NIST SP 800-77/113 & Lab 7", "q_num": 14, "question": "ในซอฟต์แวร์ **OpenVPN** ไดรเวอร์การ์ดเน็ตเวิร์กเสมือนแบบ **tun** และแบบ **tap** มีความแตกต่างกันในระดับเลเยอร์เครือข่ายอย่างไร?", "choices": {"A": "`tun` ทำงานที่เลเยอร์ 7 ส่วน `tap` ทำงานที่เลเยอร์ 1", "B": "`tun` ทำงานที่ระดับ Network Layer (Layer 3 IP Tunnel / Point-to-Point) เหมาะกับงาน VPN ทั่วไป ส่วน `tap` ทำงานที่ระดับ Data Link Layer (Layer 2 Ethernet Bridging) สามารถส่งแพ็กเก็ตบรอดคาสต์และเฟรมอีเธอร์เน็ตข้ามหากันได้", "C": "`tun` ใช้กับสายไฟเบอร์ ส่วน `tap` ใช้กับสายทองแดง", "D": "ทั้งสองตัวทำงานเหมือนกันทุกประการ"}, "answer": "B", "explanation": "- `dev tun`: ทำงานที่ Layer 3 (IP-only) ประหยัดแบนด์วิดท์และใช้ใน VPN ส่วนใหญ่\n- `dev tap`: ทำงานที่ Layer 2 (Virtual Ethernet Adapter) รองรับ Broadcast/Multicast และ Non-IP protocols\n\n---"}, {"id": "ch7_q15", "chapter_id": "ch7", "chapter_title": "บทที่ 7: VPN & Lab 7 (tcpdump & IPsec)", "reference": "NIST SP 800-77/113 & Lab 7", "q_num": 15, "question": "ไฟล์คอนฟิกูเรชันหลักของ OpenVPN Server บนระบบปฏิบัติการ Linux และไฟล์คอนฟิกูเรชันสำหรับส่งให้เครื่องไคลเอนต์นำไปเชื่อมต่อ มักมีชื่อไฟล์และนามสกุลใดตามลำดับ?", "choices": {"A": "`/etc/openvpn/server.conf` และไฟล์นามสกุล `.ovpn` (เช่น `client.ovpn`)", "B": "`/var/openvpn/main.cfg` และไฟล์ `.txt`", "C": "`/etc/vpn.ini` และไฟล์ `.exe`", "D": "`/usr/local/vpn.sh` และไฟล์ `.zip`"}, "answer": "A", "explanation": "ตามมาตรฐาน OpenVPN:\n- Server Configuration File: `/etc/openvpn/server.conf` (หรือ `/etc/openvpn/server/*.conf`)\n- Client Configuration File: ไฟล์ที่มีนามสกุล `.ovpn` ซึ่งรวบรวมคำสั่งคอนฟิกและใบรับรองดิจิทัลไว้ภายใน\n\n---"}, {"id": "ch7_q16", "chapter_id": "ch7", "chapter_title": "บทที่ 7: VPN & Lab 7 (tcpdump & IPsec)", "reference": "NIST SP 800-77/113 & Lab 7", "q_num": 16, "question": "ไดเรกทอรีมาตรฐานที่ระบบ OpenVPN บน Linux ใช้ในการจัดเก็บใบรับรองดิจิทัล (Digital Certificates) และกุญแจลับ (Private Keys) คือพาธใด?", "choices": {"A": "`/etc/openvpn/` (หรือ `/etc/openvpn/server/` และ `/etc/openvpn/easy-rsa/pki/`)", "B": "`/tmp/keys/`", "C": "`/home/user/certs/`", "D": "`/var/log/openvpn/`"}, "answer": "A", "explanation": "ไฟล์ใบรับรองและคีย์ เช่น `ca.crt`, `server.crt`, `server.key`, และ `dh.pem` (Diffie-Hellman parameters) จะถูกเก็บรักษาไว้ภายใต้ไดเรกทอรีความปลอดภัยสูง `/etc/openvpn/`\n\n---"}, {"id": "ch7_q17", "chapter_id": "ch7", "chapter_title": "บทที่ 7: VPN & Lab 7 (tcpdump & IPsec)", "reference": "NIST SP 800-77/113 & Lab 7", "q_num": 17, "question": "ในคำสั่ง CLI ของ **FortiGate (FortiOS)** หมวดคำสั่งใดที่ใช้ในการคอนฟิกูเรชันพารามิเตอร์การเจรจา Phase 1 และ Phase 2 ของการสร้าง IPsec VPN ตามลำดับ?", "choices": {"A": "`config router ospf` และ `config router bgp`", "B": "`config vpn ipsec phase1-interface` และ `config vpn ipsec phase2-interface`", "C": "`config firewall ipsec-1` และ `config firewall ipsec-2`", "D": "`set ipsec-stage1` และ `set ipsec-stage2`"}, "answer": "B", "explanation": "โครงสร้างเมนู CLI ของ FortiGate สำหรับสร้าง IPsec Tunnel:\n- Phase 1: `config vpn ipsec phase1-interface`\n- Phase 2: `config vpn ipsec phase2-interface`\n\n---"}, {"id": "ch7_q18", "chapter_id": "ch7", "chapter_title": "บทที่ 7: VPN & Lab 7 (tcpdump & IPsec)", "reference": "NIST SP 800-77/113 & Lab 7", "q_num": 18, "question": "จากข้อคิดเห็นในสไลด์ Week 14 หัวข้อ Design the Architecture มีข้อความระบุว่า: *\"Routing policy is as important as firewall configuration\"* เพราะเหตุใดการจัดการตาราง Routing จึงมีความสำคัญเทียบเท่ากับการคอนฟิกไฟร์วอลล์ในการทำ VPN?", "choices": {"A": "เพราะหากไม่มีเราต์เตอร์ ไฟร์วอลล์จะเปิดเครื่องไม่ติด", "B": "เพราะแม้ไฟร์วอลล์จะอนุญาตให้แพ็กเก็ตผ่าน แต่ถ้าไม่มีเส้นทาง (Route) ชี้ให้ทราฟฟิกไหลเข้าสู่อินเทอร์เฟซทันเนล (Tunnel Interface) หรือเครือข่ายภายในไม่รู้จักเส้นทางขากลับ แพ็กเก็ตก็จะไม่สามารถส่งผ่านเครือข่าย VPN ได้", "C": "เพราะตาราง Routing เป็นตัวสร้างคีย์เข้ารหัส", "D": "เพราะ Routing ช่วยประหยัดค่าไฟฟ้า"}, "answer": "B", "explanation": "การเซตอัป VPN ไม่ใช่แค่สร้างทันเนลแล้วเสร็จ แต่ระบบต้องการ Static Route หรือ Dynamic Routing เพื่อชี้ทางให้แพ็กเก็ตที่จะไปยังวงปลายทางถูกส่งเข้าสู่ Virtual Tunnel Interface เสมอ\n\n---"}, {"id": "ch7_q19", "chapter_id": "ch7", "chapter_title": "บทที่ 7: VPN & Lab 7 (tcpdump & IPsec)", "reference": "NIST SP 800-77/113 & Lab 7", "q_num": 19, "question": "ในโพรโทคอล IKE การเจรจา Phase 1 มีโหมดการทำงาน 2 โหมด คือ **Main Mode** และ **Aggressive Mode** ข้อใดคือความแตกต่างสำคัญระหว่าง 2 โหมดนี้?", "choices": {"A": "Main Mode ส่ง 2 แพ็กเก็ต ส่วน Aggressive Mode ส่ง 10 แพ็กเก็ต", "B": "Main Mode มีการแลกเปลี่ยนข้อความ 6 แพ็กเก็ต และสามารถปกป้องตัวตน (Identity Protection) ของคู่สนทนาได้ ในขณะที่ Aggressive Mode แลกเปลี่ยนเพียง 3 แพ็กเก็ตเพื่อความรวดเร็วแต่ส่งข้อมูลระบุตัวตนในลักษณะที่ไม่ได้รับการปกป้อง", "C": "Aggressive Mode ไม่ใช้คีย์ในการเข้ารหัส", "D": "Main Mode ใช้กับระบบโทรศัพท์เท่านั้น"}, "answer": "B", "explanation": "Main Mode ปลอดภัยสูงกว่าเพราะแบ่งเป็น 3 คู่ (6 แพ็กเก็ต) โดย 2 แพ็กเก็ตสุดท้ายที่ระบุ ID ของเกตเวย์จะถูกเข้ารหัส ส่วน Aggressive Mode รวบเหลือ 3 แพ็กเก็ตเพื่อความเร็ว แต่แลกด้วยการไม่ปกป้อง Identity ของจุดเชื่อมต่อ\n\n---"}, {"id": "ch7_q20", "chapter_id": "ch7", "chapter_title": "บทที่ 7: VPN & Lab 7 (tcpdump & IPsec)", "reference": "NIST SP 800-77/113 & Lab 7", "q_num": 20, "question": "ข้อใดเป็นเหตุผลสำคัญที่ทำให้องค์กรยุคใหม่นิยมเปลี่ยนจากการใช้ **Leased Line (วงจรสื่อสารเช่าเฉพาะ)** ระหว่างสาขา มาเป็น **IPsec VPN ผ่านโครงข่ายอินเทอร์เน็ตสาธารณะ**?", "choices": {"A": "IPsec VPN มีค่าใช้จ่าย (Cost) ที่ต่ำกว่ามาก และมีความยืดหยุ่นในการขยายจุดเชื่อมต่อ (Scalability) สูงกว่าการลากสายวงจรเช่าทางกายภาพ", "B": "Leased Line ไม่สามารถส่งข้อมูลดิจิทัลได้", "C": "IPsec VPN ไม่จำเป็นต้องเชื่อมต่ออินเทอร์เน็ต", "D": "เพื่อให้พนักงานสามารถเล่นเกมออนไลน์ได้เร็วขึ้น"}, "answer": "A", "explanation": "ตามสไลด์ Week 14 เปรียบเทียบตัวเลือกโซลูชัน วงจรเช่าเฉพาะ (Leased Line) มีราคาสูงมากและเชื่อมได้เฉพาะจุดคงที่ ในขณะที่ IPsec VPN ทำงานบนเครือข่ายอินเทอร์เน็ตทั่วไปที่มีอยู่แล้ว จึงช่วยประหยัดงบประมาณและเพิ่มสาขาได้ง่ายดาย"}, {"id": "ch8_q1", "chapter_id": "ch8", "chapter_title": "บทที่ 8: Cloud Security & IAM Policies", "reference": "NIST SP 800-145/63 & ISO", "q_num": 1, "question": "ตามเอกสาร **NIST SP 800-145 (The NIST Definition of Cloud Computing)** คุณลักษณะสำคัญ 5 ประการ (5 Essential Characteristics) ของคลาวด์คอมพิวติงประกอบด้วยข้อใดบ้าง?", "choices": {"A": "Speed, Memory, Storage, Backup, Antivirus", "B": "On-demand self-service, Broad network access, Resource pooling, Rapid elasticity, และ Measured service", "C": "SaaS, PaaS, IaaS, Public, Private", "D": "Virtualization, Container, Kubernetes, Docker, Linux"}, "answer": "B", "explanation": "NIST SP 800-145 กำหนด 5 คุณลักษณะจำเป็นของ Cloud Computing ไว้ดังนี้:\n1. On-demand self-service (ให้บริการตนเองตามความต้องการ)\n2. Broad network access (เข้าถึงได้ผ่านเครือข่ายกว้างขวาง)\n3. Resource pooling (การใช้ทรัพยากรร่วมกัน)\n4. Rapid elasticity (ความยืดหยุ่นปรับขนาดได้อย่างรวดเร็ว)\n5. Measured service (การคิดค่าบริการตามปริมาณที่ใช้งานจริง)\n\n---"}, {"id": "ch8_q2", "chapter_id": "ch8", "chapter_title": "บทที่ 8: Cloud Security & IAM Policies", "reference": "NIST SP 800-145/63 & ISO", "q_num": 2, "question": "มาตรฐานสากล **ISO/IEC 27017** และ **ISO/IEC 27018** มีขอบเขตการกำกับดูแลด้านความมั่นคงปลอดภัยบนคลาวด์ที่แตกต่างกันอย่างไร?", "choices": {"A": "ISO 27017 สำหรับระบบเครือข่าย ส่วน ISO 27018 สำหรับการเขียนโปรแกรม", "B": "ISO/IEC 27017 มุ่งเน้นการควบคุมความมั่นคงปลอดภัยสารสนเทศสำหรับบริการคลาวด์ (Cloud Security Controls) ในขณะที่ ISO/IEC 27018 มุ่งเน้นการคุ้มครองข้อมูลส่วนบุคคล (Protection of Personally Identifiable Information - PII) บนบริการพับลิกคลาวด์โดยเฉพาะ", "C": "ISO 27017 เป็นมาตรฐานสำหรับฮาร์ดแวร์ ส่วน ISO 27018 เป็นมาตรฐานสำหรับระบบปฏิบัติการ", "D": "ทั้งสองมาตรฐานถูกยกเลิกไปแล้ว"}, "answer": "B", "explanation": "- **ISO/IEC 27017:** เป็นแนวทางปฏิบัติสำหรับ Cloud Service Controls (ต่อยอดจาก ISO 27002) ทั้งฝั่งผู้ให้บริการและผู้ใช้บริการ\n- **ISO/IEC 27018:** เจาะจงด้านความเป็นส่วนตัวและการคุ้มครองข้อมูล PII ใน Public Cloud สอดคล้องกับกฎหมายคุ้มครองข้อมูลส่วนบุคคล\n\n---"}, {"id": "ch8_q3", "chapter_id": "ch8", "chapter_title": "บทที่ 8: Cloud Security & IAM Policies", "reference": "NIST SP 800-145/63 & ISO", "q_num": 3, "question": "กรอบการทำงาน **Cloud Controls Matrix (CCM v4.0)** ขององค์กร Cloud Security Alliance (CSA) ประกอบด้วยเป้าประสงค์การควบคุม (Control Objectives) จำนวนกี่ข้อและครอบคลุมกี่โดเมนความปลอดภัย?", "choices": {"A": "10 หัวข้อ ใน 2 โดเมน", "B": "197 ข้อ ใน 17 โดเมนความปลอดภัย", "C": "50 ข้อ ใน 5 โดเมน", "D": "500 ข้อ ใน 50 โดเมน"}, "answer": "B", "explanation": "สไลด์ระบุชัดเจนว่า CSA Cloud Controls Matrix (CCM) v4.0 ประกอบด้วย 197 Control Objectives ครอบคลุม 17 Cloud Security Domains สอดรับกับมาตรฐาน ISO 27001 และ NIST CSF\n\n---"}, {"id": "ch8_q4", "chapter_id": "ch8", "chapter_title": "บทที่ 8: Cloud Security & IAM Policies", "reference": "NIST SP 800-145/63 & ISO", "q_num": 4, "question": "ตามโมเดลการแบ่งความรับผิดชอบร่วมกัน (**Shared Responsibility Model**) ในรูปแบบบริการ **IaaS (Infrastructure as a Service)** องค์กรผู้ใช้บริการ (Customer) มีหน้าที่รับผิดชอบในส่วนใดต่อไปนี้?", "choices": {"A": "การบำรุงรักษาฮาร์ดแวร์เซิร์ฟเวอร์ในดาต้าเซ็นเตอร์", "B": "ระบบปฏิบัติการ (Guest OS), มิดเดิลแวร์, แอปพลิเคชัน, ข้อมูล และการตั้งค่าไฟร์วอลล์ระดับเครื่อง/ระบบเครือข่ายเสมือน", "C": "ระบบทำความเย็นและระบบไฟฟ้าของดาต้าเซ็นเตอร์", "D": "การอัปเดตเฟิร์มแวร์ของ Physical Router ของผู้ให้บริการ"}, "answer": "B", "explanation": "ใน IaaS ผู้ให้บริการคลาวด์ (CSP) ดูแลเฉพาะโครงสร้างพื้นฐานทางกายภาพ (Physical Hardware, Hypervisor, Facilities) ส่วนลูกค้าต้องดูแลรับผิดชอบตั้งแต่ระดับ OS, Patches, Application, Firewall rules, และ Data ทั้งหมด\n\n---"}, {"id": "ch8_q5", "chapter_id": "ch8", "chapter_title": "บทที่ 8: Cloud Security & IAM Policies", "reference": "NIST SP 800-145/63 & ISO", "q_num": 5, "question": "เครื่องมือด้านความมั่นคงปลอดภัยบนคลาวด์ที่เรียกว่า **CSPM (Cloud Security Posture Management)** ทำหน้าที่หลักในเรื่องใด?", "choices": {"A": "ตรวจจับการคลิกเมาส์ของพนักงาน", "B": "ตรวจสอบและประเมินการตั้งค่าคอนฟิกูเรชันของทรัพยากรบนคลาวด์โดยอัตโนมัติ เพื่อป้องกันปัญหา Misconfiguration (เช่น S3 Bucket เปิดสาธารณะ) และตรวจสอบความสอดคล้องตามมาตรฐาน (Compliance)", "C": "ซ่อมแซมสายสัญญาณอินเทอร์เน็ตที่ขาด", "D": "แปลงภาษาของหน้าเว็บไซต์"}, "answer": "B", "explanation": "CSPM มุ่งเน้นการตรวจสอบการตั้งค่าความปลอดภัยบนคลาวด์ (Cloud Configuration) เพื่อค้นหาข้อผิดพลาด ความเสี่ยง หรือการตั้งค่าที่ละเมิด Compliance Frameworks อย่างต่อเนื่อง\n\n---"}, {"id": "ch8_q6", "chapter_id": "ch8", "chapter_title": "บทที่ 8: Cloud Security & IAM Policies", "reference": "NIST SP 800-145/63 & ISO", "q_num": 6, "question": "เครื่องมือ **CASB (Cloud Access Security Broker)** ทำหน้าที่เป็นจุดบังคับใช้นโยบายความปลอดภัยระหว่างผู้ใช้งานและบริการคลาวด์ มักใช้เพื่อจัดการกับปัญหาใดขององค์กรเป็นหลัก?", "choices": {"A": "การลดความร้อนของคอมพิวเตอร์", "B": "ปัญหา Shadow IT (การที่พนักงานแอบใช้แอปพลิเคชันคลาวด์ภายนอกโดยไม่ผ่านการอนุมัติ) และการควบคุมการรั่วไหลของข้อมูล (DLP) ข้ามคลาวด์", "C": "การสำรองข้อมูลลงเทปแม่เหล็ก", "D": "การตรวจสอบความเร็วของฮาร์ดดิสก์"}, "answer": "B", "explanation": "CASB วางตัวอยู่ระหว่างผู้ใช้งานกับระบบคลาวด์ภายนอก เพื่อตรวจจับ Shadow IT, บังคับใช้นโยบายความมั่นคงปลอดภัย, ตรวจสอบการยืนยันตัวตน และป้องกันการรั่วไหลของข้อมูล (Data Loss Prevention)\n\n---"}, {"id": "ch8_q7", "chapter_id": "ch8", "chapter_title": "บทที่ 8: Cloud Security & IAM Policies", "reference": "NIST SP 800-145/63 & ISO", "q_num": 7, "question": "ตามแนวทาง **NIST SP 800-63 (Digital Identity Guidelines)** การประเมินระดับความเชื่อมั่นในอัตลักษณ์ดิจิทัลแบ่งออกเป็น 3 มิติ (Levels of Assurance) ข้อใดจับคู่ตัวย่อได้ถูกต้อง?", "choices": {"A": "CIA, AAA, IAM", "B": "IAL (Identity Assurance Level), AAL (Authenticator Assurance Level), และ FAL (Federation Assurance Level)", "C": "SSL, TLS, VPN", "D": "CPU, RAM, ROM"}, "answer": "B", "explanation": "NIST SP 800-63 แบ่งความเชื่อมั่นออกเป็น 3 ด้าน:\n- **IAL:** ความเชื่อมั่นในการพิสูจน์ยืนยันตัวตนบุคคลตอนลงทะเบียน (Identity Proofing)\n- **AAL:** ความเชื่อมั่นของอุปกรณ์และกลไกที่ใช้ล็อกอิน (Authentication & Tokens)\n- **FAL:** ความเชื่อมั่นในกระบวนการส่งต่ออัตลักษณ์ข้ามระบบ (Federation Assertions)\n\n---"}, {"id": "ch8_q8", "chapter_id": "ch8", "chapter_title": "บทที่ 8: Cloud Security & IAM Policies", "reference": "NIST SP 800-145/63 & ISO", "q_num": 8, "question": "ความแตกต่างที่สำคัญที่สุดระหว่างกระบวนการ **Authentication (การพิสูจน์ตัวตน)** และ **Authorization (การกำหนดสิทธิ์)** คือข้อใด?", "choices": {"A": "Authentication ถามว่า \"คุณมีเงินเท่าไร?\" ส่วน Authorization ถามว่า \"คุณชื่ออะไร?\"", "B": "Authentication เป็นการตรวจสอบและยืนยันว่า \"คุณคือใครจริงหรือไม่?\" (Who you are) ในขณะที่ Authorization เป็นการตรวจสอบว่า \"คุณมีสิทธิ์ทำสิ่งนั้นหรือไม่?\" (What you are allowed to do)", "C": "ทั้งสองคำมีความหมายเหมือนกันทุกประการ", "D": "Authorization ต้องทำก่อน Authentication เสมอ"}, "answer": "B", "explanation": "- **Authentication:** พิสูจน์ความจริงของตัวตนผู้ใช้ (เช่น ตรวจรหัสผ่าน, สแกนนิ้ว)\n- **Authorization:** ตรวจสอบนโยบายและสิทธิ์ในการเข้าถึงทรัพยากร (เช่น อ่านไฟล์นี้ได้หรือไม่) หลังผ่านการพิสูจน์ตัวตนแล้ว\n\n---"}, {"id": "ch8_q9", "chapter_id": "ch8", "chapter_title": "บทที่ 8: Cloud Security & IAM Policies", "reference": "NIST SP 800-145/63 & ISO", "q_num": 9, "question": "รูปแบบการควบคุมการเข้าถึงแบบ **Role-Based Access Control (RBAC)** มีหลักการทำงานอย่างไร?", "choices": {"A": "กำหนดสิทธิ์ให้ผู้ใช้แต่ละคนเป็นรายบุคคลโดยตรงตามใจผู้สร้างไฟล์", "B": "กำหนดสิทธิ์การเข้าถึงทรัพยากรให้แก่ \"บทบาทหน้าที่ (Roles)\" ภายในองค์กร จากนั้นจึงกำหนดผู้ใช้งาน (Users) ให้สังกัดในบทบาทหน้าที่นั้นๆ", "C": "กำหนดสิทธิ์ตามระดับชั้นความลับของรัฐบาล (Top Secret / Secret)", "D": "สุ่มสิทธิ์ใหม่ทุกครั้งที่เปิดเครื่อง"}, "answer": "B", "explanation": "RBAC ช่วยลดภาระการบริหารจัดการสิทธิ์ โดยผูกสิทธิ์ (Permissions) ไว้กับ Role (เช่น Role: Accountant, HR Manager) เมื่อมีพนักงานใหม่ เพียงแค่ใส่พนักงานคนนั้นลงใน Role ที่สอดคล้อง\n\n---"}, {"id": "ch8_q10", "chapter_id": "ch8", "chapter_title": "บทที่ 8: Cloud Security & IAM Policies", "reference": "NIST SP 800-145/63 & ISO", "q_num": 10, "question": "โมเดลการควบคุมการเข้าถึงแบบ **Attribute-Based Access Control (ABAC)** มีความยืดหยุ่นเหนือกว่า RBAC ดั้งเดิมอย่างไร?", "choices": {"A": "ABAC ไม่ต้องใช้เซิร์ฟเวอร์ในการประมวลผล", "B": "ABAC สามารถนำ \"คุณลักษณะ (Attributes)\" หลากหลายมิติมาประเมินร่วมกันได้ เช่น ข้อมูลผู้ใช้ (แผนก, ตำแหน่ง), ข้อมูลทรัพยากร (ระดับความลับ), ข้อมูลการกระทำ (อ่าน, เขียน) และข้อมูลสภาพแวดล้อมบริบท (เช่น วันเวลา, ตำแหน่งที่ตั้ง IP, อุปกรณ์ที่ใช้)", "C": "ABAC อนุญาตให้ผู้ใช้ทุกคนเข้าถึงข้อมูลได้โดยอัตโนมัติ", "D": "ABAC ใช้งานได้เฉพาะบนแอนดรอยด์"}, "answer": "B", "explanation": "ABAC ใช้สมบัติเชิงบริบท (Subject, Resource, Action, Environment Attributes) เช่น อนุญาตให้เข้าถึงข้อมูลลับได้เฉพาะ \"ในวันทำการ เวลา 09:00-17:00 และต้องเชื่อมต่อจากเครือข่ายสำนักงานใหญ่เท่านั้น\"\n\n---"}, {"id": "ch8_q11", "chapter_id": "ch8", "chapter_title": "บทที่ 8: Cloud Security & IAM Policies", "reference": "NIST SP 800-145/63 & ISO", "q_num": 11, "question": "โปรโตคอลมาตรฐาน **SAML 2.0 (Security Assertion Markup Language)** ใช้รูปแบบไวยากรณ์ข้อมูลแบบใดในการแลกเปลี่ยนข้อมูลการยืนยันตัวตน (Authentication Assertions) ระหว่าง Identity Provider (IdP) และ Service Provider (SP)?", "choices": {"A": "JSON (JavaScript Object Notation)", "B": "XML (eXtensible Markup Language)", "C": "CSV (Comma-Separated Values)", "D": "YAML (YAML Ain't Markup Language)"}, "answer": "B", "explanation": "SAML 2.0 เป็นมาตรฐานเปิดที่พัฒนาบนพื้นฐานของภาษา **XML** นิยมใช้อย่างแพร่หลายในระบบ Enterprise Single Sign-On (SSO) ข้ามองค์กร\n\n---"}, {"id": "ch8_q12", "chapter_id": "ch8", "chapter_title": "บทที่ 8: Cloud Security & IAM Policies", "reference": "NIST SP 800-145/63 & ISO", "q_num": 12, "question": "โพรโทคอล **OAuth 2.0** ถูกออกแบบมาเพื่อทำหน้าที่ใดเป็นหลักตามมาตรฐานทางเทคนิค?", "choices": {"A": "การพิสูจน์ตัวตนผู้ใช้งาน (Authentication Protocol)", "B": "กรอบการทำงานสำหรับการมอบอำนาจและกำหนดสิทธิ์เข้าถึงทรัพยากร (Authorization Framework) โดยใช้ Access Token", "C": "การบล็อกการโจมตีแบบ SQL Injection", "D": "การบีบอัดไฟล์ภาพ"}, "answer": "B", "explanation": "OAuth 2.0 ถูกสร้างขึ้นเพื่อเป็น **Authorization Framework** ให้แอปพลิเคชันภายนอกเข้าถึงข้อมูลหรือ API ในนามของผู้ใช้โดยไม่ต้องส่งรหัสผ่านจริง โดยใช้ Access Token แทน\n\n---"}, {"id": "ch8_q13", "chapter_id": "ch8", "chapter_title": "บทที่ 8: Cloud Security & IAM Policies", "reference": "NIST SP 800-145/63 & ISO", "q_num": 13, "question": "เทคโนโลยี **OpenID Connect (OIDC)** มีความสัมพันธ์กับ **OAuth 2.0** อย่างไร?", "choices": {"A": "เป็นเทคโนโลยีที่เป็นคู่แข่งและไม่สามารถทำงานร่วมกันได้", "B": "OpenID Connect เป็นส่วนขยายเลเยอร์การพิสูจน์ตัวตน (Authentication Layer) ที่ถูกสร้างต่อยอดอยู่บนพื้นฐานของ OAuth 2.0 โดยมีการเพิ่ม **ID Token** ในรูปแบบ JSON Web Token (JWT) เพื่อส่งข้อมูลตัวตนของผู้ใช้", "C": "OpenID Connect ใช้สำหรับส่งอีเมลขยะ", "D": "OAuth 2.0 ถูกสร้างทับบน OpenID Connect"}, "answer": "B", "explanation": "OIDC = Identity layer on top of OAuth 2.0 โดย OAuth 2.0 ให้ Access Token สำหรับ Authorization ส่วน OIDC เพิ่ม ID Token (JWT) เพื่อส่งข้อมูล Profile และ Identity ของผู้ใช้ (Authentication)\n\n---"}, {"id": "ch8_q14", "chapter_id": "ch8", "chapter_title": "บทที่ 8: Cloud Security & IAM Policies", "reference": "NIST SP 800-145/63 & ISO", "q_num": 14, "question": "โครงสร้างนโยบายความปลอดภัยแบบ JSON ของระบบคลาวด์ (เช่น **AWS IAM Policy Document**) ประกอบด้วยคีย์ระดับบนสุด (Top-level elements) สองตัวแรกที่จำเป็นต้องมี คือข้อใด?", "choices": {"A": "`\"Title\"` และ `\"Author\"`", "B": "`\"Version\"` และ `\"Statement\"`", "C": "`\"User\"` และ `\"Password\"`", "D": "`\"Header\"` และ `\"Body\"`"}, "answer": "B", "explanation": "โครงสร้างมาตรฐานของ AWS IAM Policy ในรูปแบบ JSON:\n```json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [ ... ]\n}\n```\n\n---"}, {"id": "ch8_q15", "chapter_id": "ch8", "chapter_title": "บทที่ 8: Cloud Security & IAM Policies", "reference": "NIST SP 800-145/63 & ISO", "q_num": 15, "question": "พิจารณาตัวอย่างคำสั่งนโยบาย IAM Policy ด้านล่าง:\n```json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": \"s3:GetObject\",\n      \"Resource\": \"arn:aws:s3:::my-company-backup/*\"\n    }\n  ]\n}\n```\nคำสั่งในบล็อก `\"Effect\": \"Allow\"` และ `\"Action\": \"s3:GetObject\"` นี้มีความหมายว่าอย่างไร?", "choices": {"A": "อนุญาตให้ลบ Bucket ชื่อ `my-company-backup` ได้", "B": "อนุญาตให้ดาวน์โหลดหรืออ่านไฟล์ข้อมูล (Get Object) จากทุกอ็อบเจกต์ที่อยู่ภายใน S3 Bucket ที่ชื่อ `my-company-backup`", "C": "ปฏิเสธการเข้าถึง S3 ทั้งหมด", "D": "เปลี่ยนรหัสผ่านของระบบจัดเก็บข้อมูล S3"}, "answer": "B", "explanation": "Action `s3:GetObject` คือสิทธิ์ในการอ่าน/ดาวน์โหลดไฟล์จาก S3 และเครื่องหมาย `/*` ที่ Resource หมายถึงอนุญาตทุกไฟล์ภายในบักเก็ตดังกล่าว\n\n---"}, {"id": "ch8_q16", "chapter_id": "ch8", "chapter_title": "บทที่ 8: Cloud Security & IAM Policies", "reference": "NIST SP 800-145/63 & ISO", "q_num": 16, "question": "ในเอกสารนโยบาย IAM Policy รูปแบบมาตรฐานของสตริงระบุทรัพยากร (Resource Identifier) เช่น:\n`\"arn:aws:s3:::my-company-backup/*\"`\nตัวย่อ **ARN** ย่อมาจากคำว่าอะไร?", "choices": {"A": "Advanced Routing Node", "B": "Amazon Resource Name", "C": "Automated Rule Network", "D": "Application Reference Number"}, "answer": "B", "explanation": "ARN ย่อมาจาก **Amazon Resource Name** เป็นรูปแบบไวยากรณ์สากลที่ใช้ระบุชื่อและตำแหน่งของทรัพยากรแต่ละชิ้นบน AWS อย่างไม่ซ้ำกันทั่วโลก\n\n---"}, {"id": "ch8_q17", "chapter_id": "ch8", "chapter_title": "บทที่ 8: Cloud Security & IAM Policies", "reference": "NIST SP 800-145/63 & ISO", "q_num": 17, "question": "หากในระบบ IAM Policy มีนโยบายสองข้อขัดแย้งกัน โดยข้อหนึ่งระบุ `\"Effect\": \"Allow\"` และอีกข้อหนึ่งระบุ `\"Effect\": \"Deny\"` ไปยัง Resource ตัวเดียวกัน ตามกฎสากลของ Cloud IAM นโยบายใดจะได้รับสิทธิ์เด็ดขาดในการบังคับใช้ (Evaluation Logic)?", "choices": {"A": "Allow ชนะเสมอ", "B": "Explicit Deny ชนะเสมอ (หากมีกฎสั่ง Deny แม้แต่ข้อเดียว การเข้าถึงจะถูกปฏิเสธทันที)", "C": "กฎข้อที่เขียนล่าสุดจะชนะ", "D": "ระบบจะสุ่มเลือก"}, "answer": "B", "explanation": "กฎการประเมินสิทธิ์ IAM บนระบบคลาวด์ยึดหลัก:\n1. Default Deny (เริ่มต้นไม่มีสิทธิ์)\n2. มี Allow กฎจึงจะเปิดทางให้เข้าถึงได้\n3. **Explicit Deny overrides Allow** เสมอ หากมีข้อสั่ง Deny แม้แต่ข้อเดียว จะถูกปฏิเสธทันทีโดยไม่มีข้อยกเว้น\n\n---"}, {"id": "ch8_q18", "chapter_id": "ch8", "chapter_title": "บทที่ 8: Cloud Security & IAM Policies", "reference": "NIST SP 800-145/63 & ISO", "q_num": 18, "question": "หลักการกำหนดสิทธิ์การเข้าถึงข้อมูลที่สำคัญที่สุดในระบบ IAM คือ **Principle of Least Privilege** ข้อใดอธิบายหลักการนี้ได้ถูกต้อง?", "choices": {"A": "ให้สิทธิ์ระดับ Administrator แก่พนักงานทุกคนเพื่อความสะดวกรวดเร็วในการทำงาน", "B": "การกำหนดสิทธิ์ให้ผู้ใช้งาน โปรแกรม หรือเซอร์วิส มีสิทธิ์เข้าถึงเฉพาะทรัพยากรและคำสั่งที่จำเป็นต้องใช้ในการปฏิบัติงานตามหน้าที่เท่านั้น ไม่ให้เกินความจำเป็น", "C": "การไม่ให้สิทธิ์ใครเลยแม้กระทั่งผู้ดูแลระบบ", "D": "การเปลี่ยนรหัสผ่านทุกๆ 1 ชั่วโมง"}, "answer": "B", "explanation": "หลักการ Least Privilege ระบุว่าผู้ใช้หรือโปรเซสควรได้รับสิทธิ์ในระดับต่ำที่สุดเท่าที่เพียงพอต่อการปฏิบัติหน้าที่ให้ลุล่วง เพื่อจำกัดขอบเขตความเสียหาย (Blast Radius) หากบัญชีนั้นถูกแฮกหรือถูกขโมยสิทธิ์"}];
    let currentChapter = 'all';
    let list = [...QUESTIONS];
    let idx = 0;
    let answers = {};

    function formatText(t) {
      if (!t) return '';
      return t
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/`([^`]+)`/g, '<code class="px-1 py-0.5 rounded bg-black/30 text-emerald-300 font-mono text-[11px]">$1</code>')
        .replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>');
    }

    function changeChapter(val) {
      currentChapter = val;
      list = (val === 'all') ? [...QUESTIONS] : QUESTIONS.filter(q => q.chapter_id === val);
      idx = 0;
      render();
    }

    function shuffleQ() {
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      idx = 0;
      render();
    }

    function render() {
      if (list.length === 0) return;
      const q = list[idx];
      document.getElementById('q-category').textContent = q.chapter_title;
      document.getElementById('q-index').textContent = `ข้อที่ ${idx + 1} / ${list.length}`;
      document.getElementById('q-text').innerHTML = formatText(q.question);

      const box = document.getElementById('choices-box');
      box.innerHTML = '';
      const ans = answers[q.id];

      ['A', 'B', 'C', 'D'].forEach(letter => {
        const btn = document.createElement('button');
        let style = 'bg-[var(--background)] hover:border-blue-400 border-[var(--border)] text-[var(--foreground)]';
        
        if (ans) {
          btn.disabled = true;
          if (letter === q.answer) {
            style = 'bg-emerald-500/20 border-emerald-500 text-emerald-400 font-bold ring-1 ring-emerald-500';
          } else if (ans.selected === letter) {
            style = 'bg-rose-500/20 border-rose-500 text-rose-400 font-bold';
          } else {
            style = 'opacity-40 border-[var(--border)] text-[var(--muted-foreground)]';
          }
        }

        btn.className = `w-full text-left p-2.5 sm:p-3 rounded-xl border transition flex items-start gap-2.5 text-xs sm:text-sm ${style}`;
        btn.onclick = () => choose(letter);
        btn.innerHTML = `
          <span class="w-5 h-5 rounded-md flex-shrink-0 flex items-center justify-center font-bold text-[11px] border border-current">
            ${letter}
          </span>
          <span class="pt-0.5 leading-snug">${formatText(q.choices[letter] || '')}</span>
        `;
        box.appendChild(btn);
      });

      const fb = document.getElementById('feedback-box');
      const fbt = document.getElementById('feedback-title');
      const fbd = document.getElementById('feedback-desc');

      if (ans) {
        fb.classList.remove('hidden');
        if (ans.isCorrect) {
          fb.className = 'rounded-xl border border-emerald-500/40 bg-emerald-500/10 text-emerald-300 p-3 space-y-1.5';
          fbt.innerHTML = '<span>✓ ถูกต้อง!</span>';
        } else {
          fb.className = 'rounded-xl border border-rose-500/40 bg-rose-500/10 text-rose-300 p-3 space-y-1.5';
          fbt.innerHTML = `<span>✕ ยังไม่ถูกต้อง (คำตอบคือข้อ ${q.answer})</span>`;
        }
        fbd.innerHTML = `<strong>เฉลย:</strong> ${formatText(q.explanation)}`;
      } else {
        fb.classList.add('hidden');
      }

      document.getElementById('btn-p').disabled = (idx === 0);
      document.getElementById('btn-n').disabled = (idx === list.length - 1);
      updateScore();
    }

    function choose(letter) {
      const q = list[idx];
      if (answers[q.id]) return;
      answers[q.id] = { selected: letter, isCorrect: (letter === q.answer) };
      render();
    }

    function prevQ() { if (idx > 0) { idx--; render(); } }
    function nextQ() { if (idx < list.length - 1) { idx++; render(); } }

    function updateScore() {
      let c = 0, t = 0;
      Object.values(answers).forEach(a => { t++; if (a.isCorrect) c++; });
      document.getElementById('score-badge').textContent = `${c}/${t} ถูก (${t>0?Math.round(c/t*100):0}%)`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      list = [...QUESTIONS];
      render();
    });
  </script>
</body>
</html>
